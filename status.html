<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#075E54">
<title>Status Creator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f5f4;--sf:#ffffff;--sf2:#e8eeec;--tx:#111b21;--tx2:#667781;--ln:rgba(0,0,0,.07);
  --pr:#128C7E;--ac:#25D366;--hd:#075E54;
  --sh:240px;--tbh:62px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#0b141a;--sf:#1f2c34;--sf2:#2b3a43;--tx:#e9edef;--tx2:#8696a0;--ln:rgba(255,255,255,.08);
  --pr:#2fd08f;--hd:#1f2c34;
}
html{height:100%}
body{
  position:fixed;left:0;top:0;right:0;bottom:0;width:100%;height:100%;overflow:hidden;
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;outline:none}
.app{position:absolute;left:0;right:0;top:0;bottom:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}

/* ---------- SCREEN STACK ---------- */
.scr{
  position:absolute;left:0;top:0;right:0;bottom:0;background:var(--bg);
  display:flex;flex-direction:column;
  visibility:hidden;transform:translateX(100%);
  transition:transform .3s var(--ease),visibility 0s .3s;
}
.scr.on{visibility:visible;transform:none;transition:transform .3s var(--ease),visibility 0s 0s}
.scr.under{transform:translateX(-22%);transition:transform .3s var(--ease),visibility 0s .3s}

/* ---------- HEADER ---------- */
.hd{
  flex:none;height:54px;display:flex;align-items:center;
  padding:0 8px 0 6px;background:var(--hd);color:#fff;position:relative;z-index:3;
}
@supports (padding-top:env(safe-area-inset-top)){
  .hd{height:calc(54px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}
}
.ib{
  flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.ib:active{background:rgba(255,255,255,.2)}
.ib i{display:block;width:24px;height:24px}
.ttl{flex:1;min-width:0;padding:0 6px}
.ttl b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ttl small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  flex:none;height:36px;border:0;border-radius:18px;background:var(--ac);color:#06332a;
  font-weight:700;font-size:14px;padding:0 18px;margin-right:4px;transition:transform .12s;
}
.pill:active{transform:scale(.95)}
i svg{display:block;width:100%;height:100%}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}

/* ---------- HOME ---------- */
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px 22px}
.hero{
  display:flex;align-items:center;width:100%;border:0;border-radius:18px;padding:16px;margin-bottom:20px;
  color:#fff;text-align:left;background:linear-gradient(135deg,#075E54,#25D366);
}
.hero .hi{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;margin-right:14px}
.hero .hi i{width:24px;height:24px}
.hero b{display:block;font-size:16px}
.hero small{display:block;font-size:12.5px;opacity:.9}
.sec{font-size:13px;font-weight:600;color:var(--tx2);margin:0 2px 10px;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:10px;gap:10px}
.cat{
  position:relative;border:0;border-radius:16px;padding:12px 12px 12px;color:#fff;text-align:left;min-height:94px;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  background-image:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.15)),var(--g);
}
.cat .ci{position:absolute;right:10px;top:8px;font-size:34px;line-height:1}
.cat b{font-size:14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3);line-height:1.25}
.cat small{font-size:11px;opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.3)}
@media (min-width:430px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- QUOTES ---------- */
.sbar{flex:none;padding:10px 14px 6px}
.sbar input{
  width:100%;height:44px;border:0;border-radius:22px;background:var(--sf);color:var(--tx);
  padding:0 18px;font-size:15px;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.08);
  -webkit-user-select:text;user-select:text;font-family:inherit;
}
.sbar input::placeholder{color:var(--tx2)}
.qlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px 22px}
.q{
  display:block;width:100%;text-align:left;border:0;background:var(--sf);color:var(--tx);
  border-radius:14px;padding:14px 16px 14px 19px;margin-bottom:9px;font-size:14.5px;line-height:1.55;
  position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:background .12s;
  content-visibility:auto;contain-intrinsic-size:auto 84px;
}
.q::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--cc,#25D366)}
.q:active{background:var(--sf2)}
.empty{text-align:center;color:var(--tx2);padding:48px 0;font-size:14px}

/* ---------- EDITOR ---------- */
.strip{flex:none;height:46px;display:flex;align-items:center;padding:0 12px 0 12px}
.sb{
  flex:none;width:38px;height:38px;border:0;border-radius:50%;background:var(--sf);color:var(--tx);
  display:flex;align-items:center;justify-content:center;margin-right:8px;box-shadow:0 1px 3px rgba(0,0,0,.14);
  transition:opacity .15s,transform .12s;
}
.sb:active{transform:scale(.92)}
.sb i{display:block;width:20px;height:20px}
.sb[disabled]{opacity:.35;pointer-events:none}
.strip .sp{flex:1}
.selg{display:flex;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .18s,transform .18s}
.selg.on{opacity:1;pointer-events:auto;transform:none}
.selg .sb{margin:0 0 0 8px}
.selg .sb.del{color:#e5484d}
.sbox{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{
  position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#000;
  box-shadow:0 8px 28px rgba(0,0,0,.28);touch-action:none;
  transition:transform .3s var(--ease);
}
.ly{position:absolute;left:0;top:0;right:0;bottom:0}
#phL,#dimL{display:none}
#phL{background-size:cover;background-position:center;background-repeat:no-repeat}
#items{position:absolute;left:0;top:0;right:0;bottom:0}
.item{position:absolute;left:0;top:0;touch-action:none}
.item .in{position:relative;transform:translate(-50%,-50%);white-space:pre}
.item .in::after{content:'';position:absolute;left:-12px;right:-12px;top:-12px;bottom:-12px}
.item.sel .in{outline:2px dashed #25D366;outline-offset:6px}
.item .in div{white-space:pre}
.stk .in{line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
#frameL{pointer-events:none}

/* toolbar */
.tb{
  flex:none;display:flex;background:var(--sf);border-top:1px solid var(--ln);
  padding:6px 6px 6px;position:relative;z-index:6;
}
@supports (padding-bottom:env(safe-area-inset-bottom)){.tb{padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
.tb button{
  flex:1;border:0;background:none;color:var(--tx2);display:flex;flex-direction:column;align-items:center;
  font-size:11px;font-weight:600;padding:6px 0 4px;border-radius:12px;transition:color .15s;
}
.tb button i{display:block;width:24px;height:24px;margin-bottom:3px;transition:transform .25s var(--ease)}
.tb button.on{color:var(--pr)}
.tb button.on i{transform:translateY(-2px) scale(1.1)}
.kb .tb{display:none}

/* bottom sheet */
.sheet{
  position:absolute;left:0;right:0;bottom:var(--tbh);height:var(--sh);z-index:5;
  background:var(--sf);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
  transform:translateY(110%);visibility:hidden;
  transition:transform .3s var(--ease),visibility 0s .3s;
}
.sheet.on{transform:none;visibility:visible;transition:transform .3s var(--ease),visibility 0s 0s}
.kb .sheet{bottom:0}
.grab{flex:none;height:24px;display:flex;align-items:center;justify-content:center}
.grab::before{content:'';width:38px;height:4px;border-radius:2px;background:var(--sf2)}
.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 14px 16px}
.pn{display:none}
.pn.on{display:block}
.lb{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--tx2);margin:14px 0 8px;letter-spacing:.2px}
.pn>.lb:first-child{margin-top:2px}
.ta{
  display:block;width:100%;border:0;border-radius:14px;background:var(--sf2);color:var(--tx);
  padding:11px 14px;font-family:inherit;font-size:15px;line-height:1.45;resize:none;outline:none;
  -webkit-user-select:text;user-select:text;
}
.chips{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{
  flex:none;border:0;border-radius:18px;background:var(--sf2);color:var(--tx);
  padding:8px 15px;font-size:13px;margin:0 8px 8px 0;white-space:nowrap;transition:background .15s,color .15s;
}
.chip.on{background:var(--pr);color:#fff}
.mini{
  border:0;border-radius:14px;background:var(--sf2);color:var(--tx);font-size:12px;font-weight:600;
  padding:6px 12px;display:flex;align-items:center;
}
.mini i{width:15px;height:15px;margin-right:6px}
.sws{display:flex;flex-wrap:wrap}
.sw{
  flex:none;width:36px;height:36px;border-radius:50%;border:0;margin:3px 10px 10px 3px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .15s;
}
.sw.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 0 0 3px var(--sf),0 0 0 5px var(--pr);transform:scale(1.04)}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;color:var(--tx2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button i{width:18px;height:18px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.row2{display:flex}
.row2 .seg:first-child{flex:3;margin-right:10px}
.row2 .seg:last-child{flex:2}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;background:transparent;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--sf2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--pr);margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.btns{display:flex}
.btn{
  flex:1;height:44px;border:0;border-radius:14px;background:var(--sf2);color:var(--tx);font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-right:10px;transition:transform .12s;
}
.btn:last-child{margin-right:0}
.btn:active{transform:scale(.97)}
.btn i{width:20px;height:20px;margin-right:8px}
.btn.pri{background:var(--pr);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}
.eg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.eg button{border:0;background:none;font-size:27px;line-height:1;height:46px;border-radius:12px;transition:background .1s}
.eg button:active{background:var(--sf2)}
.hint{font-size:12px;color:var(--tx2);margin-top:10px}

/* modal export */
.mask{
  position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.48);z-index:30;
  opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;
}
.mask.on{opacity:1;visibility:visible;transition:opacity .25s}
.dlg{
  position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:22px 22px 0 0;
  padding:10px 16px 20px;transform:translateY(100%);transition:transform .3s var(--ease);
}
@supports (padding-bottom:env(safe-area-inset-bottom)){.dlg{padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.mask.on .dlg{transform:none}
.dh{width:38px;height:4px;border-radius:2px;background:var(--sf2);margin:0 auto 14px}
.dt{display:block;font-size:17px;font-weight:700}
.di{display:block;font-size:12.5px;color:var(--tx2);margin:2px 0 16px}
.dlg .btn{width:100%;flex:none;margin:0 0 10px;height:50px;font-size:15px}

/* busy / toast / boot / error */
.busy{position:absolute;left:0;top:0;right:0;bottom:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:14px}
.busy.on{display:flex}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;margin-bottom:12px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{
  position:absolute;left:50%;bottom:96px;z-index:50;max-width:84%;text-align:center;
  background:rgba(25,25,25,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
  opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:opacity .22s,transform .22s var(--ease);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
#boot{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:60;background:#075E54;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:15px;
  transition:opacity .3s;
}
#boot b{font-size:22px;margin-bottom:6px}
#boot.off{opacity:0;pointer-events:none}
#err{
  display:none;position:fixed;left:0;right:0;bottom:0;max-height:55%;overflow:auto;z-index:100;
  background:#7f1d1d;color:#fff;font:12px/1.45 monospace;padding:12px;white-space:pre-wrap;
  -webkit-user-select:text;user-select:text;
}
</style>
</head>
<body>

<div id="err"></div>

<div class="app" id="app">

  <!-- ===================== HOME ===================== -->
  <section class="scr on" id="s-home">
    <header class="hd">
      <div class="ttl" style="padding-left:12px">
        <b>Status Creator</b>
        <small>Buat status WhatsApp keren</small>
      </div>
      <button class="ib" id="btnTheme" aria-label="Ganti tema"><i data-ic="moon"></i></button>
    </header>
    <div class="body">
      <button class="hero press" id="btnBlank">
        <span class="hi"><i data-ic="edit"></i></span>
        <span><b>Tulis sendiri</b><small>Mulai dari kanvas kosong</small></span>
      </button>
      <div class="sec">Pilih kategori</div>
      <div class="grid" id="catGrid"></div>
    </div>
  </section>

  <!-- ===================== QUOTES ===================== -->
  <section class="scr" id="s-quotes">
    <header class="hd">
      <button class="ib" data-back aria-label="Kembali"><i data-ic="back"></i></button>
      <div class="ttl"><b id="qt">Kategori</b><small id="qs"></small></div>
    </header>
    <div class="sbar"><input id="qsearch" type="text" placeholder="Cari kata-kata…" autocomplete="off"></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <!-- ===================== EDITOR ===================== -->
  <section class="scr" id="s-editor">
    <header class="hd">
      <button class="ib" data-back aria-label="Kembali"><i data-ic="back"></i></button>
      <div class="ttl"><b id="et">Desain Baru</b></div>
      <button class="pill" id="btnExport">Simpan</button>
    </header>

    <div class="strip">
      <button class="sb" id="btnUndo" aria-label="Urungkan" disabled><i data-ic="undo"></i></button>
      <button class="sb" id="btnRedo" aria-label="Ulangi" disabled><i data-ic="redo"></i></button>
      <div class="sp"></div>
      <div class="selg" id="selg">
        <button class="sb" id="btnMinus" aria-label="Perkecil"><i data-ic="minus"></i></button>
        <button class="sb" id="btnPlus" aria-label="Perbesar"><i data-ic="plus"></i></button>
        <button class="sb del" id="btnDel" aria-label="Hapus"><i data-ic="trash"></i></button>
      </div>
    </div>

    <div class="sbox" id="sbox">
      <div id="stage">
        <div class="ly" id="bgL"></div>
        <div class="ly" id="phL"></div>
        <div class="ly" id="dimL"></div>
        <div id="items">
          <div class="item" id="tItem" data-id="t" style="display:none"><div class="in" id="tIn"></div></div>
        </div>
        <div class="ly" id="frameL"></div>
      </div>
    </div>

    <nav class="tb" id="tb">
      <button data-tab="text"><i data-ic="type"></i>Teks</button>
      <button data-tab="bg"><i data-ic="image"></i>Latar</button>
      <button data-tab="st"><i data-ic="smile"></i>Stiker</button>
      <button data-tab="fr"><i data-ic="frame"></i>Bingkai</button>
      <button data-tab="sz"><i data-ic="ratio"></i>Ukuran</button>
    </nav>

    <div class="sheet" id="sheet">
      <div class="grab" id="grab"></div>
      <div class="sbody" id="sbody">

        <div class="pn" id="p-text">
          <textarea class="ta" id="tx" rows="2" placeholder="Ketik teks status…" maxlength="700"></textarea>
          <div class="lb"><span>Font</span><button class="mini" id="btnRnd" type="button"><i data-ic="shuffle"></i>Kutipan acak</button></div>
          <div class="chips" id="fontChips"></div>
          <div class="lb"><span>Ukuran</span><span id="szv">26</span></div>
          <input type="range" id="sz" min="12" max="72" value="26">
          <div class="lb"><span>Gaya</span></div>
          <div class="row2">
            <div class="seg">
              <button data-al="left"><i data-ic="alL"></i></button>
              <button data-al="center"><i data-ic="alC"></i></button>
              <button data-al="right"><i data-ic="alR"></i></button>
            </div>
            <div class="seg">
              <button id="btnB" style="font-weight:900">B</button>
              <button id="btnI" style="font-family:Georgia,serif;font-style:italic;font-size:15px">I</button>
            </div>
          </div>
          <div class="lb"><span>Warna teks</span></div>
          <div class="sws" id="colSw"></div>
          <div class="lb"><span>Efek</span></div>
          <div class="chips" id="fxChips"></div>
        </div>

        <div class="pn" id="p-bg">
          <div class="lb"><span>Warna latar</span></div>
          <div class="sws" id="bgSw"></div>
          <div class="lb"><span>Foto latar</span></div>
          <div class="btns">
            <button class="btn pri" id="btnPhoto"><i data-ic="image"></i>Pilih foto</button>
            <button class="btn" id="btnPhotoDel" disabled><i data-ic="trash"></i>Hapus</button>
          </div>
          <div id="phopts" style="display:none">
            <div class="lb"><span>Efek foto</span></div>
            <div class="chips" id="pfxChips"></div>
            <div class="lb"><span>Gelapkan foto</span><span id="dimv">25%</span></div>
            <input type="range" id="dim" min="0" max="75" value="25">
          </div>
        </div>

        <div class="pn" id="p-st">
          <div class="chips" id="stTabs"></div>
          <div class="eg" id="stGrid"></div>
        </div>

        <div class="pn" id="p-fr">
          <div class="lb"><span>Bingkai</span></div>
          <div class="chips wrap" id="frChips"></div>
        </div>

        <div class="pn" id="p-sz">
          <div class="lb"><span>Rasio</span></div>
          <div class="seg">
            <button data-ra="9:16">Status 9:16</button>
            <button data-ra="1:1">Kotak 1:1</button>
            <button data-ra="4:5">Potret 4:5</button>
          </div>
          <div class="lb"><span>Kualitas</span></div>
          <div class="seg">
            <button data-hd="0">Standar</button>
            <button data-hd="1">HD</button>
          </div>
          <div class="hint" id="szHint"></div>
        </div>

      </div>
    </div>

    <div class="mask" id="mask">
      <div class="dlg">
        <div class="dh"></div>
        <b class="dt">Simpan desain</b>
        <small class="di" id="dinfo"></small>
        <button class="btn pri" id="bSave"><i data-ic="download"></i>Simpan ke Galeri</button>
        <button class="btn" id="bShare"><i data-ic="share"></i>Bagikan</button>
      </div>
    </div>
  </section>

pat daripada pesan pasangan.","Kamu berdoa, Ya Allah, berikan aku kehidupan yang tenang, Tapi grup WhatsApp ramai sedikit saja langsung ikut membaca semuanya.","Kamu berdoa, Ya Allah, jauhkan aku dari gosip, Tapi kalau ada kabar terbaru, kamu orang pertama yang bertanya, Serius? Cerita dong.","Kamu berdoa, Ya Allah, berikan aku tubuh yang sehat, Tapi olahraga baru lima menit sudah merasa pantas makan gorengan sepuluh.","Kamu berdoa, Ya Allah, cukupkan rezekiku, Tapi saldo berkurang Rp50.000 saja langsung melakukan audit keuangan nasional.","Kamu berdoa, Ya Allah, jadikan aku orang sabar, Tapi internet lemot tiga detik saja sudah memanggil semua nama yang ada.","Kamu berdoa, Ya Allah, hilangkan rasa malas dari diriku, Tapi alarm berbunyi, tangan lebih cepat mematikan alarm daripada niat memperbaiki hidup.","Kamu berdoa, Ya Allah, berikan aku kesuksesan, Tapi baru buka laptop, tangan sudah otomatis membuka media sosial.","Kamu berdoa, Ya Allah, berkahi waktuku, Tapi dua jam habis melihat video pendek dan masih berkata, Sebentar lagi tidur","Kamu berdoa, Ya Allah, jadikan aku rendah hati, Tapi baru dipuji sedikit sudah ingin semua orang tahu.","Kamu berdoa, Ya Allah, jangan jadikan aku boros, Tapi lihat tulisan SALE langsung lupa isi dompet.","Kamu berdoa, Ya Allah, berikan aku rezeki tanpa disangka-sangka, Tapi ketika rezeki datang dalam bentuk pekerjaan, kamu bilang, Waduh, capek nih.","Kamu berdoa, Ya Allah, ubah hidupku,Tapi ketika Allah memberi kesempatan untuk berubah, kamu malah bilang, Besok saja, hari ini masih sibuk.","Percayalah pada rencana Allah, karena sesuatu yang belum kamu pahami hari ini bisa menjadi alasanmu bersyukur esok hari.","Jangan buru-buru menganggap hidupmu buruk, bisa jadi Allah sedang mengarahkanmu menuju sesuatu yang lebih baik.","Jika doamu belum terkabul, tetaplah berbaik sangka karena Allah tahu kapan hatimu siap menerima jawabannya.","Ketika satu pintu tertutup, percayalah Allah masih memiliki banyak jalan yang belum kamu lihat.","Tak perlu takut dengan hari esok, karena Allah yang menjaga hari ini juga akan menjaga langkahmu nanti.","Jika sesuatu menjauh darimu, percayalah mungkin Allah sedang menyelamatkanmu dari sesuatu yang belum kamu ketahui.","Tenangkan hatimu, rezeki yang Allah tuliskan untukmu tidak akan tertukar dengan milik siapa pun.","Jangan kecewa dengan jalan yang berliku, bisa jadi setiap belokannya sedang membawamu lebih dekat kepada Allah.","Percayalah, tidak ada doa yang sia-sia ketika kamu menyerahkannya dengan penuh keyakinan kepada Allah.","Jika hari ini terasa berat, yakinlah Allah juga sedang menyiapkan kekuatan untuk melewatinya.","Jangan takut kehilangan sesuatu yang kamu cintai, karena Allah lebih tahu apa yang benar-benar baik untukmu.","Berbaik sangkalah kepada Allah, bahkan ketika jawaban-Nya belum sesuai dengan apa yang kamu harapkan.","Mungkin Allah belum memberikan yang kamu inginkan karena Dia sedang menyiapkan sesuatu yang lebih sesuai dengan kebutuhanmu.","Tak perlu iri melihat kebahagiaan orang lain, karena Allah juga sedang menulis cerita indah untuk hidupmu.","Jika langkahmu terasa lambat, tetaplah tenang karena Allah tidak pernah terlambat dalam menentukan waktu.","Percayalah bahwa setiap kesulitan memiliki akhir, dan Allah mampu menghadirkan kemudahan dari arah yang tidak kamu sangka.","Ketika rencanamu gagal, jangan langsung menganggap semuanya berakhir karena bisa jadi Allah sedang membuka rencana yang lebih baik.","Syukuri apa yang ada hari ini, sambil tetap percaya bahwa Allah mampu menghadirkan lebih banyak kebaikan di hari esok.","Jangan terlalu khawatir tentang apa yang belum terjadi, serahkan masa depan kepada Allah dan jalani hari ini dengan penuh syukur.","Selama kamu masih berharap kepada Allah, selalu ada alasan untuk percaya bahwa hari-hari baik sedang menuju kepadamu.","Renungan hari ini -> Allah tidak membebani seseorang melainkan sesuai dengan kesanggupannya. QS. Al-Baqarah: 286","Renungan hari ini -> Sesungguhnya bersama kesulitan ada kemudahan. QS. Al-Insyirah: 6","Renungan hari ini -> Janganlah kamu berputus asa dari rahmat Allah. QS. Az-Zumar: 53","Renungan hari ini -> Dan barang siapa bertawakal kepada Allah, niscaya Allah akan mencukupkan keperluannya. QS. At-Talaq: 3","Renungan hari ini -> Karena itu, ingatlah kamu kepada-Ku, niscaya Aku ingat pula kepadamu. QS. Al-Baqarah: 152","Renungan hari ini -> Nabi mengajarkan bahwa orang yang kuat bukanlah yang mampu mengalahkan orang lain, tetapi yang mampu mengendalikan dirinya ketika marah. Kekuatan sejati dimulai dari kemampuan menguasai diri. HR. Bukhari dan Muslim.","Kamu ingin dihargai, tapi ucapanmu sering merendahkan orang lain. Ingat, akhlakmu berbicara lebih keras daripada kata-katamu.","Kamu ingin Allah menutupi aibmu, tapi aib orang lain justru kamu ceritakan ke mana-mana. Belajarlah menjaga sebelum meminta dijaga.","Kamu sibuk menghitung kesalahan orang lain, sampai lupa memperbaiki kesalahanmu sendiri.","Kamu ingin hidupmu tenang, tapi setiap hari hatimu dipenuhi iri melihat kebahagiaan orang lain.","Kamu ingin mendapatkan maaf dari Allah, tapi memaafkan kesalahan manusia saja masih terasa berat.","Kamu rajin menasihati orang lain, tapi lupa bahwa nasihat yang paling sulit adalah menasihati diri sendiri.","Kamu takut kehilangan rezeki, sampai lupa bahwa rezeki bukan hanya tentang uang, tetapi juga tentang nikmat yang sering kamu abaikan.","Kamu ingin doamu dikabulkan, tetapi kewajiban kepada Allah masih sering kamu tunda. Jangan hanya dekat ketika sedang membutuhkan.","Kamu kecewa ketika orang tidak menghargaimu, tapi sudahkah kamu menghargai orang yang selama ini selalu ada untukmu?","Kamu ingin diperlakukan dengan lembut, tetapi lisanmu masih mudah melukai. Mulailah dari dirimu sendiri.","Kamu merasa paling benar karena melihat kesalahan orang lain, padahal Allah lebih tahu apa yang tersembunyi di dalam hatimu.","Kamu meminta Allah mengubah keadaanmu, tetapi ketika kesempatan berubah datang, kamu masih nyaman dengan kebiasaan lama.","Kamu ingin dicintai karena kebaikanmu, tetapi ketika berbuat baik kamu masih menunggu pujian. Ikhlaskan, Allah sudah melihatnya.","Kamu mengeluh tidak punya waktu untuk beribadah, tetapi setiap hari selalu punya waktu untuk hal yang tidak penting.","Kamu takut manusia mengetahui kekuranganmu, tetapi lupa bahwa tidak ada satu pun yang tersembunyi dari Allah.","Kamu ingin mendapatkan pasangan yang baik, tetapi dirimu sendiri masih enggan belajar menjadi pribadi yang baik.","Kamu mudah tersinggung ketika ditegur, tetapi begitu ringan menegur kesalahan orang lain.","Kamu mengejar pengakuan manusia sampai lupa bahwa yang paling penting adalah bagaimana Allah memandangmu.","Kamu merasa hidupmu paling berat, sampai lupa bahwa mungkin yang kamu anggap ujian adalah cara Allah mendewasakanmu.","Jangan terlalu sibuk memperbaiki citra di hadapan manusia, sampai lupa memperbaiki diri di hadapan Allah.","Nabi Sulaiman kaya raya, tapi tahu diri bahwa semua itu titipan Allah. Kita baru punya sedikit, sudah sibuk pamer.","Nabi Ayyub diuji dengan sakit bertahun-tahun, kita baru demam sehari sudah merasa paling menderita.","Nabi Ya'qub kehilangan Yusuf, tapi tidak kehilangan harapan kepada Allah. Kita kehilangan sedikit, langsung menyalahkan takdir.","Nabi Yusuf dizalimi saudara sendiri, tapi ketika berkuasa beliau memilih memaafkan. Kita disindir sedikit saja, dendamnya bertahun-tahun.","Nabi Nuh berdakwah begitu lama, tapi kita baru sekali ditolak sudah malas berbuat baik.","Nabi Ibrahim berdiri sendirian mempertahankan tauhid. Kita ramai-ramai saja masih takut berbeda.","Nabi Musa menghadapi Fir'aun, kita menghadapi masalah kecil saja sudah bilang, “Aku tidak kuat.”","Nabi Yunus berada dalam kegelapan, tapi tetap kembali kepada Allah. Kita sedang susah malah menjauh dari-Nya.","Nabi Zakariya berdoa di usia tua dan tidak berhenti berharap. Kita baru berdoa sebentar sudah bertanya, “Kapan dikabulkan?”","Nabi Ismail taat ketika diuji dengan sesuatu yang sangat berat. Kita kehilangan sedikit kenyamanan saja sudah banyak mengeluh.","Nabi Daud diberi kekuasaan, tetapi tetap beribadah kepada Allah. Kita baru diberi jabatan sedikit sudah merasa paling penting.","Nabi Muhammad hidup sederhana meski menjadi manusia pilihan Allah. Kita punya sedikit lebih saja sudah ingin semua orang tahu.","Nabi Yusuf pernah berada di penjara sebelum mendapatkan kedudukan. Kita baru gagal sekali sudah merasa hidup selesai.","Nabi Ya'qub menangis karena kehilangan Yusuf, tetapi tetap bersangka baik kepada Allah. Kita sedih sedikit langsung menganggap Allah tidak adil.","Nabi Ibrahim rela meninggalkan sesuatu yang dicintainya demi Allah. Kita diminta meninggalkan kebiasaan buruk saja masih banyak alasan.","Nabi Musa pernah merasa takut, tetapi tetap melangkah bersama pertolongan Allah. Kita takut duluan sebelum mencoba.","Nabi Ayyub kehilangan banyak hal, tetapi lisannya tetap menjaga kesabaran. Kita kehilangan uang sedikit, satu kampung tahu keluhannya.","Nabi Sulaiman memiliki kerajaan yang besar, tetapi mengakui semuanya sebagai karunia Allah. Kita punya motor baru saja sudah lupa diri.","Nabi Yusuf dikhianati, tetapi tidak membiarkan pengkhianatan mengubah hatinya menjadi buruk. Kita disakiti sekali, semua orang ikut kena.","Para Nabi diuji dengan berat, bukan karena Allah membenci mereka. Jadi jangan merasa setiap ujian berarti Allah sedang meninggalkanmu.","Kadang kita sibuk mencari kebahagiaan di luar rumah, padahal keluarga yang selalu mendoakan kita adalah salah satu nikmat terbesar dari Allah.","Jangan tunggu kehilangan orang tua untuk menyadari bahwa waktu bersama mereka adalah rezeki yang tidak bisa dibeli.","Rumah tidak harus mewah untuk menjadi tempat paling nyaman, cukup ada keluarga yang saling menyayangi karena Allah.","Orang tua mungkin tidak selalu meminta apa-apa, tetapi doa mereka sering menjadi alasan Allah memudahkan langkah kita.","Jangan terlalu sibuk mencari nafkah sampai lupa, keluarga juga membutuhkan kehadiranmu, bukan hanya uangmu.","Pasanganmu mungkin tidak sempurna, tetapi jangan lupa bahwa kamu pun datang ke dalam pernikahan bukan sebagai manusia sempurna.","Anak-anak tidak selamanya kecil, jadi nikmati waktumu bersama mereka sebelum masa itu menjadi kenangan.","Jangan jadikan rumah tempat melampiaskan emosi, karena orang yang paling mencintaimu tidak seharusnya menjadi tempat menerima lukamu.","Jika hari ini masih bisa makan bersama keluarga, bersyukurlah, karena tidak semua orang masih memiliki kesempatan yang sama.","Kadang hadiah terbaik untuk keluarga bukan barang mahal, tetapi waktu, perhatian, dan ucapan yang lembut.","Jangan malu meminta maaf kepada keluarga, karena mempertahankan ego tidak pernah membuat rumah menjadi lebih damai.","Orang tua semakin tua, anak-anak semakin dewasa, dan waktu terus berjalan. Jangan sampai kita sadar ketika semuanya sudah terlambat.","Rezeki bukan hanya uang yang masuk ke rumah, tetapi juga keluarga yang masih sehat dan bisa berkumpul bersama.","Jika pasanganmu sedang lelah, jangan tambah bebannya dengan tuntutan. Bisa jadi dia hanya membutuhkan seseorang yang mau memahami.","Anak mungkin lupa mainan yang kamu belikan, tetapi mereka akan mengingat bagaimana perasaan mereka ketika bersama orang tuanya.","Jangan ukur keberhasilan keluarga hanya dari rumah dan kendaraan, ukur juga dari seberapa dekat hati mereka kepada Allah.","Sebesar apa pun masalah di luar rumah, jangan biarkan pertengkaran membuat keluarga kehilangan tempat untuk pulang.","Jika keluargamu masih lengkap hari ini, jangan terlalu sibuk dengan ponsel sampai lupa menikmati wajah-wajah yang suatu hari akan kamu rindukan.","Maafkan kesalahan keluarga selagi masih ada waktu, karena penyesalan sering datang ketika orang yang ingin kita peluk sudah tidak ada.","Doakan keluargamu diam-diam, karena bisa jadi doa yang tidak pernah mereka dengar justru menjadi sebab Allah menjaga mereka.","Kadang sepuluh kebaikanmu dilupakan hanya karena satu kesalahanmu. Begitulah manusia, maka jangan bergantung pada penilaian mereka.","Kamu sudah sering membantu, sekali tidak bisa membantu langsung dianggap berubah. Jangan kecewa, Allah tahu alasanmu.","Ketika kamu berbuat baik, mereka menganggapnya biasa. Ketika sekali salah, mereka mengingatnya lama. Tetaplah baik, bukan untuk pujian manusia.","Pujianmu mungkin hanya sebentar diingat manusia, tetapi kebaikan yang ikhlas tidak pernah luput dari pengetahuan Allah.","Kadang orang hanya mengingat saat kamu mengecewakan, bukan saat kamu berkali-kali membahagiakan. Jangan biarkan itu mengubah hatimu.","Kamu membantu saat mereka kesulitan, tetapi ketika kamu membutuhkan mereka, belum tentu mereka ada. Tetap berbuat baik, karena balasanmu bukan selalu dari manusia.","Jangan heran jika kebaikanmu tidak disebut, sementara kesalahanmu terus diceritakan. Manusia punya ingatan yang berbeda dengan Allah.","Kadang kamu diam demi menjaga perasaan, tetapi justru dianggap tidak peduli. Tidak semua kebaikan harus dijelaskan.","Jangan berhenti menjadi baik hanya karena pernah dimanfaatkan. Perbaiki caramu memberi, bukan kebaikan hatimu.","Saat kamu punya, banyak yang datang. Saat kamu tidak punya, baru terlihat siapa yang benar-benar peduli. Jadikan itu pelajaran, bukan kebencian.","Kamu bisa berbuat baik bertahun-tahun, lalu satu perkataan membuat semuanya dianggap buruk. Jangan cari nilai dirimu dari penilaian manusia.","Manusia sering melihat hasil, bukan perjuangan. Allah melihat keduanya, bahkan niat yang tidak diketahui siapa pun.","Jangan terlalu sedih ketika jasamu dilupakan. Bisa jadi Allah sengaja menyembunyikan balasanmu agar tetap ikhlas.","Ketika kamu menolak sekali, kamu dianggap jahat. Ketika kamu mengiyakan berkali-kali, dianggap kewajiban. Belajarlah berkata tidak tanpa merasa bersalah.","Orang bisa lupa siapa yang menolongnya kemarin, tetapi Allah tidak pernah lupa satu kebaikan pun.","Kadang kamu disalahkan karena tidak bisa memenuhi harapan semua orang. Ingat, kamu tidak diciptakan untuk membuat semua manusia puas.","Jangan membalas keburukan dengan keburukan. Kalau mereka lupa kebaikanmu, jangan sampai kamu lupa akhlakmu.","Orang yang paling sering tersenyum kepadamu belum tentu paling tulus, dan orang yang jarang memuji belum tentu tidak menghargaimu. Jangan mudah menilai hati seseorang.","Jika kebaikanmu tidak dihargai manusia, jangan merasa sia-sia. Bisa jadi justru di situlah letak keikhlasanmu.","Berbuat baiklah karena Allah, bukan karena takut kehilangan pujian manusia. Sebab pujian manusia cepat berubah, tetapi Allah mengetahui siapa dirimu sebenarnya.","Orang bisa lupa siapa yang menolongnya kemarin, tetapi Allah tidak pernah lupa satu kebaikan pun.","Jika kebaikanmu masih menunggu untuk dikenang manusia, mungkin hatimu masih mencari balasan selain Allah.","Kadang Allah membuat kebaikanmu dilupakan manusia agar hatimu belajar bahwa cukup Allah yang mengetahui.","Jangan terlalu sedih ketika jasamu tidak disebut, sebab yang dicari seorang hamba bukan nama di hadapan manusia, tetapi ridha di hadapan Allah.","Manusia mungkin hanya melihat apa yang tampak, sedangkan Allah mengetahui niat yang bahkan tidak pernah mampu kau ucapkan.","Ada kebaikan yang sengaja Allah sembunyikan dari manusia, agar tidak ada yang tersisa di hatimu selain Dia.","Semakin dalam seseorang mengenal Allah, semakin kecil keinginannya untuk dikenal manusia.","Ketika pujian membuatmu senang dan celaan membuatmu hancur, mungkin hatimu masih terlalu bergantung kepada pandangan manusia.","Ikhlas bukan ketika orang tidak memujimu, tetapi ketika tidak dipuji pun hatimu tetap ingin berbuat baik.","Kadang kehilangan penghargaan manusia adalah cara Allah menyelamatkan amalmu dari rasa ingin dipandang.","Jangan mencari tempat di hati manusia untuk kebaikan yang telah kau berikan. Titipkan semuanya kepada Allah.","Apa yang dilakukan tanganmu mungkin dilupakan manusia, tetapi apa yang dilakukan hatimu tidak pernah tersembunyi dari Allah.","Jika manusia tidak berterima kasih, jangan merasa miskin. Bukankah Allah melihat setiap langkahmu?","Orang yang benar-benar mengenal Allah tidak terlalu sibuk menghitung siapa yang menghargainya, karena ia tahu siapa yang mencatat amalnya.","Kadang kita kecewa bukan karena kebaikan kita sia-sia, tetapi karena diam-diam kita berharap manusia membalasnya.","Belajarlah berbuat baik tanpa membawa buku catatan di hati, sebab orang yang ikhlas tidak sibuk menghitung hutang manusia.","Ketika seseorang membalas kebaikanmu dengan keburukan, jangan buru-buru merasa rugi. Bisa jadi Allah sedang mengajarimu tentang ikhlas.","Ada saatnya Allah mengambil penghargaan manusia darimu agar engkau menemukan ketenangan dari penghargaan-Nya.","Jangan biarkan hati berkata, 'Setelah semua yang kulakukan untukmu.' Kalimat itu sering menjadi tanda bahwa kita masih menganggap kebaikan sebagai milik kita.","Kebaikan yang masih sering kau ungkit mungkin belum sepenuhnya menjadi milik Allah.","Semakin banyak seseorang memberi kepada Allah, semakin sedikit ia merasa memiliki jasa atas apa yang telah diperbuatnya.","Jangan merasa tinggi karena telah berbuat baik. Bisa jadi kebaikan itu bukan karena hebatnya dirimu, tetapi karena Allah sedang memakai dirimu untuk menolong orang lain.","Jika Allah menutup kebaikanmu dari pandangan manusia, jangan paksa dunia untuk melihatnya. Sesuatu yang disimpan Allah tidak pernah benar-benar hilang.","Pada akhirnya, bukan berapa banyak manusia yang mengingat kebaikanmu yang penting, tetapi apakah Allah menerimanya.","Ketika hati sudah cukup dengan Allah, dilupakan manusia tidak lagi terasa sebagai kehilangan.","Renungan hari ini: Orang sabar bersama pertolongan Allah. — QS. Al-Anfal: 46","Renungan hari ini: Jika kamu bersyukur, Allah akan menambah nikmatmu. — QS. Ibrahim: 7","Renungan hari ini: Bersabarlah, sesungguhnya Allah bersama orang-orang yang sabar. — QS. Al-Baqarah: 153","Renungan hari ini: Jangan membalas kebencian dengan kebencian, balaslah dengan kebaikan. — QS. Fussilat: 34","Renungan hari ini: Bisa jadi kamu membenci sesuatu, padahal di dalamnya ada kebaikan bagimu. — QS. Al-Baqarah: 216","Renungan hari ini: Jangan berputus asa dari rahmat Allah. — QS. Az-Zumar: 53","Renungan hari ini: Barang siapa bertawakal kepada Allah, Allah akan mencukupinya. — QS. At-Talaq: 3","Renungan hari ini: Setelah kesulitan, Allah menghadirkan kemudahan. — QS. Al-Insyirah: 5-6","Renungan hari ini: Allah tidak membebani seseorang melebihi kesanggupannya. — QS. Al-Baqarah: 286","Renungan hari ini: Ingatlah Allah, karena dengan mengingat Allah hati menjadi tenteram. — QS. Ar-Ra'd: 28","Renungan hari ini: Jangan bersedih, sesungguhnya Allah bersama kita. — QS. At-Taubah: 40","Renungan hari ini: Allah mencintai orang-orang yang berbuat baik. — QS. Al-Baqarah: 195","Renungan hari ini: Tahanlah amarah dan maafkan kesalahan orang lain. — QS. Ali 'Imran: 134","Renungan hari ini: Allah tidak menyia-nyiakan pahala orang yang berbuat baik. — QS. At-Taubah: 120","Renungan hari ini: Jangan berjalan di bumi dengan kesombongan. — QS. Al-Isra: 37","Renungan hari ini: Jangan mengejek dan merendahkan orang lain. — QS. Al-Hujurat: 11","Renungan hari ini: Jangan banyak berprasangka, karena sebagian prasangka adalah dosa. — QS. Al-Hujurat: 12","Renungan hari ini: Allah bersama orang-orang yang bertakwa dan berbuat kebaikan. — QS. An-Nahl: 128","Renungan hari ini: Apa pun nikmat yang kamu miliki, semuanya berasal dari Allah. — QS. An-Nahl: 53","Renungan hari ini: Hati yang tenang adalah hati yang mengingat Allah. — QS. Ar-Ra'd: 28","Renungan hari ini: Jangan takut, jangan bersedih; Allah menjanjikan pertolongan bagi orang yang beriman. — QS. Fussilat: 30","Renungan hari ini: Allah tidak akan mengubah keadaan suatu kaum sampai mereka mengubah apa yang ada dalam diri mereka. — QS. Ar-Ra'd: 11","Renungan hari ini: Berbuat adillah, karena keadilan lebih dekat kepada takwa. — QS. Al-Ma'idah: 8","Renungan hari ini: Janganlah kebaikan dan keburukan dianggap sama; balas keburukan dengan cara yang lebih baik. — QS. Fussilat: 34","Renungan hari ini: Allah menyukai orang-orang yang menepati janji. — QS. Ali 'Imran: 76","Renungan hari ini: Jangan mengikuti sesuatu yang tidak kamu ketahui dengan ilmu. — QS. Al-Isra: 36","Renungan hari ini: Berkatalah dengan perkataan yang baik kepada manusia. — QS. Al-Baqarah: 83","Renungan hari ini: Janganlah kamu berbuat kerusakan setelah Allah memperbaiki keadaan. — QS. Al-A'raf: 56","Renungan hari ini: Mintalah pertolongan dengan sabar dan salat. — QS. Al-Baqarah: 45","Renungan hari ini: Allah menyukai orang-orang yang bertobat dan menyucikan diri. — QS. Al-Baqarah: 222","Renungan hari ini: Janganlah kamu melupakan kebaikan di antara kalian. — QS. Al-Baqarah: 237","Renungan hari ini: Ucapkanlah perkataan yang lebih baik, karena setan dapat menimbulkan perselisihan. — QS. Al-Isra: 53","Renungan hari ini: Janganlah kamu berlebih-lebihan; Allah tidak menyukai orang yang berlebihan. — QS. Al-A'raf: 31","Renungan hari ini: Sesungguhnya Allah menyukai orang-orang yang bertawakal kepada-Nya. — QS. Ali 'Imran: 159","Renungan hari ini: Jangan merasa dirimu paling suci; Allah paling mengetahui siapa yang bertakwa. — QS. An-Najm: 32","Renungan hari ini: Jangan berbuat zalim karena Allah tidak menyukai orang-orang yang zalim. — QS. Ali 'Imran: 57","Renungan hari ini: Sedekah yang baik dapat menjadi jalan memperoleh ampunan dan karunia Allah. — QS. Al-Baqarah: 268","Renungan hari ini: Apa yang kamu infakkan untuk kebaikan, Allah mengetahuinya. — QS. Al-Baqarah: 273","Renungan hari ini: Jangan menjadikan kesombongan sebagai jalan hidup, karena Allah tidak menyukai orang yang sombong. — QS. An-Nahl: 23","Renungan hari ini: Barang siapa bertakwa kepada Allah, Dia akan memberikan jalan keluar dan rezeki dari arah yang tidak disangka. — QS. At-Talaq: 2-3","Renungan hari ini: Janganlah hatimu condong kepada kezaliman hanya karena kebencian kepada seseorang. — QS. Al-Ma'idah: 8","Renungan hari ini: Allah mengetahui apa yang disembunyikan hati dan apa yang dinyatakan. — QS. Al-Mulk: 13","Renungan hari ini: Jangan merendahkan nikmat Allah; jika kamu menghitung nikmat-Nya, kamu tidak akan mampu menghitungnya. — QS. An-Nahl: 18","Renungan hari ini: Kehidupan dunia hanyalah kesenangan yang sementara, sedangkan kehidupan akhirat lebih baik bagi orang yang bertakwa. — QS. Al-An'am: 32","Renungan hari ini: Jangan sampai harta dan anak-anak melalaikanmu dari mengingat Allah. — QS. Al-Munafiqun: 9","Renungan hari ini: Tidak perlu meninggikan diri agar terlihat tinggi. Allah mengingatkan bahwa Dia tidak menyukai orang yang sombong. — QS. An-Nahl: 23","Renungan hari ini: Pamer membuat manusia terlihat hebat di mata manusia, tetapi yang dicari seorang mukmin adalah ridha Allah. — QS. Al-Ma'un: 4-6","Renungan hari ini: Jangan merendahkan orang lain hanya karena merasa lebih tinggi. Bisa jadi yang kau remehkan justru lebih mulia di sisi Allah. — QS. Al-Hujurat: 11","Renungan hari ini: Sibuk mencari kesalahan orang lain tidak membuat dirimu menjadi lebih suci. Allah lebih mengetahui siapa yang benar-benar bertakwa. — QS. An-Najm: 32","Renungan hari ini: Jangan tertipu oleh banyaknya pujian. Yang menentukan kemuliaan seseorang bukan tepuk tangan manusia, tetapi ketakwaannya. — QS. Al-Hujurat: 13","Renungan hari ini: Ada yang ramah kepada orang yang punya kuasa, tetapi merendahkan yang dianggap tidak berguna. Al-Qur'an mengajarkan agar kemuliaan tidak diukur dari kedudukan manusia. — QS. Al-Hujurat: 13","Renungan hari ini: Jangan membanggakan apa yang sebenarnya hanya titipan. Harta, jabatan, dan kedudukan semuanya dapat berubah dalam sekejap. — QS. Al-Hadid: 20","Renungan hari ini: Orang yang suka dipuji belum tentu mulia. Al-Qur'an bahkan mengingatkan tentang mereka yang senang dipuji atas sesuatu yang tidak mereka kerjakan. — QS. Ali 'Imran: 188","Renungan hari ini: Jangan berjalan di bumi dengan kesombongan. Setinggi apa pun manusia membusungkan dada, ia tetap tidak akan mampu menembus bumi. — QS. Al-Isra: 37","Renungan hari ini: Merendahkan orang lain tidak akan membuatmu benar-benar tinggi. Kemuliaan di sisi Allah bukan karena status, tetapi karena takwa. — QS. Al-Hujurat: 13","Renungan hari ini: Jangan menjadikan kekayaan sebagai alasan untuk memandang rendah orang lain. Qarun pernah berbangga dengan hartanya, tetapi hartanya tidak menyelamatkannya. — QS. Al-Qasas: 76-81","Renungan hari ini: Jangan terlalu sibuk mencari perhatian manusia sampai lupa bahwa Allah mengetahui apa yang tersembunyi di balik penampilanmu. — QS. Al-Mulk: 13","Renungan hari ini: Pujian manusia bisa membuatmu lupa diri, tetapi Allah mengingatkan agar manusia tidak menganggap dirinya paling suci. — QS. An-Najm: 32","Renungan hari ini: Jangan menghina orang karena kekurangannya. Bisa jadi suatu hari keadaan berbalik dan justru dia yang lebih baik di sisi Allah. — QS. Al-Hujurat: 11","Renungan hari ini: Jangan menjadikan kedekatan dengan orang berkuasa sebagai alasan untuk merendahkan yang lemah. Allah melihat manusia dari ketakwaannya, bukan dari siapa yang dikenalnya. — QS. Al-Hujurat: 13","Renungan hari ini: Ada yang senang dipuji, marah ketika dikritik, dan merasa paling benar. Padahal Allah melarang manusia menganggap dirinya paling suci. — QS. An-Najm: 32","Renungan hari ini: Jangan pamer atas apa yang Allah titipkan kepadamu. Hari ini menjadi milikmu, besok bisa menjadi milik orang lain. — QS. Al-Hadid: 20","Renungan hari ini: Jangan mengejar penghormatan manusia dengan menjilat orang yang berkuasa. Kemuliaan sejati tidak ditentukan oleh siapa yang bisa memberimu kedudukan. — QS. Al-Hujurat: 13","Renungan hari ini: Jika kebaikanmu membuatmu merasa lebih tinggi daripada orang lain, berhentilah sejenak. Mungkin yang perlu diperbaiki bukan amalmu, tetapi hatimu.","Renungan hari ini: Jangan sibuk menunjukkan bahwa dirimu lebih hebat. Orang yang benar-benar mulia tidak perlu merendahkan orang lain untuk terlihat tinggi.","Renungan hari ini: Kita sibuk mengejar dunia yang terasa panjang, padahal di hadapan akhirat, kehidupan dunia hanyalah sebentar. — QS. Al-Mu’minun: 112–114","Renungan hari ini: Seumur hidupmu mungkin terasa panjang, tetapi kelak dunia akan terasa seperti waktu yang sangat singkat. — QS. Al-Mu’minun: 112–114","Renungan hari ini: Dunia dibanding akhirat seperti setetes air di ujung jari dibanding luasnya lautan. — HR. Muslim: 2858","Renungan hari ini: Jika dunia hanya seperti air yang menempel di jari, mengapa kita mengorbankan akhirat demi mengejarnya?","Renungan hari ini: Kita menghitung umur dengan tahun, sementara Allah mengingatkan bahwa kehidupan dunia hanyalah kesenangan yang sementara. — QS. Al-Hadid: 20","Renungan hari ini: Hari ini kita merasa punya banyak waktu, tetapi kematian mengajarkan bahwa waktu yang tersisa tidak pernah kita ketahui.","Renungan hari ini: Jangan tertipu panjangnya umur; yang penting bukan berapa lama hidupmu, tetapi untuk apa umur itu digunakan.","Renungan hari ini: Kita takut kehilangan dunia yang sementara, tetapi sering lupa menyiapkan bekal untuk kehidupan yang kekal.","Renungan hari ini: Dunia terasa panjang ketika dijalani, tetapi akan terasa singkat ketika manusia melihat kembali kehidupannya. — QS. Al-Mu’minun: 112–114","Renungan hari ini: Jangan menjadikan dunia sebagai tujuan akhir, karena sesuatu yang sementara tidak layak menjadi tempat menggantungkan seluruh hati.","Renungan hari ini: Harta yang dikumpulkan bertahun-tahun akhirnya ditinggalkan; amal yang ikhlas justru ikut menemani perjalanan menuju akhirat.","Renungan hari ini: Kita mengejar dunia seolah akan hidup selamanya, padahal Allah mengingatkan bahwa setiap jiwa akan merasakan kematian. — QS. Ali 'Imran: 185","Renungan hari ini: Jika kehidupan dunia hanya sebentar, jangan habiskan seluruh umur untuk sesuatu yang akhirnya harus ditinggalkan.","Renungan hari ini: Yang membuat hidup berharga bukan panjangnya usia, tetapi kebaikan yang kita bawa ketika usia itu berakhir.","Renungan hari ini: Dunia adalah tempat menanam, bukan tempat memanen seluruh hasil. Maka jangan heran jika banyak perjuangan baru terlihat nilainya di akhirat.","Renungan hari ini: Selagi hidupmu masih bergantung pada pujian manusia, ketenanganmu akan selalu bergantung pada penilaian mereka.","Renungan hari ini: Jika pujian membuatmu bahagia dan celaan membuatmu hancur, berarti hatimu masih terlalu bergantung kepada manusia.","Renungan hari ini: Carilah ketenangan dari Allah, bukan dari tepuk tangan manusia.","Renungan hari ini: Jangan jadikan penilaian manusia sebagai ukuran harga dirimu, karena manusia mudah berubah, sedangkan Allah mengetahui isi hatimu.","Renungan hari ini: Ketika ridha Allah menjadi tujuanmu, pujian manusia tidak lagi menjadi kebutuhanmu.","Renungan hari ini: Semakin kuat keinginanmu untuk dipuji manusia, semakin sulit hatimu menemukan ketenangan.","Renungan hari ini: Lepaskan kebutuhan untuk selalu dihargai, lalu biarkan Allah yang mengetahui setiap kebaikanmu.","Renungan hari ini: Tidak semua orang harus menyukaimu. Cukup pastikan hidupmu tidak jauh dari keridaan Allah.","Renungan hari ini: Hati yang mengejar pujian akan mudah kecewa; hati yang mengejar Allah akan belajar tenang.","Renungan hari ini: Jangan habiskan hidup untuk membuktikan dirimu kepada manusia. Allah sudah mengetahui siapa dirimu sebenarnya.","Renungan hari ini: Membaca Subhanallahi wa bihamdihi 100 kali, dosa-dosa diampuni walau sebanyak buih di lautan. — HR. Bukhari 6405","Renungan hari ini: Satu kali bershalawat kepada Nabi ﷺ, Allah membalasnya dengan sepuluh kali rahmat. — HR. Muslim 408","Renungan hari ini: Subhanallahi wa bihamdihi, Subhanallahil 'Azim—ringan di lisan, tetapi berat dalam timbangan amal. — HR. Bukhari 7563","Renungan hari ini: Jangan remehkan dzikir yang hanya beberapa detik, bisa jadi berat nilainya di hadapan Allah.","Renungan hari ini: Mengucapkan La ilaha illallah dengan ikhlas bukan sekadar kalimat, tetapi pengakuan bahwa hanya Allah yang berhak disembah.","Renungan hari ini: Sedekah tidak harus menunggu kaya. Bahkan kebaikan kecil yang dilakukan dengan ikhlas tidak pernah sia-sia di sisi Allah.","Renungan hari ini: Senyummu kepada saudaramu adalah sedekah. Jangan menunggu punya banyak harta untuk mulai mengumpulkan pahala.","Renungan hari ini: Menyingkirkan sesuatu yang mengganggu dari jalan adalah sedekah. Kebaikan tidak selalu membutuhkan uang.","Renungan hari ini: Dua rakaat yang kau lakukan ketika orang lain tertidur mungkin lebih berharga daripada banyak hal dunia yang kau kejar.","Renungan hari ini: Membaca Al-Qur'an jangan hanya dihitung berapa halaman, tetapi rasakan bahwa setiap huruf adalah amal yang sedang kau kumpulkan.","Renungan hari ini: Ketika lidahmu sibuk berdzikir, waktu yang biasanya terbuang bisa berubah menjadi tabungan akhirat.","Renungan hari ini: Jangan menunggu menjadi sempurna untuk beramal. Bisa jadi satu kebaikan kecil menjadi sebab datangnya rahmat Allah.","Renungan hari ini: Memberi makan orang lain bukan hanya mengenyangkan perutnya, tetapi bisa menjadi amal yang kelak kau temukan kembali.","Renungan hari ini: Membantu seseorang dalam kesulitan mungkin hanya membutuhkan beberapa menitmu, tetapi nilainya bisa jauh lebih panjang daripada waktu yang kau berikan.","Renungan hari ini: Menahan amarah bukan berarti kalah. Bisa jadi diam dan memaafkan adalah amal yang jauh lebih berat daripada membalas.","Renungan hari ini: Mengucapkan Astaghfirullah dengan hati yang benar-benar ingin kembali kepada Allah lebih berharga daripada istighfar yang hanya bergerak di lisan.","Renungan hari ini: Jangan meremehkan satu kebaikan hanya karena kecil. Di sisi Allah, ukuran amal bukan selalu seperti ukuran manusia.","Renungan hari ini: Ketika tidak mampu bersedekah dengan harta, berbuat baiklah dengan tenaga, ucapan, senyum, atau pertolongan.","Renungan hari ini: Ada pahala yang mudah dikumpulkan tetapi sering kita lewatkan, hanya karena terlalu sibuk mengejar dunia.","Renungan hari ini: Jangan biarkan satu hari berlalu tanpa dzikir, sedekah, membaca Al-Qur'an, atau kebaikan apa pun. Bisa jadi hari itu adalah kesempatan yang tidak kembali.","Renungan hari ini: Satu kebaikan yang kau lakukan dengan ikhlas tidak pernah hilang; Allah menjanjikan balasan yang berlipat ganda. — HR. Muslim","Renungan hari ini: Membaca Al-Qur'an bukan sekadar mendapatkan pahala membaca, tetapi mengamalkan isinya adalah bukti bahwa ayat telah menyentuh hatimu. — HR. Tirmidzi","Renungan hari ini: Belajar memaafkan ketika disakiti adalah amal hati yang tidak selalu terlihat manusia, tetapi diketahui Allah.","Renungan hari ini: Menahan amarah ketika mampu membalas adalah kemenangan atas dirimu sendiri dan bagian dari akhlak yang dicintai Allah.","Renungan hari ini: Memberi makan orang yang lapar mungkin sederhana bagimu, tetapi kebaikan kecil bisa menjadi besar di sisi Allah.","Renungan hari ini: Menolong orang yang sedang kesulitan jangan menunggu dirimu berlebih. Bisa jadi pertolonganmu hari ini menjadi pertolongan Allah kepadamu kelak.","Renungan hari ini: Ketika mampu membalas keburukan tetapi memilih memaafkan, saat itulah akhlakmu sedang diuji.","Renungan hari ini: Bersedekah bukan tentang seberapa banyak yang keluar dari tanganmu, tetapi seberapa ikhlas hatimu ketika memberikannya.","Renungan hari ini: Menjaga lisan dari ghibah juga sebuah amal. Tidak semua yang ingin kau katakan harus kau katakan.","Renungan hari ini: Membantu pekerjaan orang lain tanpa meminta pujian adalah bentuk kebaikan yang sering luput dari perhatian manusia.","Renungan hari ini: Mengunjungi orang sakit mungkin hanya membutuhkan waktu sebentar, tetapi perhatianmu bisa menjadi penghiburan yang sangat berarti.","Renungan hari ini: Mengajarkan satu kebaikan kepada orang lain bisa membuat pahala terus mengalir selama kebaikan itu diamalkan.","Renungan hari ini: Jika belum mampu memberi banyak, jangan berhenti memberi sedikit. Amal kecil yang dilakukan terus-menerus memiliki tempat yang istimewa. — HR. Muslim","Renungan hari ini: Puasa bukan hanya menahan lapar, tetapi belajar menahan hawa nafsu dan menjaga diri dari perkataan buruk. — HR. Muslim","Renungan hari ini: Berbuat baik kepada orang yang tidak bisa membalasmu adalah latihan paling jujur untuk menguji keikhlasan.","Renungan hari ini: Jangan menunggu orang lain berubah untuk mulai berbuat baik. Jadilah orang pertama yang memperbaiki sikap.","Renungan hari ini: Ketika melihat kesalahan orang lain, jangan hanya mengkritik. Jika mampu, bantu dia menemukan jalan untuk memperbaikinya.","Renungan hari ini: Amal yang paling mudah sering justru paling sering ditunda. Padahal kesempatan berbuat baik tidak selalu datang dua kali.","Renungan hari ini: Jangan ukur kecilnya amal dari pandangan manusia. Allah dapat melipatgandakan satu kebaikan menjadi jauh lebih besar dari yang kita bayangkan. — HR. Muslim","Mari belajar memaafkan, sebelum kita berharap diampuni.","Mari berhenti menyakiti, sebelum kita merasakan sakit yang sama.","Mari bersyukur sebelum nikmat yang dianggap biasa berubah menjadi sesuatu yang dirindukan.","Mari bersedekah sebelum harta yang kita banggakan menjadi milik orang lain.","Mari memperbaiki lisan sebelum ucapan kita menjadi penyesalan.","Mari berhenti menggunjing, sebelum aib kita sendiri dibicarakan orang.","Mari merendahkan hati, sebelum kehidupan yang membuat kita tinggi tiba-tiba dijatuhkan.","Mari berhenti mengejar pujian manusia, sebelum kita lupa mencari ridha Allah.","Mari meminta maaf selagi masih bisa bertemu, sebelum yang tersisa hanya penyesalan.","Mari berbuat baik selagi ada kesempatan, sebelum kesempatan itu menjadi kenangan.","Mari gunakan waktu untuk kebaikan, sebelum waktu hanya tinggal hitungan.","Mari jaga orang tua selagi mereka ada, sebelum doa mereka hanya bisa kita rindukan.","Mari sayangi keluarga selagi berkumpul, sebelum foto menjadi satu-satunya cara mengenang mereka.","Mari tinggalkan kesombongan, sebelum tanah menjadi tempat terakhir kita merendahkan diri.","Mari bertaubat selagi pintu masih terbuka, sebelum kesempatan itu berakhir.","Mari kurangi cinta kepada dunia, sebelum dunia membuat kita lupa kepada akhirat.","Mari belajar ikhlas, sebelum kehilangan mengajarkan kita dengan cara yang menyakitkan.","Mari berhenti merasa paling benar, sebelum kesalahan sendiri membuka mata kita.","Mari gunakan harta untuk kebaikan, sebelum harta hanya menjadi warisan.","Mari persiapkan bekal akhirat, sebelum perjalanan terakhir dimulai tanpa bisa kembali.","Kita takut kehilangan pekerjaan, uang, dan harta. Tetapi sering tidak takut kehilangan sholat.","Azan sudah memanggil berkali-kali, jangan sampai nanti namamu dipanggil untuk disholatkan.","Kita sering berkata masih ada waktu, padahal kematian tidak pernah memberi tahu kapan waktunya tiba.","Selagi kaki masih mampu berdiri, mari menghadap Allah. Sebelum suatu hari tubuh hanya mampu dibaringkan.","Sesungguhnya sesudah kesulitan itu ada kemudahan."],"galau":["Aku bukan tempat persinggahan saat kamu bosan.","Kadang yang paling sulit bukan melupakanmu, tapi menerima bahwa kamu sudah tidak ingin kembali.","Aku tidak marah kamu pergi, aku hanya kecewa karena dulu kamu membuatku percaya bahwa kamu akan tetap tinggal.","Lucunya, aku masih menunggu seseorang yang mungkin sudah lama berhenti menungguku.","Ada luka yang tidak terlihat, tapi setiap malam terasa paling nyata.","Aku baik-baik saja, hanya saja ada bagian dari diriku yang belum selesai dengan masa lalu.","Kita pernah sedekat doa, lalu berakhir sejauh orang asing.","Aku berhenti mengejarmu bukan karena tidak sayang, tapi karena lelah menjadi satu-satunya yang berusaha.","Ternyata kehilangan seseorang bukan tentang kepergiannya, tetapi tentang semua kebiasaan yang ikut hilang bersamanya.","Aku masih mengingat hal-hal kecil tentangmu, sementara mungkin namaku saja sudah tidak ada di pikiranmu.","Yang membuatku sedih bukan perpisahan kita, melainkan kenyataan bahwa kamu terlihat baik-baik saja setelahnya.","Aku ingin bertanya apakah kamu merindukanku, tapi takut jawabannya membuatku semakin sulit pergi.","Beberapa orang datang membawa kebahagiaan, lalu pergi meninggalkan pelajaran.","Aku tidak membutuhkan janji baru, aku hanya ingin sembuh dari janji lama yang tidak pernah kamu tepati.","Kadang kita harus kehilangan seseorang untuk sadar bahwa selama ini kita terlalu sibuk mempertahankannya.","Aku tersenyum bukan karena sudah lupa, tapi karena tidak ingin semua orang tahu betapa berantakannya hati ini.","Jika akhirnya kita menjadi asing, semoga setidaknya kenangan kita pernah berarti.","Aku sudah menghapus percakapan kita, tapi belum berhasil menghapus kebiasaan mencarimu.","Mungkin aku bukan orang yang kamu cari, tapi kamu pernah menjadi seseorang yang sangat aku perjuangkan.","Aku belajar bahwa tidak semua rasa harus memiliki akhir yang bahagia.","Yang paling menyakitkan adalah ketika seseorang yang dulu menjadi rumah, akhirnya terasa seperti tempat yang tidak boleh kita datangi lagi.","Aku merindukanmu diam-diam, karena mengatakannya pun tidak akan membuatmu kembali.","Entah kenapa kenangan selalu datang ketika hati sedang berusaha tenang.","Aku tidak membencimu. Aku hanya sedang belajar hidup tanpa berharap kamu kembali.","Dulu aku takut kehilanganmu. Sekarang aku takut kehilangan diriku sendiri jika terus menunggumu.","Mungkin kita bukan gagal mencintai, kita hanya bertemu pada waktu yang tidak tepat.","Aku pernah mengira kamu adalah tujuan, ternyata kamu hanya bagian dari perjalanan.","Aku masih menyimpan banyak cerita tentang kita, meski tokohnya sudah tidak lagi bersamaku.","Kalau memang harus selesai, semoga hatiku juga mengerti bahwa waktunya sudah tiba.","Aku ingin melupakanmu dengan cepat, tapi hati ternyata tidak mengenal tombol hapus.","Pada akhirnya, yang tinggal hanyalah kenangan dan pertanyaan tentang mengapa kita tidak bisa bertahan.","Terima kasih pernah menjadi alasan aku bahagia, meski akhirnya kamu juga menjadi alasan aku belajar kecewa.","Aku tidak menyesal pernah mencintaimu. Aku hanya berharap dulu aku lebih mencintai diriku sendiri.","Barangkali kita memang ditakdirkan bertemu, tetapi bukan untuk selamanya.","Namamu mungkin sudah jarang kusebut, tetapi beberapa kenangan masih tahu jalan pulang.","Aku sedang belajar menerima bahwa tidak semua orang yang kita cintai ditakdirkan untuk tinggal.","Kadang perpisahan tidak membutuhkan kata selamat tinggal, cukup dengan perlahan saling menjauh.","Aku masih di sini, bukan menunggu kamu kembali, hanya sedang menyelesaikan rasa yang belum sempat selesai.","Ada saatnya kita harus berhenti mencari alasan dari seseorang yang memang sudah memilih pergi.","Aku berharap suatu hari nanti kenangan tentangmu hanya terasa seperti cerita lama, bukan luka yang baru.","Jika bahagia tanpaku adalah pilihanmu, semoga aku juga menemukan cara untuk bahagia tanpamu.","aku sibuk menjaga perasaanmu, kamu sibuk mencari orang lain","aku menunggu kabarmu, kamu menunggu kabar darinya","aku mengingat semua tentang kita, kamu mungkin sudah lupa semuanya","aku berusaha tetap dekat, kamu perlahan membuat jarak","aku takut kehilanganmu, kamu bahkan tidak takut kehilanganku","aku menganggapmu rumah, kamu menganggapku hanya persinggahan","aku masih membaca pesan lama, kamu mungkin sudah menghapus percakapan kita","aku mencari alasan untuk bertahan, kamu mencari alasan untuk pergi","aku menyimpan namamu dalam doa, kamu mungkin menyimpan namaku dalam masa lalu","aku ingin memperbaiki hubungan ini, kamu sudah sibuk membangun cerita baru","aku menunggu satu pesan darimu, kamu mungkin menunggu pesan dari orang lain","aku masih berharap kita kembali, kamu mungkin berharap aku segera melupakanmu","aku menjaga kenangan kita, kamu sedang membuat kenangan bersama dia","aku mencoba tersenyum tanpamu, ternyata hati masih sering mencarimu","aku memberikan seluruh perhatianku, kamu memberikan sisamu","aku mengira kita sedang berjuang bersama, ternyata hanya aku yang bertahan","aku masih penasaran dengan kabarmu, kamu mungkin sudah tidak peduli dengan hariku","aku takut melihatmu bahagia tanpa aku, kamu terlihat bahagia bahkan tanpa menoleh","aku menutup hati untuk yang lain, kamu membuka hati untuk seseorang yang baru","aku masih menyebut namamu dalam hati, kamu mungkin sudah terbiasa menyebut nama orang lain","aku kira kita lagi healing bareng, ternyata kamu healing sama orang baru","aku masih nunggu notif kamu, kamu malah aktif di chat orang lain","aku kalah bukan karena kurang sayang, tapi karena kamu sudah punya pilihan","aku pura-pura biasa aja, padahal satu nama masih bikin hati berantakan","aku masih bahas kita, kamu sudah sibuk bahas dia","aku kira kamu cuma berubah, ternyata perasaanmu memang sudah pindah","aku berusaha jadi yang terbaik, kamu justru mencari yang menurutmu lebih baik","aku masih menyimpan foto kita, kamu mungkin sudah menyimpan foto kalian","aku takut kita asing, ternyata kamu lebih dulu nyaman tanpa aku","aku masih berharap ada kita, kamu sudah nyaman dengan kata aku dan dia","aku online bukan menunggu chatmu, aku cuma berharap kamu sadar aku masih ada","aku bilang sudah move on, padahal namamu masih jadi penyebab aku overthinking","aku bukan kurang sempurna, mungkin memang hatimu bukan tempatku","aku selalu punya waktu untukmu, kamu selalu punya alasan untukku","aku mengira kita cuma butuh waktu, ternyata kamu butuh orang lain","aku masih menjaga cerita lama, kamu sudah upload cerita baru","aku mencoba tidak kepo, tapi hati selalu kalah sama rasa penasaran","aku berhenti mengejar bukan karena tidak cinta, tapi karena sadar aku sendirian","aku masih sakit karena kehilanganmu, kamu mungkin bahagia karena menemukannya","aku cuma ingin dicintai dengan cara yang sama seperti aku mencintaimu","aku bukan tidak laku, cuma belum ada yang benar-benar mau menetap","teman-teman sibuk pacaran, aku sibuk pura-pura tidak kesepian","aku tidak iri lihat orang bahagia, aku cuma ingin sekali merasakan hal yang sama","malam paling panjang adalah saat tidak ada satu pun nama yang bisa dihubungi","aku punya banyak cerita, tapi tidak punya seseorang untuk mendengarnya","kadang aku membuka chat hanya untuk memastikan memang tidak a irimu beberapa tahun lalu. Mungkin kamu sudah jauh lebih kuat.","Jangan biarkan satu orang yang meragukanmu membuatmu meragukan seluruh kemampuanmu.","Kadang hidup memperlambat langkahmu bukan untuk menghentikanmu, tetapi supaya kamu tidak salah arah.","Suatu saat nanti, semua air mata dan lelah ini akan menjadi bukti bahwa kamu pernah memperjuangkan hidupmu.","Teruslah berjalan. Tidak harus cepat, tidak harus sempurna. Yang penting jangan menyerah pada dirimu sendiri.","Jangan takut hidupmu terlihat biasa. Banyak kehidupan luar biasa dimulai dari hari-hari yang sederhana.","Kalau belum bisa membanggakan hasilnya, banggakan dulu keberanianmu untuk terus mencoba.","Jangan menyerah di hari yang buruk. Bisa jadi besok adalah hari yang selama ini kamu tunggu.","Orang lain mungkin tidak melihat prosesmu, tapi suatu hari hasilmu akan membuat mereka melihat.","Kadang kamu merasa tidak bergerak, padahal sebenarnya kamu sedang bertumbuh perlahan.","Jangan biarkan masa lalu menentukan seberapa jauh kamu boleh melangkah.","Kalau hari ini kamu masih berjuang, berarti masih ada sesuatu yang layak diperjuangkan.","Jangan takut memulai dari kecil. Yang besar pun pernah menjadi sesuatu yang hampir tidak terlihat.","Berhenti menunggu waktu yang tepat. Waktu yang tepat sering dibuat oleh orang yang berani memulai.","Kalau tidak ada yang menyemangatimu, jangan tunggu. Jadilah alasan dirimu sendiri untuk bangkit.","Jangan ukur perjalananmu menggunakan jam milik orang lain. Setiap orang punya waktunya sendiri.","Yang membuatmu berbeda bukan karena kamu tidak pernah gagal, tetapi karena kamu selalu mencoba lagi.","Kadang kamu harus berjalan tanpa tahu kapan sampai. Percaya bahwa setiap langkah tetap membawa pengalaman.","Jangan takut kehilangan arah. Bahkan kompas pun baru berguna ketika seseorang mau berjalan.","Kalau hidup sedang mengujimu, jangan langsung menganggap semuanya sedang menghukummu.","Jangan terlalu sibuk membuktikan bahwa kamu hebat. Diam-diam bertumbuh jauh lebih melelahkan, tapi juga lebih bermakna.","Suatu hari nanti, kamu akan melihat alasan kenapa beberapa hal dulu harus gagal.","Jangan mengejar kehidupan yang terlihat indah. Bangun kehidupan yang benar-benar terasa baik ketika tidak ada yang melihat.","Kalau langkahmu kecil, tidak masalah. Asalkan setiap hari kamu masih melangkah.","Jangan menyerah hanya karena perjalananmu berbeda. Jalan yang berbeda tidak berarti tujuanmu lebih rendah.","Kadang kamu tidak butuh motivasi baru. Kamu hanya perlu mengingat alasan pertama kali kamu memulai.","Jangan takut kehilangan kesempatan. Ada kesempatan yang memang harus hilang agar kamu menemukan yang lebih sesuai.","Ketika semuanya terasa lambat, tetaplah konsisten. Waktu sering bekerja diam-diam di belakang usaha kita.","Jangan malu mengatakan 'aku belum bisa'. Yang berbahaya bukan belum bisa, tetapi tidak mau belajar.","Kalau orang lain meragukanmu, tidak perlu sibuk membalas. Biarkan perkembanganmu yang menjawab.","Jangan menjadikan kegagalan sebagai identitas. Kamu pernah gagal, bukan berarti kamu adalah seorang yang gagal.","Kadang satu keputusan kecil hari ini bisa mengubah arah hidupmu beberapa tahun kemudian.","Jangan menunggu percaya diri. Keberanian sering muncul setelah kita berani memulai.","Kalau kamu sedang lelah, istirahatlah tanpa merasa bersalah. Berhenti sebentar bukan berarti menyerah.","Jangan terlalu takut dengan masa depan. Masa depan belum terjadi, jadi jangan biarkan pikiranmu menjalaninya dua kali.","Yang kamu lihat sebagai keterlambatan mungkin sedang menjadi waktu untuk mempersiapkan sesuatu yang lebih besar.","Jangan berharap semua orang memahami perjuanganmu. Bahkan dirimu sendiri kadang baru memahaminya setelah berhasil melewati.","Kalau satu pintu tidak terbuka, jangan habiskan hidupmu mengetuknya. Kadang ada jalan lain yang menunggu ditemukan.","Jangan bandingkan perjuanganmu dengan hasil akhir orang lain. Itu perbandingan yang tidak adil untuk dirimu sendiri.","Setiap pagi tidak menjanjikan hari yang mudah, tetapi selalu memberikan kesempatan untuk mencoba lagi.","Kalau belum bisa mengubah dunia, ubahlah satu kebiasaan buruk dalam dirimu hari ini.","Jangan remehkan satu langkah kecil. Jarak yang jauh juga akhirnya ditempuh dengan langkah demi langkah.","Suatu hari nanti kamu akan sadar, masa sulit itu bukan hanya membuatmu menangis. Ia juga membuatmu menjadi lebih kuat.","Jangan menyerah ketika belum melihat hasil. Petani tidak menggali tanah setiap pagi hanya untuk memastikan benihnya tumbuh.","Teruskan. Mungkin kamu belum melihat hasilnya sekarang, tetapi versi dirimu di masa depan sedang menunggu keputusanmu hari ini.","Keluarga tidak harus sempurna. Yang penting, saat dunia terasa berat, masih ada tempat untuk pulang.","Jangan tunggu kehilangan baru sadar betapa berharganya waktu bersama keluarga.","Uang bisa dicari lagi, tetapi waktu bersama orang tua tidak bisa dibeli kembali.","Kadang kebahagiaan keluarga bukan rumah besar, tetapi makan sederhana bersama orang yang kita sayangi.","Sesibuk apa pun mencari nafkah, jangan sampai lupa siapa yang membuat semua perjuangan itu berarti.","Anak mungkin lupa hadiah yang diberikan, tetapi mereka akan ingat waktu yang pernah diberikan orang tuanya.","Orang tua tidak selalu meminta banyak. Kadang mereka hanya ingin ditemani dan didengarkan.","Rumah bukan sekadar tempat tinggal. Rumah adalah tempat hati merasa diterima.","Jangan terlalu sibuk mengejar kehidupan di luar sampai lupa membangun kebahagiaan di dalam rumah.","Kalau hari ini keluargamu masih lengkap, jangan anggap itu hal biasa. Itu adalah nikmat yang luar biasa.","Pertengkaran dalam keluarga itu biasa. Yang penting jangan biarkan ego membuat kita kehilangan orang yang kita cintai.","Kadang keluarga tidak membutuhkan solusi. Mereka hanya membutuhkan seseorang yang mau mendengarkan.","Jangan malu meminta maaf kepada keluarga. Menang dalam perdebatan tidak lebih penting daripada menjaga hubungan.","Orang tua mungkin semakin tua, tetapi kebutuhan mereka akan perhatian tidak pernah benar-benar hilang.","Ketika dunia tidak memihakmu, semoga rumah tetap menjadi tempat yang memelukmu tanpa banyak pertanyaan.","Jangan ukur keberhasilan keluarga dari banyaknya harta. Ukurlah dari seberapa hangat hubungan di dalamnya.","Anak-anak tidak membutuhkan orang tua yang sempurna. Mereka membutuhkan orang tua yang hadir.","Kerja keraslah untuk keluarga, tetapi jangan lupa menikmati alasan mengapa kamu bekerja keras.","Jangan sampai rumah penuh barang mahal tetapi kosong dari percakapan dan tawa.","Kadang satu pesan sederhana, 'Sudah makan?', bisa berarti sangat besar bagi seseorang di rumah.","Selagi orang tua masih bisa diajak bicara, luangkan waktu. Suatu hari nanti kita mungkin hanya bisa berbicara lewat doa.","Jangan menunggu punya banyak uang untuk membahagiakan keluarga. Waktu dan perhatian juga punya nilai yang besar.","Keluarga adalah tempat kita belajar bahwa mencintai bukan hanya tentang menerima, tetapi juga tentang memberi.","Kalau sedang marah kepada keluarga, ingat satu hal: mereka adalah orang-orang yang ingin kamu temui ketika dunia sedang tidak baik-baik saja.","Jangan bawa gengsi terlalu tinggi ke dalam rumah. Kadang kata 'maaf' lebih berharga daripada menang.","Anak-anak tumbuh cepat. Jangan sampai kita terlalu sibuk mencari uang sampai lupa menyaksikan mereka tumbuh.","Orang tua tidak selamanya kuat. Akan tiba waktunya mereka membutuhkan tangan yang dulu pernah mereka gunakan untuk membesarkan kita.","Rumah yang sederhana bisa terasa mewah jika di dalamnya ada kasih sayang.","Jangan hanya hadir ketika keluarga sedang membutuhkan bantuan. Hadirlah juga ketika mereka hanya ingin ditemani.","Keluarga mungkin sering membuat kita kesal, tetapi kehilangan mereka mengajarkan betapa mahalnya sebuah kebersamaan.","Rezeki terbesar bukan selalu uang yang masuk ke rekening, tetapi keluarga yang masih sehat dan bisa berkumpul.","Jangan biarkan masalah pekerjaan membuatmu lupa tersenyum ketika sampai di rumah.","Di luar kita boleh terlihat kuat. Di rumah, tidak apa-apa menjadi manusia yang ingin dipeluk.","Kalau ada kesempatan makan bersama keluarga, jangan terlalu sibuk dengan HP. Momen itu mungkin tidak terulang dengan suasana yang sama.","Jangan bandingkan keluargamu dengan keluarga orang lain. Setiap keluarga punya perjuangan yang tidak terlihat.","Yang membuat rumah terasa nyaman bukan sofa mahal atau rumah besar, tetapi orang-orang yang tinggal di dalamnya.","Berikan perhatian kepada orang tua sebelum mereka harus memintanya.","Kalau ingin keluarga berubah menjadi lebih baik, mulailah dari dirimu sendiri.","Jangan wariskan hanya harta kepada anak. Wariskan juga contoh tentang kasih sayang, tanggung jawab, dan kebaikan.","Pada akhirnya, setelah lelah mengejar banyak hal di dunia, kita tetap mencari satu hal: tempat untuk pulang.","Bisnis tidak selalu tumbuh cepat, tapi selama terus bergerak, berarti masih ada harapan.","Jangan takut mulai kecil. Banyak bisnis besar pernah dimulai dari langkah yang hampir tidak terlihat.","Modal penting, tapi keberanian untuk mulai dan kemauan untuk belajar jauh lebih menentukan.","Jangan hanya mengejar keuntungan. Bangun kepercayaan, karena pelanggan datang karena nilai dan kembali karena pengalaman.","Bisnis yang kuat bukan yang tidak pernah rugi, tetapi yang mampu belajar setiap kali mengalami kerugian.","Kalau hari ini belum menghasilkan banyak, jangan buru-buru menyerah. Mungkin kamu sedang membangun fondasi.","Jangan sibuk membandingkan omzetmu dengan orang lain. Fokuslah membuat bisnismu tumbuh dari versi kemarin.","Kesempatan bisnis sering datang dalam bentuk masalah. Siapa yang mampu menyelesaikan masalah, punya peluang menghasilkan uang.","Jangan menunggu semuanya sempurna untuk mulai berbisnis. Mulailah, lalu perbaiki sambil berjalan.","Keuntungan pertama mungkin kecil, tetapi pengalaman yang kamu dapat bisa menjadi modal untuk keuntungan berikutnya.","Bisnis bukan tentang siapa yang paling cepat kaya, tetapi siapa yang paling mampu bertahan dan terus berkembang.","Kalau pelanggan belum banyak, jangan berkecil hati. Layani sedikit pelanggan dengan sebaik mungkin.","Jangan takut gagal dalam bisnis. Yang lebih berbahaya adalah tidak pernah mencoba karena terlalu takut gagal.","Bisnis yang sehat dibangun dengan angka yang jelas, pelayanan yang baik, dan keputusan yang tidak gegabah.","Jangan hanya mencari pelanggan. Bangun hubungan agar pelanggan merasa dihargai.","Kadang bisnis sepi bukan tanda harus berhenti. Bisa jadi itu waktu terbaik untuk memperbaiki strategi.","Jangan habiskan energi untuk terlihat sukses. Gunakan energi untuk benar-benar membangun sesuatu yang menghasilkan.","Rezeki bisnis tidak selalu datang dari satu pintu. Terus belajar melihat peluang dari berbagai arah.","Jangan malu memulai dari bawah. Yang penting bukan posisi awalmu, tetapi arah perjalananmu.","Bisnis mengajarkan bahwa hasil besar sering membutuhkan kesabaran yang lebih besar.","Kalau produkmu bagus tetapi tidak dikenal, belajar pemasaran. Kalau dikenal tetapi tidak laku, belajar memahami kebutuhan pelanggan.","Jangan takut mengubah strategi ketika cara lama sudah tidak menghasilkan.","Uang bisa menjadi hasil dari bisnis, tetapi kepercayaan pelanggan adalah aset yang harus dijaga.","Jangan hanya bekerja di dalam bisnis. Luangkan waktu untuk memikirkan bagaimana bisnis itu bisa berkembang tanpa selalu bergantung padamu.","Bisnis yang bertahan lama biasanya bukan yang paling ramai sesaat, tetapi yang mampu memberikan nilai secara konsisten.","Jangan mengejar semua peluang. Pilih peluang yang sesuai kemampuan dan bisa kamu jalankan dengan serius.","Kerugian bukan selalu akhir perjalanan. Terkadang kerugian adalah biaya belajar yang paling mahal.","Kalau ingin bisnis berkembang, jangan berhenti belajar hanya karena sudah mulai menghasilkan.","Jangan takut melihat pesaing. Jadikan mereka alasan untuk memperbaiki kualitas bisnismu.","Bisnis kecil tetap layak dibanggakan jika dibangun dengan kerja keras dan kejujuran.","Jangan menunggu punya modal besar untuk berpikir besar. Mulailah dengan apa yang ada dan kelola dengan bijak.","Setiap pelanggan yang puas bisa menjadi promosi yang lebih kuat daripada iklan yang mahal.","Bisnis yang baik bukan hanya membuat pemiliknya mendapatkan uang, tetapi juga memberikan manfaat kepada orang lain.","Jangan terlalu cepat menikmati keuntungan. Sisihkan sebagian untuk mengembangkan bisnis.","Kalau hari ini hanya mampu mendapatkan satu pelanggan, berikan pelayanan seolah-olah kamu sedang melayani seribu pelanggan.","Kesuksesan bisnis jarang terjadi dalam semalam. Yang terlihat cepat biasanya menyimpan proses panjang yang tidak terlihat.","Jangan menyerah hanya karena satu bulan buruk. Bisnis dinilai dari perjalanan panjang, bukan satu hari.","Belajar menjual itu penting, tetapi belajar memahami apa yang dibutuhkan pelanggan jauh lebih penting.","Jangan biarkan gengsi membuatmu mengeluarkan uang lebih banyak daripada yang mampu ditanggung bisnis.","Bangun bisnis dengan perhitungan, jalankan dengan keberanian, dan evaluasi dengan jujur.","Bisnis nggak bisa untung terus. Kadang ramai, kadang sepi, kadang bahkan harus menelan kerugian.","Gagal dalam bisnis bukan berarti selesai. Bisa jadi kita sedang belajar cara yang tidak tepat.","Jangan kaget kalau bisnis pernah rugi. Yang penting jangan sampai kerugian membuat kita berhenti belajar.","Bisnis itu ada naik turunnya. Hari ini untung, besok bisa saja nombok.","Jangan berharap bisnis selalu lancar. Justru saat sulit, mental pengusaha benar-benar diuji.","Kadang sudah kerja keras tapi hasilnya belum sesuai harapan. Itulah bagian dari perjalanan bisnis.","Bisnis yang pernah gagal bukan berarti pemiliknya gagal. Selama masih mau belajar, perjalanan belum selesai.","Jangan malu pernah rugi. Yang memalukan bukan rugi, tapi mengulangi kesalahan yang sama tanpa belajar.","Ada masa bisnis menghasilkan banyak uang, ada juga masa harus bertahan agar tidak kehilangan semuanya.","Kalau bisnis sedang sepi, jangan langsung menganggap
