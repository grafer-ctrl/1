ap merencanakan produktif.","Cancer: kalau sudah nyaman ngobrol, lupa waktu dan lupa baterai HP.","Leo: senyum di kamera bisa latihan dulu, natural belakangan.","Virgo: bukan cerewet, hanya punya standar yang kebetulan detail.","Libra: kalau disuruh memilih sekarang, jawabannya 'boleh nanti saja?'","Scorpio: kalau sudah diam, biasanya bukan kehabisan kata-kata.","Sagitarius: spontan adalah bagian dari rencana.","Capricorn: bisa menghitung pengeluaran sambil tetap memasukkan barang ke keranjang.","Aquarius: random bukan berarti tidak punya alasan, cuma alasannya sulit dijelaskan.","Pisces: gampang baper, tapi gampang juga bahagia kalau dipuji.","Aries: mood berubah cepat, tapi rasa lapar selalu konsisten.","Taurus: tidak malas, hanya sedang menghargai gravitasi.","Gemini: bisa punya argumen untuk dua sisi sekaligus.","Cancer: kalau sudah kangen, lagu lama tiba-tiba terasa relevan.","Leo: tidak sombong, cuma tahu kamera mana yang paling cocok.","Virgo: kalau bilang 'bebas', biasanya sebenarnya punya pilihan sendiri.","Libra: damai adalah tujuan, tapi memilih tempat makan adalah perjuangan.","Scorpio: tidak banyak bicara, tapi sekali bicara langsung tepat sasaran.","Sagitarius: kalau ada kesempatan pergi, pertanyaan pertama bukan 'kenapa?', tapi 'kapan berangkat?'","Capricorn: sukses itu penting, tapi kopi pagi juga tidak boleh dilewatkan.","Aquarius: punya ide unik yang kadang baru masuk akal setelah dijelaskan 20 menit.","Pisces: bisa membayangkan masa depan hanya karena seseorang membalas chat dengan cepat.","Ramalan hari ini: semua zodiak berpotensi lapar sebelum jam makan berikutnya.","Ramalan cinta: seseorang mungkin sedang merindukanmu, atau sedang mencari charger.","Ramalan rezeki: ada peluang uang masuk, tetapi jangan lupa uang keluar juga punya rencana.","Ramalan karier: hari ini kamu akan belajar sesuatu, kemungkinan besar belajar sabar.","Ramalan asmara: jangan terlalu berharap dari emoji hati di chat.","Ramalan keuangan: saldo akan bertambah setelah gajian i ada di atas, turunkan. Kalau ada di bawah, naikkan. Kalau ada di bank, tolong jangan salah rekening.","Ya Allah, jangan biarkan aku iri melihat orang kaya. Jadikan aku salah satu orang kaya yang mereka lihat.","Ya Allah, aku tidak ingin banyak gaya. Aku cuma ingin punya banyak uang untuk membiayai gaya hidup sederhana.","Ya Allah, semoga dompetku segera gemuk seperti pipiku setelah makan.","Ya Allah, aku sudah berdamai dengan kenyataan. Sekarang boleh gak kenyataannya berubah?","Ya Allah, beri aku kesabaran menunggu jodoh dan rezeki. Tapi kalau salah satunya mau datang duluan, silakan.","Ya Allah, kalau jodohku masih jauh, tidak apa-apa. Rezekiku jangan ikut jauh.","Ya Allah, aku ingin kaya sebelum tua. Karena kalau sudah tua, rebahan saja sudah terasa seperti olahraga.","Ya Allah, berikan aku kesehatan, ketenangan, keluarga yang bahagia, dan saldo yang tidak bikin jantung berdebar.","Ya Allah, aku bersyukur atas apa yang kumiliki. Tapi kalau mau ditambah, aku tidak akan menolak.","Ya Allah, jangan kabulkan semua keinginanku jika tidak baik. Tapi kalau 10 miliar tadi baik, aku siap menerimanya.","Ya Allah, jadikan aku manusia yang selalu bersyukur. Terutama ketika melihat saldo bertambah.","Ya Allah, aku percaya Engkau Maha Mengetahui isi hatiku. Jadi tidak perlu aku jelaskan lagi soal 10 miliar itu.","Ya Allah, kalau aku harus sukses dari nol, jangan lupa kasih aku angka satu setelah nolnya banyak.","Ya Allah, semoga hari ini lebih baik dari kemarin. Minimal saldo lebih tebal.","Ya Allah, aku ingin menjadi orang yang bermanfaat. Kalau sudah kaya, aku janji traktir teman sesekali.","Ya Allah, jauhkan aku dari sifat boros. Kecuali saat membeli sesuatu yang memang benar-benar aku inginkan.","Ya Allah, jadikan rezekiku luas, hatiku tenang, dan WiFi rumahku tidak putus-putus.","Ya Allah, aku tidak minta hidup mewah. Cukup kalau mau beli sesuatu tidak perlu melihat harganya dulu.","Ya Allah, semoga semua yang sedang berjuang segera menemukan hasil. Yang sedang rebahan juga semoga segera menemukan motivasi.","Ya Allah, berikan aku rezeki yang membuatku bisa berkata: ternyata doa sambil rebahan juga harus diiringi usaha.","Ya Allah, aku siap berubah menjadi lebih rajin. Tapi boleh mulai besok?","Ya Allah, kalau hari ini aku belum produktif, anggap saja sedang mengisi ulang energi.","Ya Allah, berikan aku semangat untuk mengejar impian, bukan cuma mengejar charger HP.","Ya Allah, semoga kaum rebahan seperti kami tetap Engkau beri jalan untuk sukses.","Ya Allah, kami memang suka rebahan, tapi hati kami tetap punya cita-cita besar.","Ya Allah, jangan ukur kesungguhan doaku dari posisi tubuhku. Aku memang berdoa sambil rebahan.","Ya Allah, kalau sukses itu membutuhkan proses, tolong prosesnya jangan terlalu lama. Aku sudah penasaran.","Ya Allah, aku serahkan semuanya kepada-Mu. Tapi untuk urusan 10 miliar, aku titip kode keras sedikit.","Ya Allah, semoga suatu hari nanti aku bisa rebahan di rumah sendiri tanpa memikirkan cicilan.","Ya Allah, beri aku rezeki yang berkah, agar rebahanku nanti bukan karena capek mengejar uang, tapi karena bersyukur menikmati hasilnya.","Kaum rebahan itu bukan malas, cuma punya hubungan yang terlalu serius dengan kasur.","Rebahan sebentar adalah kalimat paling berbahaya. Bisa berubah menjadi tiga jam.","Kalau kasur bisa bicara, mungkin dia sudah bosan mendengar semua curhatku.","Agenda hari ini: bangun, makan, rebahan, scroll HP, lalu bingung kenapa hari sudah malam.","Kaum rebahan punya kemampuan khusus: tahu posisi paling nyaman tanpa alat ukur.","Kalau ada lomba rebahan, aku tidak ikut. Takut terlalu capek persiapannya.","Bangun dari kasur itu mudah. Yang sulit adalah menemukan alasan yang cukup kuat.","Alarm bukan musuh. Alarm hanya manusia yang gagal memahami kebutuhan tidurku.","Jam tujuh sudah bangun, tapi tubuh masih mengajukan permohonan perpanjangan waktu.","Katanya pagi adalah waktu terbaik untuk produktif. Aku percaya, tapi dari kasur.","Weekend adalah waktu untuk istirahat dari rutinitas istirahat selama hari kerja.","Hujan turun, kasur hangat, HP di tangan. Tuhan memang tahu kelemahanku.","Cuaca mendung membuat rencana keluar rumah mendadak kehilangan masa depan.","Kalau hujan turun saat sedang rebahan, jangan keluar. Itu bukan malas, itu menghormati cuaca.","Teman: 'Ayo keluar.' Aku: 'Boleh.' Kasur: 'Kamu serius?'","Niat keluar sudah ada, tapi setelah melihat kasur, niat tersebut mengundurkan diri.","Kaum rebahan kalau diajak pergi: 'Jam berapa?' Bukan karena siap, tapi menghitung berapa lama bisa rebahan dulu.","Kalau nongkrong bisa dilakukan lewat chat, kenapa harus memakai celana panjang?","Pertemanan sejati adalah teman yang tidak memaksa keluar saat kamu sedang nyaman rebahan.","Teman baik itu yang datang membawa makanan, bukan membawa ajakan olahraga.","Kalau sahabatmu sedang rebahan, jangan tanya 'lagi apa?' Jawabannya sudah jelas.","Chat panjang bisa dibalas nanti. Rebahan tidak boleh terganggu.","HP tinggal 5 persen, charger jauh. Ini bukan masalah teknologi, ini ujian kehidupan.","Charger ada di meja, aku ada di kasur. Jarak dua meter terasa seperti perjalanan antarprovinsi.","Kalau remote TV jatuh, kaum rebahan akan menatapnya beberapa menit sambil berharap remote itu kembali sendiri.","Air minum di meja habis. Mau ambil ke dapur atau menunggu hausnya hilang?","Kaum rebahan punya banyak cita-cita, hanya saja sebagian masih menunggu dimulai besok.","Produktif itu penting. Tapi tidur siang juga punya kontribusi terhadap perdamaian dunia.","Overthinking paling sering muncul setelah lampu kamar dimatikan.","Siang santai, malam overthinking, pagi mengantuk. Begitulah siklus kehidupan.","Kadang bukan hidup yang terlalu berat, kita saja yang kurang tidur.","Kalau pikiran mulai ramai, rebahan dulu. Masalahnya tidak hilang, tapi setidaknya kita nyaman.","Kaum rebahan tidak takut kesepian. Mereka takut baterai HP habis.","Kesendirian tidak masalah selama WiFi masih stabil.","Kalau WiFi mati, baru terasa betapa pentingnya bersosialisasi.","Internet lambat adalah alasan yang cukup untuk mempertanyakan seluruh keputusan hidup.","Scroll media sosial lima menit bisa berubah menjadi penelitian kehidupan orang lain selama dua jam.","Niat buka HP untuk membalas satu chat, tahu-tahu sudah melihat kehidupan tujuh orang.","Kaum rebahan punya banyak tab di HP dan banyak rencana di kepala.","Kalau ada notifikasi, langsung bangun. Kalau alarm, negosiasi.","Notifikasi marketplace lebih ampuh membangunkan daripada alarm pagi.","Keranjang belanja penuh, saldo kosong. Inilah hubungan yang tidak seimbang.","Melihat barang lucu di marketplace adalah olahraga jempol kaum rebahan.","Diskon tengah malam adalah musuh terbesar niat menabung.","Kaum rebahan tidak lapar sampai mencium aroma makanan dari dapur.","Kalau makanan sudah di depan, kemampuan bangun dari kasur meningkat 100 persen.","Makan sambil rebahan itu nyaman sampai sadar remah-remah sudah menjadi penghuni kasur.","Kalau lapar malam-malam, dapur terasa jauh seperti destinasi wisata.","Kaum rebahan punya dua mode: lapar dan terlalu malas mengambil makanan.","Kalau ada yang menawarkan makanan gratis, tubuh tiba-tiba menemukan energi tambahan.","Cinta kaum rebahan sederhana: jangan ganggu saat tidur dan jangan lupa bawakan makanan.","Gebetan belum tentu membalas chat, tapi kasur selalu menerima tanpa syarat.","Kalau dia benar-benar sayang, dia akan mengerti bahwa aku butuh tidur siang.","Hubungan paling stabil saat ini adalah hubungan antara aku dan bantal.","Bantal tidak pernah bertanya kapan aku sukses.","Kasur tidak pernah membandingkan aku dengan anak tetangga.","Selimut selalu ada ketika dunia terasa terlalu berisik.","Kalau manusia membuat kecewa, kasur tetap setia menunggu.","Jangan takut kehilangan orang yang tidak menghargaimu. Takutlah kehilangan posisi rebahan yang nyaman.","Kaum rebahan tidak mencari drama. Drama biasanya datang sendiri lewat grup WhatsApp.","Grup keluarga aktif jam sebelas malam adalah alasan baru untuk tidak tidur.","Kalau ada pesan 'penting' di grup, biasanya aku membacanya sambil pura-pura tidak online.","Kaum rebahan sangat menghargai privasi, terutama privasi kamar saat sedang tidur.","Kalau pintu kamar diketuk, pura-pura tidur adalah salah satu bentuk pertahanan diri.","Emak: 'Bangun!' Kaum rebahan: 'Iya.' Tubuh: tetap diam.","Suara emak punya teknologi yang belum berhasil dibuat oleh alarm mana pun.","Kalau dipanggil makan, refleks bangun lebih cepat daripada dipanggil kerja.","Kaum rebahan bisa mendengar bungkus makanan dibuka dari kamar sebelah.","Kalau rumah sedang ramai, kamar menjadi tempat perlindungan terakhir.","Kadang kita tidak butuh liburan. Kita cuma butuh tidur tanpa alarm.","Impian sederhana: tidur malam tanpa overthinking dan bangun tanpa kewajiban.","Bahagia itu ketika bangun tidur lalu sadar hari ini tidak perlu pergi ke mana-mana.","Rezeki terbesar kaum rebahan adalah hari kosong tanpa agenda.","Kalender kosong terlihat seperti pemandangan indah.","Jadwal padat membuatku menghargai hari ketika tidak ada jadwal sama sekali.","Kaum rebahan bukan tidak punya masa depan, cuma masa depannya sedang menunggu di balik selimut.","Kalau hidup terlalu serius, sesekali rebahan sambil menertawakan diri sendiri.","Tujuan hidup hari ini sederhana: jangan sampai ketiduran sebelum membalas chat penting.","Besok aku akan berubah menjadi lebih rajin. Hari ini masih tahap persiapan mental.","Rencana sudah dibuat. Pelaksanaannya masih dalam tahap rebahan.","Motivasi sudah datang, tapi belum sampai membangunkanku dari kasur.","Kaum rebahan tidak pernah benar-benar menyerah. Mereka hanya menunda perjuangan sampai selesai tidur.","Kalau hari ini belum produktif, jangan panik. Besok masih ada kesempatan untuk membuat alasan baru.","Rebahan bukan akhir dari perjalanan. Kadang itu cuma tempat transit sebelum akhirnya bangun.","Kaum rebahan kalau sudah menemukan posisi nyaman, pindah posisi saja harus melalui rapat internal.","Bangun tidur bukan berarti siap beraktivitas. Kadang cuma pindah dari tidur ke rebahan.","Kasur adalah tempat di mana lima menit bisa berubah menjadi satu jam tanpa terasa.","Kalau rebahan bisa menghasilkan uang, mungkin aku sudah punya perusahaan sendiri.","Kaum rebahan tidak takut deadline, cuma menghormati deadline dari kejauhan.","Alarm bunyi, tangan mencari HP, lalu tangan mencari tombol snooze. Rutinitas profesional.","Bangun pagi itu bukan masalah. Masalahnya adalah setelah bangun harus melakukan sesuatu.","Kalau hari ini terasa berat, rebahan dulu. Kalau besok masih berat, berarti perlu strategi baru.","Rencana olahraga sudah matang. Tinggal menunggu tubuh menyetujui.","Sepatu olahraga sudah siap, cuma pemiliknya belum.","Gym membership aktif, tapi tubuh masih memilih olahraga angkat selimut.","Langkah kaki hari ini sudah banyak: dari kamar ke dapur.","Kalori terbakar paling banyak saat mencari posisi tidur yang nyaman.","Kaum rebahan punya stamina luar biasa untuk scrolling, tapi lemah saat disuruh bersih-bersih.","Membersihkan kamar itu penting, tapi menemukan barang yang hilang juga bisa jadi alasan menunda.","Kalau kamar berantakan, jangan panik. Itu tanda kreativitas sedang berkembang.","Meja berantakan bukan berarti tidak teratur, mungkin sistemnya cuma belum dipahami orang lain.","Kaum rebahan kalau sudah lapar bisa berubah menjadi atlet nasional menuju dapur.","Jarak kasur ke kulkas terasa jauh kalau tidak ada makanan favorit.","Kalau makanan tinggal satu, tiba-tiba seluruh anggota rumah punya motivasi untuk bangun.","Suara bungkus kerupuk bisa membangunkan kaum rebahan lebih cepat daripada alarm.","Kaum rebahan punya radar khusus untuk mendeteksi aroma gorengan.","Kalau ada yang bilang 'makan yuk', energi langsung kembali seperti HP habis dicas.","Rencana diet sering gagal bukan karena lapar, tapi karena gorengan terlalu persuasif.","Minum air putih penting, tapi teh manis punya cara sendiri memenangkan hati.","Kaum rebahan tidak membutuhkan motivator, cukup seseorang membawa makanan.","Kalau teman datang membawa makanan, pintu rumah terasa lebih dekat.","Undangan datang: 'Maaf tidak bisa hadir.' Makanan datang: 'Saya segera menuju lokasi.'","Acara keluarga pagi-pagi adalah tantangan terbesar kaum rebahan.","Kalau acara dimulai jam tujuh pagi, jam enam aku masih negosiasi dengan bantal.","Datang tepat waktu itu penting, tapi tidur lima menit tambahan juga sangat menggoda.","Kaum rebahan punya bakat mengubah hari libur menjadi hari tidur.","Hari Minggu terlalu singkat, mungkin karena sebagian besar digunakan untuk tidur.","Sabtu malam tidak perlu pesta. Film, cemilan, dan kasur sudah cukup.","Kalau hujan turun di hari libur, semua rencana keluar rumah otomatis masuk daftar arsip.","Hujan + selimut + film = paket lengkap anti-keluar rumah.","Suara hujan memang menenangkan, sampai tiba-tiba ingat jemuran masih di luar.","Kaum rebahan paling cepat bangun kalau mendengar suara hujan mengenai genteng dan jemuran belum diangkat.","Kalau listrik mati, rebahan berubah menjadi kegiatan menatap plafon.","WiFi mati membuat kaum rebahan mempertimbangkan kembali pentingnya kehidupan sosial.","Ketika internet lambat, kesabaran langsung masuk mode hemat.","Kuota habis lebih cepat daripada niat untuk produktif.","Kaum rebahan bisa menghabiskan dua jam mencari film, lalu tertidur sebelum film dimulai.","Memilih film kadang lebih melelahkan daripada menonton filmnya.","Playlist sudah siap, cemilan sudah ada, tapi akhirnya tidur.","Headset sudah dipasang, lagu belum selesai satu, mata sudah menyerah.","Kalau HP jatuh ke wajah saat rebahan, itu bukan kecelakaan. Itu peringatan.","Posisi rebahan sambil main HP memang nyaman sampai leher mulai mengirim surat protes.","Kaum rebahan tahu risiko main HP sambil tiduran, tapi tetap mengulanginya dengan percaya diri.","Kalau baterai HP tinggal satu persen, baru charger terasa sebagai benda paling berharga di dunia.","Charger ada dua meter dari kasur. Secara geografis dekat, secara mental sangat jauh.","Remote TV jatuh ke bawah kasur. Film bagus pun harus rela ditinggalkan.","Kalau remote hilang, kaum rebahan akan berharap ada teknologi telepati.","Bangun mengambil air minum adalah keputusan besar yang membutuhkan keberanian.","Kadang haus dikalahkan oleh rasa nyaman di kasur.","Kaum rebahan tidak malas minum, hanya sedang menunda perjalanan menuju dispenser.","Kalau pintu kamar diketuk, berharap itu bukan tugas rumah.","Suara 'tolong bantu sebentar' adalah kalimat yang membuat kaum rebahan langsung pura-pura tidur.","Kalau dipanggil untuk makan, jawabannya cepat. Kalau dipanggil untuk membantu, sinyal tiba-tiba hilang.","Emak punya kemampuan mendeteksi orang pura-pura tidur dari jarak jauh.","Kaum rebahan bisa pura-pura tidak dengar, tapi tidak bisa pura-pura tidak lapar.","Kalau sedang rebahan lalu ada tamu datang, mendadak kamar terasa seperti tempat persembunyian.","Tamu pulang adalah salah satu notifikasi paling membahagiakan bagi kaum rebahan.","Kaum rebahan suka ketenangan, tapi kalau terlalu sepi malah membuka HP lagi.","Kesepian bisa diatasi dengan video random yang tidak ada hubungannya dengan kehidupan.","Scroll video pendek adalah perjalanan tanpa tujuan dan tanpa jam pulang.","Niat scroll lima menit, tahu-tahu matahari sudah bergeser.","Kaum rebahan tidak kehilangan waktu. Waktunya yang terlalu cepat pergi.","Kalau waktu bisa dikembalikan, mungkin aku akan tidur lebih awal.","Masalah terbesar sebelum tidur: mengingat semua kesalahan hidup sejak zaman sekolah.","Siang tidak kepikiran apa-apa, malam tiba-tiba otak mengadakan rapat.","Overthinking malam hari biasanya dimulai dari satu pertanyaan sederhana.","Kalau pikiran terlalu ramai, coba tidur. Kalau tidak bisa tidur, berarti pikiran belum selesai rapat.","Kaum rebahan punya banyak teori kehidupan setelah jam sebelas malam.","Jam dua pagi adalah waktu terbaik membuat rencana hidup yang kemungkinan besar dilupakan saat bangun.","Besok harus produktif. Kalimat yang sudah sering diucapkan sejak kemarin.","Motivasi malam hari luar biasa, motivasi pagi hari sedang tidak tersedia.","Setiap malam ingin berubah, setiap pagi ingin tidur lagi.","Kaum rebahan bukan tidak punya mimpi, mereka hanya sedang menunggu alarm yang tepat.","Kalau mimpi bisa dicapai sambil tidur, aku mungkin sudah jadi orang sukses.","Rebahan boleh, menyerah jangan. Tapi kalau capek, rebahan lagi.","Kadang istirahat bukan kemunduran, cuma tubuh sedang meminta waktu.","Jangan malu jadi kaum rebahan, asal jangan sampai seluruh hidup cuma jadi rencana.","Rebahan itu nikmat, tapi bangun dan bergerak tetap harus sesekali.","Pada akhirnya kita semua butuh keseimbangan: kerja secukupnya, tidur secukupnya, rebahan sebanyak yang diizinkan.","Tugasku hari ini: bernafas dan rebahan."],"pekerja":["Kerja keras bagai quda, gajinya bagai kancil.","Kerja keras itu penting, tapi kerja tepat waktu juga penting supaya bisa pulang tepat waktu.","Datang ke kantor membawa semangat, pulang membawa sisa tenaga.","Senin pagi: semangat kerja. Senin siang: semangat pulang.","Kerja dari pagi sampai sore, yang dipikirkan tetap jam pulang.","Gaji belum masuk, tapi kebutuhan sudah antre dari kemarin.","Kerja memang melelahkan, tapi tidak kerja juga bikin dompet lebih melelahkan.","Kalau kerja cuma mengandalkan semangat, tanggal tua bisa jadi motivator tambahan.","Berangkat kerja karena tanggung jawab, bertahan kerja karena cicilan.","Kerja keras demi masa depan, lembur demi masa depan yang lebih dekat.","Jam kerja terasa panjang, jam istirahat terasa seperti iklan lima detik.","Kalau pekerjaan bisa selesai sendiri, aku siap mengawasi dari jauh.","Target bulan ini: pekerjaan selesai dan mental tetap utuh.","Meeting belum selesai, kopi sudah habis. Ini pertanda keadaan darurat.","Rapat satu jam, hasilnya: kita bahas lagi besok.","Kalimat paling menegangkan di kantor: 'Bisa minta tolong sebentar?'","Sebentar versi kantor kadang durasinya tidak mengenal waktu.","Bos bilang santai, tapi deadline sudah berdiri di belakang.","Kalau bos datang, keyboard mendadak terdengar lebih produktif.","Kerjaan belum selesai, tapi jam pulang sudah memanggil dengan penuh kasih.","Komputer kantor lebih tahu perjuanganku daripada teman sendiri.","Printer rusak saat deadline adalah ujian kesabaran yang tidak tertulis.","Internet kantor lambat, tapi deadline tetap ngebut.","Email masuk lima menit sebelum pulang adalah bentuk latihan kesabaran.","Jam lima sore adalah waktu ketika semua pekerja tiba-tiba punya energi untuk melihat jam.","Kalau sudah mendekati jam pulang, satu menit terasa seperti sepuluh menit.","Kerja lembur mengajarkan satu hal: ternyata malam itu panjang.","Pulang tepat waktu adalah salah satu pencapaian terbesar hari ini.","Sepatu kerja sudah siap pulang sebelum otak selesai memproses pekerjaan.","Begitu sampai rumah, seragam kerja berubah menjadi pakaian rebahan.","Kerja seharian membuat kasur terlihat seperti destinasi wisata.","Capek kerja itu biasa, yang tidak biasa kalau capeknya sampai tidak sempat makan.","Kadang yang dibutuhkan pekerja bukan motivasi, tapi tambahan hari libur.","Kalau libur sehari terasa kurang, berarti kerja kemarin terlalu serius.","Weekend datang seperti tamu, sebentar saja sudah pamit.","Jumat sore punya suasana yang tidak bisa dijelaskan dengan kata-kata.","Senin datang terlalu cepat, Jumat datang terlalu lambat.","Kalender kerja penuh, kalender libur selalu terasa kosong.","Kerja lima hari, menunggu weekend seperti menunggu transferan.","Gaji bulanan itu unik, datangnya sekali tapi perginya berkali-kali.","Gaji masuk membuat hati tenang, tagihan masuk membuat hati introspeksi.","Dompet setelah gajian: percaya diri. Dompet tanggal tua: rendah hati.","Begitu gaji masuk, semua aplikasi pembayaran mendadak terlihat akrab.","Kalau tanggal tua bisa bicara, mungkin dia akan bilang 'sabar'.","Gaji bukan hilang, cuma berpindah tangan dengan sangat cepat.","Kerja demi gaji, gaji demi kebutuhan, kebutuhan demi kerja lagi.","Slip gaji adalah dokumen yang paling sering dibuka dengan senyum.","Bonus belum tentu datang, tapi harapan selalu datang setiap bulan.","Kalau lembur dibayar dengan senyuman, aku butuh senyum yang sangat besar.","Kerja tambahan boleh, asal tambahan penghasilannya juga ikut.","Semangat mencari rezeki, meskipun jalan menuju rezeki kadang lewat lembur.","Rezeki tidak akan tertukar, tapi deadline jangan sampai tertukar.","Kerja yang halal memang melelahkan, tapi hasilnya membuat hati lebih tenang.","Yang penting pekerjaan selesai, pelanggan puas, dan kepala tidak terlalu penuh.","Setiap pekerja punya perjuangannya sendiri yang tidak selalu terlihat.","Di balik pekerja yang terlihat santai, bisa jadi ada 20 pekerjaan yang sedang dipikirkan.","Jangan lihat pekerja cuma dari hasilnya, lihat juga perjuangan di baliknya.","Kerja bukan cuma soal uang, tapi uang juga tidak boleh dilupakan.","Kadang kita bekerja bukan karena suka, tapi karena ada orang yang harus diperjuangkan.","Semoga lelah hari ini berubah menjadi kabar baik di kemudian hari.","Semoga setiap langkah mencari nafkah menjadi jalan datangnya rezeki.","Berangkat dengan doa, bekerja dengan usaha, pulang membawa syukur.","Kerja boleh keras, tapi kesehatan tetap harus dijaga.","Jangan sampai mengejar uang sampai lupa menikmati hidup.","Target boleh tinggi, tapi badan juga punya batas.","Profesional di tempat kerja, manusia biasa setelah pulang.","Di kantor serius, di rumah langsung mencari posisi ternyaman.","Teman kerja terbaik adalah yang membantu tanpa membuat kita merasa berutang budi.","Kerja bareng jadi ringan kalau satu tim tidak saling lempar pekerjaan.","Kalau ada masalah, cari solusi. Jangan cari siapa yang paling cocok disalahkan.","Kerja sama itu bukan cuma berbagi tugas, tapi juga berbagi tanggung jawab.","Teman kantor bisa berubah menjadi keluarga kedua, terutama saat sama-sama mengejar deadline.","Kadang satu kopi dan satu teman ngobrol cukup untuk mengembalikan semangat kerja.","Semoga rekan kerja kita selalu kompak dan tidak hanya kompak saat makan siang.","Kerja dengan hati, pulang tanpa membawa dendam.","Jangan bawa se }

var stage=$('#stage'), mc=document.createElement('canvas').getContext('2d');
var hasFilter=('filter' in mc);

function wrap(ctx,text,maxW){
  var out=[], paras=String(text).split(/\r?\n/), p, i, words, cur, t;
  for(p=0;p<paras.length;p++){
    words=paras[p].split(/\s+/).filter(function(w){return w.length;});
    cur='';
    if(!words.length){out.push('');continue;}
    for(i=0;i<words.length;i++){
      t=cur?cur+' '+words[i]:words[i];
      if(cur&&ctx.measureText(t).width>maxW){out.push(cur);cur=words[i];}else{cur=t;}
    }
    out.push(cur);
  }
  return out;
}
function fontStr(){
  var t=S.t;
  return (t.italic?'italic ':'')+(t.bold?'700 ':'400 ')+t.size+'px '+FONTS[t.font].f;
}
function layoutText(ctx){
  ctx.font=fontStr();
  var lines=wrap(ctx,S.t.v,W*0.84), lh=Math.round(S.t.size*1.32), bw=0, i, m;
  for(i=0;i<lines.length;i++){m=ctx.measureText(lines[i]||' ').width;if(m>bw){bw=m;}}
  return {lines:lines,lh:lh,bw:Math.ceil(bw)+1,bh:lines.length*lh};
}
function fxCss(f){
  return f.sh.length?f.sh.map(function(s){return s.x+'px '+s.y+'px '+s.b+'px '+s.c;}).join(','):'none';
}
function setPosEl(el,x,y){el.style.transform='translate('+x+'px,'+y+'px)';}

function renderText(){
  var t=S.t, el=$('#tItem'), inn=$('#tIn');
  if(!t.v){el.style.display='none';return;}
  var L=layoutText(mc), col=COLORS[t.color], fx=FX[t.fx];
  el.style.display='block';
  inn.style.fontFamily=FONTS[t.font].f;
  inn.style.fontSize=t.size+'px';
  inn.style.fontWeight=t.bold?'700':'400';
  inn.style.fontStyle=t.italic?'italic':'normal';
  inn.style.lineHeight=L.lh+'px';
  inn.style.textAlign=t.align;
  inn.style.width=L.bw+'px';
  if(col.t==='g'){
    inn.style.color='transparent';
    inn.style.webkitTextFillColor='transparent';
    inn.style.backgroundImage='linear-gradient(135deg,'+col.c.join(',')+')';
    inn.style.webkitBackgroundClip='text';
    inn.style.backgroundClip='text';
    inn.style.textShadow='none';
    inn.style.webkitTextStroke='0';
  }else{
    inn.style.backgroundImage='none';
    inn.style.webkitTextFillColor='';
    inn.style.color=col.c;
    inn.style.textShadow=fxCss(fx);
    inn.style.webkitTextStroke=fx.st?(fx.st.w+'px '+fx.st.c):'0';
  }
  inn.innerHTML=L.lines.map(function(l){return '<div>'+(esc(l)||'&nbsp;')+'</div>';}).join('');
  setPosEl(el,t.x,t.y);
}

var SH=240, sheetOpen=false, kbOn=false, curTab=null, scl=1;
function calcSheet(){
  var h=window.innerHeight;
  SH=kbOn?150:Math.max(190,Math.min(262,Math.round(h*0.33)));
  var app=$('#app');
  app.style.setProperty('--sh',SH+'px');
  var tb=$('#tb'); app.style.setProperty('--tbh',(kbOn?0:(tb.offsetHeight||62))+'px');
}
function fit(instant){
  var box=$('#sbox'), bw=box.clientWidth, bh=box.clientHeight;
  if(!bw||!bh){return;}
  var H=dimH(), avail=bh-(sheetOpen?SH:0)-14;
  var s=Math.min((bw-28)/W,avail/H); if(s<0.05){s=0.05;}
  scl=s;
  var tx=(bw-W*s)/2, ty=7+(avail-H*s)/2;
  if(instant){stage.style.transition='none';}
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
  if(instant){void stage.offsetWidth;stage.style.transition='';}
}

var hist=[], hi=-1;

  var s=snap(); if(hist[hi]===s){return;}
  hist=hist.slice(0,hi+1); hist.push(s);
  if(hist.length>40){hist.shift();}
  hi=hist.length-1; syncUndo();
}
function restore(str){
  var o=JSON.parse(str); o.sel=null; S=o;
  $('#tx').value=S.t.v; renderAll();
}

function redo(){if(hi<hist.length-1){hi++;restore(hist[hi]);syncUndo();}}
function syncUndo(){
  $('#btnUndo').disabled=!(hi>0);
  $('#btnRedo').disabled=!(hi<hist.length-1);
}

  $$('[data-hd]').forEach(function(b){b.classList.toggle('on',parseInt(b.getAttribute('data-hd'),10)===S.hd);});

$('#fileIn').addEventListener('change',function(){
  var f=this.files&&this.files[0]; if(!f){return;}
  var r=new FileReader();
  r.onload=function(ev){addPhoto(ev.target.result);};
  r.readAsDataURL(f); this.value='';
});
$('#btnPhotoDel').addEventListener('click',function(){S.photo=0;renderBg();syncAll();commit();});
function addPhoto(src){
  var im=new Image();
  im.onload=function(){
    var w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
    if(!w||!h){toast('Foto tidak bisa dibaca');return;}
    var k=Math.min(1,1600/Math.max(w,h));
    var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    var url=c.toDataURL('image/jpeg',0.9), im2=new Image();
    im2.onload=function(){
      phId++; PH[phId]={url:url,img:im2}; S.photo=phId;
      var ids=Object.keys(PH); if(ids.length>6){delete PH[ids[0]];}
      renderBg(); syncAll(); commit();
    };
    im2.src=url;
  };
  im.onerror=function(){toast('Foto tidak bisa dibuka');};
  im.src=src;
}
/* dipanggil oleh Android setelah memilih foto (array data-URI) */
window.onPhotosPicked=function(arr){
  if(typeof arr==='string'){arr=[arr];}
  if(!arr||!arr.length){return;}
  addPhoto(arr[0]);
};

/* ============================================================
   ITEM: pilih / geser / cubit (pinch) / hapus
   ============================================================ */
function getObj(id){
  if(id==='t'){return S.t;}
  for(var i=0;i<S.st.length;i++){if(S.st[i].id===id){return S.st[i];}}
  return null;
}
function elOf(id){return id==='t'?$('#tItem'):stEls[id];}
function select(id,silent){
  if(id==='t'&&!S.t.v){id=null;}
  S.sel=id||null;
  $$('.item').forEach(function(el){el.classList.toggle('sel',el.getAttribute('data-id')===S.sel);});
  $('#selg').classList.toggle('on',!!S.sel);
}
function applySize(id){
  if(id==='t'){renderText();$('#sz').value=S.t.size;$('#szv').textContent=Math.round(S.t.size);}
  else{var o=getObj(id);if(o&&stEls[id]){stEls[id].firstChild.style.fontSize=o.size+'px';}}
}
function addSticker(e){
  var o={id:'s'+(S.nid++),e:e,x:W/2+(Math.random()*60-30),y:dimH()/2+(Math.random()*80-40),size:60};
  S.st.push(o); S.sel=o.id; renderStickers(); select(o.id); commit();
}
function sizeLimits(id){return id==='t'?[12,96]:[24,280];}
function bump(f){
  if(!S.sel){return;}
  var o=getObj(S.sel); if(!o){return;}
  var lim=sizeLimits(S.sel);
  o.size=clamp(Math.round(o.size*f),lim[0],lim[1]); applySize(S.sel); commit();
}
$('#btnPlus').addEventListener('click',function(){bump(1.12);});
$('#btnMinus').addEventListener('click',function(){bump(0.89);});
$('#btnDel').addEventListener('click',function(){
  if(!S.sel){return;}
  if(S.sel==='t'){S.t.v='';$('#tx').value='';renderText();}
  else{
    for(var i=0;i<S.st.length;i++){if(S.st[i].id===S.sel){S.st.splice(i,1);break;}}
    renderStickers();
  }
  select(null); syncAll(); commit();
});

var ptrs={}, drag=null, pinch=null;
function pcount(){return Object.keys(ptrs).length;}
function pdist(){
  var k=Object.keys(ptrs), a=ptrs[k[0]], b=ptrs[k[1]];
  return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
}
stage.addEventListener('pointerdown',function(e){
  var it=e.target.closest?e.target.closest('.item'):null;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=pcount();
  if(n>=2){
    if(S.sel&&getObj(S.sel)){pinch={d0:pdist()||1,s0:getObj(S.sel).size};}
    drag=null; e.preventDefault(); return;
  }
  if(it){
    var id=it.getAttribute('data-id'), o=getObj(id);
    select(id);
    drag={id:id,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y,moved:false};
    try{stage.setPointerCapture(e.pointerId);}catch(err){}
  }else{
    drag={id:null,sx:e.clientX,sy:e.clientY,moved:false};
  }
  e.preventDefault();
});
stage.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId]){return;}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(pinch&&pcount()>=2){
    var o=getObj(S.sel); if(!o){return;}
    var lim=sizeLimits(S.sel);
    o.size=clamp(pinch.s0*pdist()/pinch.d0,lim[0],lim[1]); applySize(S.sel);
    e.preventDefault(); return;
  }
  if(drag&&drag.id){
    var dx=(e.clientX-drag.sx)/scl, dy=(e.clientY-drag.sy)/scl;
    if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<3){return;}
    drag.moved=true;
    var ob=getObj(drag.id); if(!ob){return;}
    ob.x=clamp(drag.ox+dx,0,W); ob.y=clamp(drag.oy+dy,0,dimH());
    setPosEl(elOf(drag.id),ob.x,ob.y);
    e.preventDefault();
  }
});
function endPtr(e){
  if(!ptrs[e.pointerId]){return;}
  delete ptrs[e.pointerId];
  if(pinch){if(pcount()<2){pinch=null;commit();}return;}
  if(drag){
    if(drag.id&&drag.moved){commit();}
    else if(drag.id==='t'&&!drag.moved&&!sheetOpen){openTab('text');}
    else if(!drag.id){select(null);}
    drag=null;
  }
}
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',endPtr);

/* ============================================================
   EKSPOR (canvas) — WYSIWYG dari koordinat logis
   ============================================================ */
function gradBox(ctx,x,y,w,h,deg,cols){
  var a=deg*Math.PI/180, sx=Math.sin(a), sy=-Math.cos(a);
  var len=Math.abs(w*Math.sin(a))+Math.abs(h*Math.cos(a));
  var cx=x+w/2, cy=y+h/2;
  var g=ctx.createLinearGradient(cx-sx*len/2,cy-sy*len/2,cx+sx*len/2,cy+sy*len/2);
  for(var i=0;i<cols.length;i++){g.addColorStop(cols.length>1?i/(cols.length-1):0,cols[i]);}
  return g;
}
function drawCover(ctx,img,dw,dh){
  var iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  var ir=iw/ih, br=dw/dh, sx, sy, sw, sh;
  if(ir>br){sh=ih;sw=sh*br;sx=(iw-sw)/2;sy=0;}else{sw=iw;sh=sw/br;sx=0;sy=(ih-sh)/2;}
  ctx.drawImage(img,sx,sy,sw,sh,0,0,dw,dh);
}
function rrect(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function drawText(ctx,k){
  var t=S.t; if(!t.v){return;}
  var L=layoutText(ctx), col=COLORS[t.color], fx=FX[t.fx];
  var left=t.x-L.bw/2, top=t.y-L.bh/2, ax;
  ctx.textBaseline='middle';
  if(t.align==='left'){ctx.textAlign='left';ax=left;}
  else if(t.align==='right'){ctx.textAlign='right';ax=left+L.bw;}
  else{ctx.textAlign='center';ax=t.x;}
  var i, j, y;
  if(col.t==='g'){
    ctx.fillStyle=gradBox(ctx,left,top,L.bw,L.bh,135,col.c);
    for(i=0;i<L.lines.length;i++){ctx.fillText(L.lines[i],ax,top+(i+.5)*L.lh);}
    return;
  }
  ctx.fillStyle=col.c;
  for(i=0;i<L.lines.length;i++){
    y=top+(i+.5)*L.lh;
    for(j=0;j<fx.sh.length;j++){
      ctx.shadowColor=fx.sh[j].c; ctx.shadowBlur=fx.sh[j].b*k;
      ctx.shadowOffsetX=fx.sh[j].x*k; ctx.shadowOffsetY=fx.sh[j].y*k;
      ctx.fillText(L.lines[i],ax,y);
    }
    ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
    ctx.fillText(L.lines[i],ax,y);
    if(fx.st){ctx.lineWidth=fx.st.w;ctx.strokeStyle=fx.st.c;ctx.lineJoin='round';ctx.strokeText(L.lines[i],ax,y);}
  }
}
function drawFrame(ctx,H,k){
  var f=FRAMES[S.frame];
  f.r.forEach(function(q){
    ctx.save();
    ctx.lineWidth=q.w; ctx.strokeStyle=q.c;
    if(q.d){ctx.setLineDash(q.d);}
    if(q.g){ctx.shadowColor=q.g;ctx.shadowBlur=12*k;}
    rrect(ctx,q.i+q.w/2,q.i+q.w/2,W-2*q.i-q.w,H-2*q.i-q.w,(q.r||0)-q.w/2);
    ctx.stroke(); ctx.restore();
  });
  if(f.k){
    var c=f.k, o=c.i+c.w/2, l=c.len;
    ctx.save(); ctx.lineWidth=c.w; ctx.strokeStyle=c.c; ctx.lineCap='butt';
    ctx.beginPath();
    ctx.moveTo(o,o+l); ctx.lineTo(o,o); ctx.lineTo(o+l,o);
    ctx.moveTo(W-o-l,o); ctx.lineTo(W-o,o); ctx.lineTo(W-o,o+l);
    ctx.moveTo(o,H-o-l); ctx.lineTo(o,H-o); ctx.lineTo(o+l,H-o);
    ctx.moveTo(W-o-l,H-o); ctx.lineTo(W-o,H-o); ctx.lineTo(W-o,H-o-l);
    ctx.stroke(); ctx.restore();
  }
}
function drawAll(ctx,k){
  var H=dimH(), p=PALETTES[S.bg], ph=PH[S.photo], i, o;
  ctx.save(); ctx.scale(k,k);
  ctx.fillStyle=gradBox(ctx,0,0,W,H,p.a,p.c); ctx.fillRect(0,0,W,H);
  if(ph){
    ctx.save();
    if(hasFilter&&PFX[S.pfx].f){ctx.filter=PFX[S.pfx].f;}
    drawCover(ctx,ph.img,W,H);
    ctx.restore();
    if(S.dim){ctx.fillStyle='rgba(0,0,0,'+(S.dim/100)+')';ctx.fillRect(0,0,W,H);}
  }
  drawText(ctx,k);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(i=0;i<S.st.length;i++){
    o=S.st[i];
    ctx.font=o.size+'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.fillText(o.e,o.x,o.y);
  }
  drawFrame(ctx,H,k);
  ctx.restore();
}

var busy=false;
function setBusy(v){busy=v;$('#busy').classList.toggle('on',v);}
function openExport(){
  var k=S.hd?3:2;
  $('#dinfo').textContent=(W*k)+' × '+(dimH()*k)+' px · PNG';
  closeSheet(); select(null);
  $('#mask').classList.add('on');
}
function closeExport(){$('#mask').classList.remove('on');}
$('#btnExport').addEventListener('click',openExport);
$('#mask').addEventListener('click',function(e){if(e.target===this){closeExport();}});
$('#bSave').addEventListener('click',function(){closeExport();doExport('save');});
$('#bShare').addEventListener('click',function(){closeExport();doExport('share');});

function doExport(mode){
  setBusy(true);
  setTimeout(function(){
    try{
      var k=S.hd?3:2, H=dimH(), c=document.createElement('canvas');
      c.width=W*k; c.height=H*k;
      drawAll(c.getContext('2d'),k);
      var B=window.AndroidBridge;
      if(B){
        var b64=c.toDataURL('image/png').split(',')[1];
        if(mode==='share'&&B.shareImage){B.shareImage(b64,S.t.v||'');}
        else if(B.saveImage){B.saveImage(b64);}
        else{throw new Error('AndroidBridge.saveImage tidak ditemukan');}
        setBusy(false); return;
      }
      c.toBlob(function(blob){
        setBusy(false);
        if(!blob){toast('Gagal membuat gambar');return;}
        var name='status-'+Date.now()+'.png';
        if(mode==='share'&&navigator.share&&window.File){
          try{
            var file=new File([blob],name,{type:'image/png'});
            if(!navigator.canShare||navigator.canShare({files:[file]})){
              navigator.share({files:[file],text:S.t.v||''}).catch(function(){});return;
            }
          }catch(err){}
        }
        var url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url; a.download=name; document.body.appendChild(a); a.click();
        setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},800);
        toast('Gambar diunduh');
      },'image/png');
    }catch(err){setBusy(false);toast('Gagal: '+(err&&err.message?err.message:err));}
  },60);
}

/* ============================================================
   TOAST, TOMBOL BACK ANDROID, BOOT
   ============================================================ */
var toastT=0;
function toast(m){
  var el=$('#toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('on');},2200);
}
window.showToast=toast;

/* Dipanggil Android saat tombol Back ditekan. true = sudah ditangani di web. */
window.androidBack=function(){
  if($('#mask').classList.contains('on')){closeExport();return true;}
  if(busy){return true;}
  if(sheetOpen){closeSheet();return true;}
  if(stack.length>1){back();return true;}
  return false;
};

document.addEventListener('contextmenu',function(e){e.preventDefault();});

hydrate(document);
setTheme(store('sc_theme')==='dark'?'dark':'light');
calcSheet();
renderAll();
syncUndo();
setTimeout(function(){var b=$('#boot');b.classList.add('off');setTimeout(function(){if(b.parentNode){b.parentNode.removeChild(b);}},350);},120);
})();
