<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor Reels</title>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--fg:#17171c;--mut:#6b6b78;--line:#e2e2e8;--pri:#ff2d55;--acc:#00a3c4}
:root[data-theme="dark"]{--bg:#0e0e11;--panel:#1a1a20;--fg:#f2f2f5;--mut:#9a9aa8;--line:#2d2d36;--acc:#29d3f0}
body,#top,#tools,#ctl,#sheet,#modal .card,button,select{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Roboto,sans-serif;font-size:14px;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100vh;display:flex;flex-direction:column}
#splash{transition:opacity .35s ease;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
#errbox{display:none;position:fixed;left:10px;right:10px;top:10px;z-index:100;background:#c62828;color:#fff;padding:12px;border-radius:10px;font:12px monospace;word-break:break-word}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;cursor:pointer}
button:disabled{opacity:.35}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#top b{display:block;font-size:17px}
#top small{color:var(--mut);font-size:11px}
.tt{flex:1;min-width:0}
#top select{font:inherit;font-weight:700;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 6px;min-height:44px;margin-left:8px}
#bDl{flex:none;margin-left:8px;font-size:14px}
#bTheme{flex:none;width:44px;padding:0;font-size:18px;margin-left:8px}
#stage{flex:1;min-height:120px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px}
#wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;flex:none;box-shadow:0 2px 14px rgba(0,0,0,.25)}
canvas{width:100%;height:100%;display:block;touch-action:none}
#empty{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
#empty div{margin-bottom:12px}
#ctl{flex:none;display:flex;padding:0 10px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#ctl button{flex:1;margin:0 3px;padding:0 4px;font-size:13px}
#tools{flex:none;display:flex;overflow-x:auto;padding:4px 7px;background:var(--panel);-webkit-overflow-scrolling:touch}
.tool{flex:none;width:66px;margin:0 3px;padding:4px 0;border:0;background:transparent;font-size:11px;color:var(--mut)}
.tool i{display:block;font-style:normal;font-size:22px;line-height:28px;color:var(--fg)}
.tool.on i,.tool.on{color:var(--pri)}
#adslot{flex:none;height:60px;background:transparent}
body.exp #ctl,body.exp #tools,body.exp #top select,body.exp #bTheme{pointer-events:none;opacity:.4}
#scrim{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:20}
#scrim.on{display:block}
#sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:75%;overflow:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet.on{display:block}
.sh{font-weight:700;font-size:16px;margin-bottom:12px}
#sheet input[type=text],#sheet textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin-bottom:12px}
.sel{border-color:var(--acc);color:var(--acc);font-weight:700}
.lbl{font-size:12px;color:var(--mut);margin:8px 0 6px}
.row{display:flex;flex-wrap:wrap;margin-bottom:6px}
.row button{margin:0 8px 8px 0}
.sw{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:3px solid var(--line)}
.chip{color:#fff;font-weight:800;border:0}
.sl{display:flex;align-items:center;margin:10px 0;font-weight:600}
.sl span{width:110px}.sl input{flex:1}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
#modal .card{background:var(--panel);border-radius:16px;padding:18px;width:100%;max-width:360px;max-height:90%;overflow:auto}
#modal video{width:100%;max-height:300px;background:#000;border-radius:10px;margin-bottom:10px}
#modal a{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:88%;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;display:none;z-index:40;text-align:center}
</style>
</head>
<body>
<script>
window.onerror=function(m,s,l,c){var e=document.getElementById('errbox');if(!e)return;e.style.display='block';e.textContent='Error: '+m+' (baris '+l+') — ketuk untuk tutup';return false};
window.addEventListener('unhandledrejection',function(ev){window.onerror(String(ev.reason),'',0)});

<div id="app">
  <div id="top"><div class="tt"><b>Editor Reels</b><small>Mode Shopee · MP4 H.264 · 30 FPS</small></div><select id="q"><option value="1">720p (Shopee)</option><option value="1.5">1080p</option></select><button id="bDl" class="pri">UNDUH</button><button id="bTheme" aria-label="Ganti tema">◐</button></div>

stickers:[['DISKON 50%','#ff2d55'],['DISKON 70%','#e53935'],['ORI 100%','#00a86b'],['PROMO!','#ff9800'],['GRATIS ONGKIR','#2979ff'],['FLASH SALE','#d500f9'],['BELI 1 GRATIS 1','#e53935'],['HOT DEAL 🔥','#ff5722'],['SALE','#111111'],['BARU!','#00bfa5'],['STOK TERBATAS','#6d4c41'],['BEST SELLER','#f9a825'],['COD','#2e7d32'],['READY STOCK','#1565c0'],['LIMITED','#4a148c'],['TERLARIS','#c62828'],['MURAH BANGET','#ef6c00'],['CEK KERANJANG','#00838f'],['KLIK DI SINI','#283593'],['ORDER SEKARANG','#ad1457'],['PO','#37474f'],['CASHBACK','#558b2f'],['GARANSI','#0277bd'],['TERBAIK','#ff6f00'],['UPDATE!','#6a1b9a'],['NEW ARRIVAL','#00897b'],['BIG SALE','#d32f2f'],['SOLD OUT','#424242'],['DIJAMIN ORI','#388e3c'],['PROMO GAJIAN','#f57c00'],['12.12','#c2185b'],['9.9','#512da8'],['MURAH MERIAH','#e64a19'],['COCOK BUAT KADO','#d81b60'],['FREE GIFT 🎁','#7b1fa2'],['HARGA PAS','#0097a7'],['HEMAT!','#689f38'],['WOW!','#fbc02d'],['❤ FAVORIT','#e91e63'],['⭐ REKOMENDASI','#f9a825'],['✔ TERPERCAYA','#2e7d32'],['🔥 VIRAL','#ff3d00'],['🚚 KIRIM CEPAT','#1976d2'],['💯 ASLI','#43a047'],['🎉 PROMO','#8e24aa'],['👍 BAGUS','#039be5'],['😍 LUCU','#ec407a'],['✨ PREMIUM','#6d4c41'],['💥 DISKON GILA','#bf360c'],['NO. 1','#fb8c00'],['GRATIS!','#00c853'],['SEKARANG!','#d50000'],['HARI INI SAJA','#aa00ff'],['JANGAN LEWATKAN','#0d47a1'],['LINK DI BIO','#00796b'],['DM UNTUK ORDER','#5d4037'],['WA ADMIN','#25d366'],['PROMO AKHIR TAHUN','#b71c1c'],['PENGIRIMAN HARI INI','#1565c0']],
mimes:['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm'],

   "video/mp4" polos di Chrome = VP9 (ditolak Shopee), jadi didorong ke belakang */
cands:[

<script>
/* ===== LOGIKA ===== */
(function(){
'use strict';
var D=window.EVR_DATA;
function $(id){return document.getElementById(id)}
var W=720,H=1280,FPS=30,MAXPX=1600;
var cv=$('cv'),g=cv.getContext('2d'),vid=$('vid'),aud=$('aud');
var items=[],sel=null,hist=[],hasVideo=false,exporting=false,nid=1,vidFile=null,musicFile=null;
var lv={v:1,m:.7,r:1},actx=null,dest=null,spk=null,vidG=null,musG=null,recG=null,active=[],voices=[],recording=null,finishExport=null,drag=null,toastT=0;
var vidURL=null,musURL=null;

/* ---------- util ---------- */
function store(k,v){try{if(v===undefined)return window.localStorage.getItem(k);window.localStorage.setItem(k,v)}catch(e){}return null}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){e.style.display='none'},2600)}
function el(tag,cls,txt,fn){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined&&txt!==null)e.textContent=txt;if(fn)e.onclick=fn;return e}
function cp(a){var r=[],i,k,o;for(i=0;i<a.length;i++){o={};for(k in a[i])o[k]=a[i][k];r.push(o)}return r}
function snap(){hist.push(cp(items));if(hist.length>50)hist.shift()}
function hasBr(n){return !!(window.AndroidBridge&&typeof window.AndroidBridge[n]==='function')}
function readAB(b,ok,fail){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=fail;r.readAsArrayBuffer(b)}

/* ---------- tema ---------- */
function setTheme(t,save){document.documentElement.setAttribute('data-theme',t);if(save)store('evr_theme2',t)}
setTheme(store('evr_theme2')==='dark'?'dark':'light',false);
$('bTheme').onclick=function(){setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true)};

/* ---------- layout 9:16 tanpa aspect-ratio ---------- */
var lastW=0,lastH=0;
function layout(){
  /* tinggi #app dipaksa pixel: WebView kadang gagal menghitung height:100% */
  var ph=window.innerHeight||0;
  if(ph>0){var cs=window.getComputedStyle?window.getComputedStyle(document.body):null,pt=cs?(parseFloat(cs.paddingTop)||0):0,pb=cs?(parseFloat(cs.paddingBottom)||0):0,ah=Math.max(0,ph-pt-pb)+'px';if($('app').style.height!==ah)$('app').style.height=ah}
  var s=$('stage'),w=s.clientWidth,h=s.clientHeight;
  /* WebView kadang menghitung tinggi saat awal belum final: pakai tinggi layar sebagai cadangan */
  if(h<160){var r=s.getBoundingClientRect(),ad=$('adslot').offsetHeight||0;h=Math.max(h,(window.innerHeight||0)-r.top-ad)}
  if(w<100)w=window.innerWidth||360;
  var cw=Math.min(w-20,(h-20)*9/16);
  if(!(cw>=120))cw=120;cw=Math.floor(cw);
  if(cw===lastW&&lastH===h)return;lastW=cw;lastH=h;
  $('wrap').style.width=cw+'px';$('wrap').style.height=Math.floor(cw*16/9)+'px';
}
window.addEventListener('resize',layout);window.addEventListener('load',layout);
window.addEventListener('orientationchange',function(){setTimeout(layout,200)});
if(window.ResizeObserver){try{new ResizeObserver(layout).observe($('stage'))}catch(e){}}
setInterval(layout,500);

/* ---------- sheet & modal ---------- */
function openSheet(title,node){var s=$('sheet');s.innerHTML='';s.appendChild(el('div','sh',title));s.appendChild(node);s.className='on';$('scrim').className='on'}
function closeSheet(){$('sheet').className='';$('scrim').className=''}
$('scrim').onclick=closeSheet;
function showModal(title,node,btns){
  var c=$('mcard');c.innerHTML='';c.appendChild(el('div','sh',title));if(node)c.appendChild(node);
  var r=el('div','row');for(var i=0;i<btns.length;i++){(function(b){var x=el('button',b.p?'pri':'',b.t,function(){closeModal();if(b.fn)b.fn()});r.appendChild(x)})(btns[i])}
  c.appendChild(r);$('modal').className='on';
}
function closeModal(){$('modal').className=''}

/* ---------- gambar ---------- */
function font(it){var f=it.font||'sans-serif';return (f==='sans-serif-light'?'300 ':'800 ')+it.size+'px '+f}
function wrapText(it){
  var key=it.text+'|'+it.font+'|'+it.size;if(it._k===key)return it._l;
  g.font=font(it);var max=W-100,out=[],ps=it.text.split('\n'),i,j,ws,cur,t,w,k;
  for(i=0;i<ps.length;i++){
    ws=ps[i].split(' ');cur='';
    for(j=0;j<ws.length;j++){
      w=ws[j];t=cur?cur+' '+w:w;
      if(g.measureText(t).width<=max){cur=t;continue}
      if(cur){out.push(cur);cur=''}
      while(w.length>1&&g.measureText(w).width>max){k=w.length;while(k>1&&g.measureText(w.slice(0,k)).width>max)k--;out.push(w.slice(0,k));w=w.slice(k)}
      cur=w;
    }
    out.push(cur);
  }
  it._k=key;it._l=out;return out;
}
function box(it){
  if(it.type==='image')return{w:it.size,h:it.size*it.ratio,pad:0};
  g.font=font(it);var i,mw=0,pd;
  if(it.type==='text'){var L=wrapText(it);for(i=0;i<L.length;i++)mw=Math.max(mw,g.measureText(L[i]).width);pd=it.size*.15;return{w:mw+pd*2,h:L.length*it.size*1.25+pd,pad:pd,lines:L}}
  pd=it.size*.45;return{w:g.measureText(it.text).width+pd*2,h:it.size*1.3+pd,pad:pd};
}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect){g.roundRect(x,y,w,h,r)}else{g.rect(x,y,w,h)}}
function drawItem(it,outline){
  var b=box(it),i;
  g.save();g.translate(it.x,it.y);g.rotate((it.rot||0)*Math.PI/180);
  g.font=font(it);g.textAlign='center';g.textBaseline='middle';
  if(it.type==='image'){g.drawImage(it.img,-b.w/2,-b.h/2,b.w,b.h)}
  else if(it.type==='sticker'){
    g.fillStyle='rgba(0,0,0,.25)';rr(-b.w/2+4,-b.h/2+6,b.w,b.h,b.h*.22);g.fill();
    g.fillStyle=it.bg;rr(-b.w/2,-b.h/2,b.w,b.h,b.h*.22);g.fill();
    g.lineWidth=it.size*.09;g.strokeStyle='#fff';g.stroke();
    g.fillStyle='#fff';g.fillText(it.text,0,it.size*.04);
  }else{
    var lh=it.size*1.25,top=-b.lines.length*lh/2,bw=b.w-b.pad*2,al=it.align||'center',x=al==='left'?-bw/2:(al==='right'?bw/2:0);
    g.textAlign=al;g.lineJoin='round';g.lineWidth=it.size*.18;g.strokeStyle=it.color==='#111111'?'#fff':'#000';
    for(i=0;i<b.lines.length;i++){var y=top+lh*(i+.5);g.strokeText(b.lines[i],x,y);g.fillStyle=it.color;g.fillText(b.lines[i],x,y)}
  }
  if(outline){g.setLineDash([14,10]);g.lineWidth=4;g.strokeStyle='#00e5ff';g.strokeRect(-b.w/2-8,-b.h/2-8,b.w+16,b.h+16)}
  g.restore();
}
function frame(){
  var S=cv.width/W;g.setTransform(S,0,0,S,0,0);g.setLineDash([]);
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  if(hasVideo&&vid.videoWidth){
    var s=Math.max(W/vid.videoWidth,H/vid.videoHeight),w=vid.videoWidth*s,h=vid.videoHeight*s;
    g.drawImage(vid,(W-w)/2,(H-h)/2,w,h);
  }
  for(var i=0;i<items.length;i++)drawItem(items[i],!exporting&&items[i].id===sel);
  requestAnimationFrame(frame);
}

/* ---------- geser objek ---------- */
function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',function(e){
  if(exporting)return;var p=pos(e),hit=null,i,it,b;
  for(i=items.length-1;i>=0;i--){it=items[i];b=box(it);if(Math.abs(p.x-it.x)<b.w/2+10&&Math.abs(p.y-it.y)<b.h/2+10){hit=it;break}}
  sel=hit?hit.id:null;
  if(hit){snap();drag={it:hit,dx:p.x-hit.x,dy:p.y-hit.y,moved:false};try{cv.setPointerCapture(e.pointerId)}catch(x){}}
  sync();
});
cv.addEventListener('pointermove',function(e){if(!drag)return;var p=pos(e);drag.it.x=p.x-drag.dx;drag.it.y=p.y-drag.dy;drag.moved=true});
function endDrag(){if(drag&&!drag.moved)hist.pop();drag=null;sync()}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- aksi objek ---------- */
function sync(){var n=sel===null;$('del').disabled=n;$('sm').disabled=n;$('lg').disabled=n;$('undo').disabled=!hist.length}
function add(o){
  snap();var it={id:nid++,x:W/2,y:H/2+(items.length%5)*70-140,size:64,rot:0},k;
  for(k in o)it[k]=o[k];items.push(it);sel=it.id;sync();closeSheet();
}
function curItem(){for(var i=0;i<items.length;i++)if(items[i].id===sel)return items[i];return null}
function resize(f){var it=curItem();if(!it)return;snap();it.size=Math.max(20,Math.min(it.type==='image'?1400:300,it.size*f));sync()}
$('sm').onclick=function(){resize(.88)};$('lg').onclick=function(){resize(1.14)};
$('del').onclick=function(){if(sel===null)return;snap();items=items.filter(function(i){return i.id!==sel});sel=null;sync()};
$('undo').onclick=function(){if(!hist.length)return;items=hist.pop();if(!curItem())sel=null;sync()};
$('bReset').onclick=function(){if(!items.length)return toast('Belum ada teks atau stiker');snap();items=[];sel=null;sync();toast('Semua objek dihapus (bisa Undo)')};

function optRow(arr,cur,onPick,style){
  var row=el('div','row'),i;
  for(i=0;i<arr.length;i++){(function(o){
    var b=el('button',o[1]===cur?'sel':'',o[0],function(){for(var j=0;j<row.children.length;j++)row.children[j].className='';b.className='sel';onPick(o[1])});
    if(style)b.style.fontFamily=o[1];row.appendChild(b);
  })(arr[i])}
  return row;
}
function slider(label,min,max,val,onChange){

  var r=new FileReader();

/* ---- pembaca kotak MP4 ---- */

  var out=[],o=s,size,hs,hi,lo;

    else if(size===0){size=e-o;hs=8}

    out.push({type:String.fromCharCode(u8[o+4],u8[o+5],u8[o+6],u8[o+7]),d:o+hs,e:o+size});
    o+=size;
  }

}

      mv=pick(top,'mvhd'),ver,ts=0,du=0,traks,i,tr,ch,tk,mdia,mh,hdlr,minf,stbl,stsd;
  if(mv){
    ver=u8[mv.d];
    if(ver===1){if(mv.d+32<=mv.e){ts=dv.getUint32(mv.d+20);du=dv.getUint32(mv.d+24)*4294967296+dv.getUint32(mv.d+28)}}
    else{if(mv.d+20<=mv.e){ts=dv.getUint32(mv.d+12);du=dv.getUint32(mv.d+16)}}
    if(ts>0)r.dur=du/ts;
  }

    if(traks[i].type!=='trak')continue;
    tr=traks[i];ch=kids(u8,dv,tr.d,tr.e);tk=pick(ch,'tkhd');mdia=pick(ch,'mdia');
    if(!mdia)continue;
    mh=kids(u8,dv,mdia.d,mdia.e);hdlr=pick(mh,'hdlr');minf=pick(mh,'minf');
    if(!hdlr||fcc(u8,hdlr.d+8)!=='vide')continue;

      if(ver===1){if(tk.d+96<=tk.e){r.w=Math.round(dv.getUint32(tk.d+88)/65536);r.h=Math.round(dv.getUint32(tk.d+92)/65536)}}
      else{if(tk.d+84<=tk.e){r.w=Math.round(dv.getUint32(tk.d+76)/65536);r.h=Math.round(dv.getUint32(tk.d+80)/65536)}}

    var dv=new DataView(h.buffer,h.byteOffset,h.byteLength),m=pick(kids(h,dv,0,h.length),'moov');

function judge(blob,ci,cb){

function sup(i){try{return MediaRecorder.isTypeSupported(D.cands[i][0])}catch(e){return false}}

  if(vid.duration>0&&vid.duration<10)n.push('⚠ durasi '+vid.duration.toFixed(1)+' dtk, Shopee minimal 10 dtk');
  if(QS>1)n.push('⚠ 1080×1920 melebihi batas Shopee 1280×1280');

  }

  QS=parseFloat($('q').value);
  var btn=$('bDl'),LIMIT=Math.min(60,vid.duration||60),started=false,recErr='';
  cv.width=Math.round(W*QS);cv.height=Math.round(H*QS);
  function reset(){setExp(false);cv.width=W;cv.height=H;if(spk)spk.gain.value=1;btn.textContent='UNDUH'}

  if(sel!==null){sel=null;sync();return true}
