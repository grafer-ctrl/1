Hari 1 — Niat Berpuasa Puasa Ramadan merupakan ibadah yang istimewa. Mari awali Ramadan dengan niat yang tulus karena Allah SWT dan berharap agar seluruh ibadah kita diterima oleh-Nya. Aamiin.
Hari 2 — Keutamaan Puasa Rasulullah ﷺ bersabda bahwa Allah berfirman dalam hadis qudsi: "Puasa itu untuk-Ku, dan Aku sendiri yang akan membalasnya." (HR. Bukhari dan Muslim). Betapa istimewanya ibadah puasa, karena pahala dan balasannya menjadi hak istimewa dari Allah SWT.
Hari 3 — Puasa Melatih Kesabaran Puasa bukan hanya menahan lapar dan dahaga, tetapi juga melatih kesabaran dalam perkataan, sikap, dan perbuatan. Semoga Ramadan menjadikan kita pribadi yang lebih sabar.
Hari 4 — Puasa Adalah Perisai Rasulullah ﷺ bersabda: "Puasa adalah perisai." (HR. Bukhari dan Muslim). Semoga puasa kita menjadi pelindung dari perbuatan buruk dan membantu kita menjaga diri dari hal-hal yang tidak diridhai Allah SWT.
Hari 5 — Pintu Ar-Rayyan Rasulullah ﷺ mengabarkan bahwa di surga terdapat pintu bernama Ar-Rayyan yang diperuntukkan bagi orang-orang yang berpuasa. (HR. Bukhari dan Muslim). Semoga kita termasuk orang-orang yang mendapatkan kemuliaan tersebut.
Hari 6 — Doa Orang yang Berpuasa Orang yang berpuasa memiliki keutamaan dalam berdoa. Mari manfaatkan waktu-waktu Ramadan untuk memohon ampunan, kesehatan, rezeki yang berkah, dan kebaikan dunia akhirat.
Hari 7 — Menjaga Lisan Saat Puasa Rasulullah ﷺ mengajarkan agar orang yang berpuasa tidak berkata kotor dan tidak bertindak buruk. (HR. Bukhari). Semoga puasa kita tidak hanya menahan lapar, tetapi juga menjaga lisan dan hati.
Hari 8 — Sedekah di Bulan Ramadan Rasulullah ﷺ dikenal sangat dermawan, dan kedermawanan beliau semakin besar pada bulan Ramadan. (HR. Bukhari). Mari berbagi sesuai kemampuan, karena kebahagiaan Ramadan akan terasa lebih indah ketika kita juga membahagiakan orang lain.
Hari 9 — Memberi Makan Orang Berpuasa Rasulullah ﷺ bersabda bahwa orang yang memberi makan untuk berbuka kepada orang yang berpuasa akan memperoleh pahala seperti orang yang berpuasa tersebut, tanpa mengurangi pahala orang itu sedikit pun. (HR. Tirmidzi). Semoga kita dimudahkan untuk berbagi, walau hanya dengan segelas air atau sebutir kurma.
Hari 10 — Ampunan di Bulan Ramadan Rasulullah ﷺ bersabda bahwa siapa yang berpuasa Ramadan dengan iman dan mengharap pahala, dosa-dosanya yang telah lalu akan diampuni. (HR. Bukhari dan Muslim). Semoga sepuluh hari pertama ini menjadi jalan menuju ampunan Allah SWT.
Hari 11 — Hadis tentang Kejujuran Rasulullah ﷺ bersabda: "Hendaklah kalian berlaku jujur, karena kejujuran membawa kepada kebaikan." (HR. Bukhari dan Muslim). Mari jadikan Ramadan sebagai waktu untuk membiasakan kejujuran dalam perkataan dan perbuatan.
Hari 12 — Keutamaan Membaca Al-Qur'an Ramadan adalah bulan diturunkannya Al-Qur'an. Mari luangkan waktu untuk membaca, memahami, dan mengamalkan ayat-ayat Allah, meskipun sedikit demi sedikit.
Hari 13 — Salat Tarawih Rasulullah ﷺ menjelaskan keutamaan salat malam Ramadan bagi orang yang melaksanakannya dengan iman dan mengharap pahala. (HR. Bukhari dan Muslim). Semoga Allah memudahkan kita untuk menghidupkan malam-malam Ramadan dengan ibadah.
Hari 14 — Keutamaan Sahur Rasulullah ﷺ bersabda: "Bersahurlah kalian, karena sesungguhnya dalam sahur terdapat keberkahan." (HR. Bukhari dan Muslim). Semoga sahur kita menjadi sumber kekuatan dan keberkahan dalam menjalani puasa.
Hari 15 — Menyegerakan Berbuka Rasulullah ﷺ bersabda bahwa manusia senantiasa berada dalam kebaikan selama mereka menyegerakan berbuka puasa. (HR. Bukhari dan Muslim). Semoga kita mengikuti tuntunan Rasulullah ﷺ dalam menjalankan ibadah puasa.
Hari 16 — Hafalan Doa Berbuka Puasa Salah satu doa berbuka puasa yang dikenal luas adalah: Dzahabazh-zhama'u wabtallatil-'uruqu wa tsabatal-ajru insya Allah. Artinya: "Telah hilang rasa haus, urat-urat telah basah, dan pahala telah ditetapkan, insya Allah."(HR. Abu Dawud).
Hari 17 — Malam Lailatul Qadar Allah SWT menjelaskan bahwa malam Lailatul Qadar lebih baik daripada seribu bulan (QS. Al-Qadr: 3). Mari memperbanyak ibadah pada sepuluh malam terakhir Ramadan dan berharap memperoleh keberkahan malam yang mulia ini.
Hari 18 — Memperbanyak Istigfar Ramadan adalah kesempatan untuk memohon ampun kepada Allah SWT. Mari membiasakan membaca Astaghfirullah wa atubu ilaih dan memperbaiki diri dengan sungguh-sungguh.
Hari 19 — Menjaga Silaturahmi Ramadan menjadi waktu yang baik untuk mempererat hubungan dengan keluarga, sahabat, dan tetangga. Semoga Allah menjadikan kita orang-orang yang senang menyambung silaturahmi.
Hari 20 — Sepuluh Hari Terakhir Ramadan Rasulullah ﷺ lebih bersungguh-sungguh dalam beribadah ketika memasuki sepuluh hari terakhir Ramadan. (HR. Muslim). Semoga kita diberikan kekuatan untuk memaksimalkan hari-hari istimewa ini.
Hari 21 — Doa Memohon Ampunan Aisyah r.a. pernah bertanya kepada Rasulullah ﷺ tentang doa yang dibaca ketika mengetahui malam Lailatul Qadar. Beliau mengajarkan: Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni. Artinya: "Ya Allah, sesungguhnya Engkau Maha Pemaaf, Engkau mencintai pemaafan, maka maafkanlah aku." (HR. Tirmidzi).
Hari 22 — Keutamaan Zikir Mari memperbanyak zikir, seperti tasbih, tahmid, tahlil, dan takbir. Semoga hati kita semakin tenang dan selalu mengingat Allah SWT.
Hari 23 — Sedekah Tidak Harus Banyak Berbagi tidak harus menunggu kaya. Senyuman, bantuan kecil, makanan untuk tetangga, dan sedekah sesuai kemampuan dapat menjadi jalan untuk menebar kebaikan.
Hari 24 — Menjaga Hati dari Iri dan Dengki Puasa menjadi kesempatan untuk melatih hati agar lebih bersih. Semoga kita dijauhkan dari iri, dengki, kebencian, dan prasangka buruk terhadap sesama.
Hari 25 — Memuliakan Orang Tua Ramadan menjadi waktu yang baik untuk lebih menyayangi orang tua, mendoakan mereka, membantu kebutuhan mereka, dan meminta maaf atas kesalahan kita.
Hari 26 — Muhasabah Diri Sudah sejauh mana perubahan diri kita selama Ramadan? Mari merenungkan ibadah dan perilaku kita, bukan untuk merasa lebih baik daripada orang lain, melainkan agar esok menjadi lebih baik.
Hari 27 — Memperbanyak Ibadah Tidak ada kepastian bahwa malam ke-27 adalah Lailatul Qadar, tetapi malam ini termasuk waktu yang baik untuk memperbanyak doa, salat malam, membaca Al-Qur'an, dan memohon ampunan.
Hari 28 — Istiqamah Setelah Ramadan Kebaikan tidak berhenti ketika Ramadan berakhir. Semoga kebiasaan salat, membaca Al-Qur'an, bersedekah, dan menjaga lisan tetap kita lanjutkan pada bulan-bulan berikutnya.
Hari 29 — Keutamaan Puasa Enam Hari Syawal Rasulullah ﷺ bersabda bahwa siapa yang berpuasa Ramadan kemudian melanjutkannya dengan enam hari di bulan Syawal, maka ia seperti berpuasa sepanjang tahun. (HR. Muslim).Semoga Allah memberi kita kesempatan untuk melanjutkan amal kebaikan setelah Ramadan. 
Hari 30 — Ramadan akan berlalu, tetapi semoga kebaikan yang kita pelajari tetap tinggal dalam hati. Semoga seluruh puasa, salat, doa, sedekah, dan amal ibadah kita diterima Allah SWT serta kita dipertemukan kembali dengan Ramadan berikutnya. Aamiin ya Rabbal 'alamin.

Belajarlah menerima kenyataan tanpa kehilangan harapan, sebab hidup selalu menyediakan kesempatan untuk memulai kembali.
Kesederhanaan membuat hidup lebih damai, sedangkan keserakahan sering kali membuat seseorang kehilangan apa yang sebenarnya sudah cukup.
Jangan menunggu sempurna untuk memulai. Mulailah dengan apa yang ada, lalu perbaiki langkahmu sepanjang perjalanan.
Terkadang jawaban terbaik bukanlah penjelasan, melainkan perubahan sikap yang menunjukkan bahwa kita sudah belajar.
Jangan mudah percaya pada pujian dan jangan terlalu terluka oleh hinaan. Keduanya tidak selalu menggambarkan siapa dirimu sebenarnya.
Ketenangan hati datang ketika kita mampu membedakan mana yang bisa diperbaiki dan mana yang harus diterima.
Hidup mengajarkan kita bahwa tidak semua yang dekat itu peduli dan tidak semua yang jauh itu melupakan.
Jangan takut kehilangan orang yang tidak menghargaimu. Kehilangan yang demikian terkadang menjadi awal dari penghargaan terhadap diri sendiri.
Seseorang yang memiliki hati lapang tidak akan sibuk menjatuhkan orang lain demi terlihat lebih tinggi.
Gunakan waktumu untuk bertumbuh, bukan untuk membalas setiap perkataan yang menyakitkan.
Kebahagiaan bukan berarti hidup tanpa masalah, melainkan kemampuan menemukan alasan untuk tetap bersyukur di tengah kesulitan.
Jangan merendahkan siapa pun ketika berada di atas, sebab kehidupan selalu memiliki cara untuk mengajarkan kerendahan hati.
Memaafkan bukan berarti melupakan semuanya, tetapi memilih untuk tidak terus membawa luka ke dalam hari esok.
Keberhasilan yang diperoleh dengan kejujuran jauh lebih menenangkan daripada keuntungan besar yang dibangun di atas kebohongan.
Jangan mengukur nilai dirimu berdasarkan pendapat orang yang bahkan tidak memahami perjuanganmu.
Terkadang langkah terbaik adalah berhenti sejenak, menenangkan pikiran, lalu melanjutkan perjalanan dengan hati yang lebih jernih.
Orang yang mampu mengendalikan emosinya sering kali lebih kuat daripada orang yang selalu ingin menunjukkan kekuatannya.
Jangan mengharapkan semua orang memahami niat baikmu. Cukup lakukan yang benar dan biarkan waktu menjelaskan sisanya.
Hidup terlalu berharga untuk dihabiskan dengan kebencian terhadap orang yang tidak menyukaimu.
Bersyukurlah atas apa yang dimiliki sambil terus berusaha memperbaiki apa yang masih kurang.
Jangan malu memulai dari bawah. Setiap bangunan yang tinggi selalu memiliki fondasi yang tersembunyi.
Orang yang rendah hati tidak kehilangan kehormatan ketika mengakui kesalahan, justru di situlah terlihat kebesarannya.
Jangan terburu-buru mengambil keputusan saat marah, dan jangan terlalu cepat berjanji saat sedang bahagia.
Kadang kita tidak membutuhkan kehidupan yang lebih mewah, tetapi hati yang lebih mampu menikmati apa yang sudah ada.
Kebaikan yang dilakukan dengan tulus tidak membutuhkan pengakuan dari banyak orang.
Jangan biarkan kegagalan hari ini membuatmu meragukan kemungkinan baik yang bisa terjadi esok hari.
Menghormati orang lain tidak membuatmu lebih rendah, dan dihormati orang lain tidak membuatmu lebih tinggi.
Hidup mengajarkan bahwa kepercayaan membutuhkan waktu untuk dibangun, tetapi bisa hancur hanya dalam sekejap.
Jangan terlalu sibuk mencari kebahagiaan yang jauh sampai lupa mensyukuri kedamaian yang ada di depan mata.
Orang yang bijak tidak selalu berbicara paling banyak, tetapi berusaha memahami sebelum memberikan penilaian.
Jangan menjadikan kekayaan sebagai satu-satunya ukuran keberhasilan. Kesehatan, keluarga, ketenangan, dan kejujuran juga merupakan kekayaan.
Setiap kesulitan membawa pelajaran, meskipun kita terkadang baru memahami maknanya setelah semuanya berlalu.
Jangan takut berbeda selama kamu berjalan di jalan yang benar dan tidak merugikan orang lain.
Belajar menerima kekurangan diri sendiri adalah langkah awal untuk memperbaiki diri tanpa harus membenci diri sendiri.
Jangan menganggap kesopanan sebagai kelemahan. Orang yang mampu tetap santun ketika marah sedang menunjukkan pengendalian diri.
Terkadang kita harus mengurangi keinginan agar bisa lebih menikmati apa yang sudah kita miliki.
Tidak semua perpisahan berarti permusuhan. Ada kalanya seseorang hanya perlu melanjutkan perjalanan melalui jalan yang berbeda.
Jangan membalas keburukan dengan keburukan, sebab kedamaian tidak akan ditemukan dengan memperbanyak permusuhan.
Orang yang menghargai waktu akan memahami bahwa kesempatan yang terlewat tidak selalu datang kembali.
Jadilah pribadi yang kehadirannya membawa ketenangan, bukan seseorang yang membuat orang lain harus selalu berhati-hati.
Jangan merasa paling benar hanya karena pendapatmu berbeda. Kebijaksanaan dimulai ketika kita bersedia mendengarkan.
Masa lalu adalah tempat belajar, bukan tempat tinggal. Masa depan adalah tujuan, bukan alasan untuk melupakan hari ini.
Kesetiaan bukan sekadar bertahan ketika keadaan mudah, melainkan tetap menjaga kepercayaan ketika godaan datang.
Jangan terlalu keras kepada diri sendiri. Bertumbuh membutuhkan waktu, dan setiap orang berhak belajar dari kesalahannya.
Orang yang benar-benar menghargaimu tidak akan selalu setuju denganmu, tetapi tetap mampu menyampaikan perbedaan dengan hormat.
Ketenangan lebih mudah ditemukan ketika kita berhenti memaksakan sesuatu yang memang berada di luar kendali.
Jangan mengukur keberhasilan hanya dari hasil yang terlihat. Usaha yang jujur dan perjuangan yang tidak diketahui orang lain juga memiliki nilai.
Ketika hidup tidak berjalan sesuai rencana, jangan langsung menganggap semuanya gagal. Bisa jadi kamu sedang belajar menemukan jalan yang lebih tepat.
Jangan terlalu mudah menghakimi seseorang, karena kita tidak pernah sepenuhnya mengetahui beban yang sedang ia tanggung.
Orang yang mampu bersyukur dalam keterbatasan sering kali memiliki kekayaan hati yang tidak bisa dibeli dengan uang.
Jangan menggunakan kebaikan untuk mencari pujian, dan jangan menggunakan kekurangan orang lain sebagai bahan untuk meninggikan diri.
Berani berkata tidak pada sesuatu yang salah adalah bentuk penghormatan terhadap diri sendiri.
Terkadang kemajuan terbesar bukanlah mendapatkan sesuatu yang baru, melainkan berhasil meninggalkan kebiasaan buruk yang lama.
Jangan menghabiskan hidup untuk membuat semua orang bahagia. Lakukan yang baik tanpa mengabaikan kesehatan dan ketenangan dirimu sendiri.
Orang yang dewasa memahami bahwa setiap hubungan membutuhkan rasa hormat, kejujuran, dan batasan yang sehat.
Jangan menilai hidup hanya dari satu hari yang buruk. Satu halaman yang menyedihkan tidak menentukan seluruh isi buku.
Ketika mendapat kepercayaan, jagalah dengan tanggung jawab. Ketika mendapat kesempatan, gunakan dengan sebaik-baiknya.
Jangan biarkan kesombongan membuatmu lupa bahwa setiap manusia memiliki kekurangan dan membutuhkan bantuan orang lain.
Kesuksesan sejati bukan hanya tentang apa yang berhasil kita kumpulkan, tetapi juga tentang kebaikan yang kita tinggalkan.
Jika ingin dihargai, mulailah dengan menghargai. Jika ingin dipercaya, mulailah dengan jujur. Jika ingin hidup damai, mulailah dengan menjaga hati.
Pada akhirnya, hidup bukan tentang siapa yang paling banyak dipuji, melainkan siapa yang tetap berbuat baik meskipun tidak ada yang melihat.
Jalani hari ini dengan penuh tanggung jawab, hadapi masalah dengan kebijaksanaan, dan tutup hari dengan rasa syukur. Sebab hidup yang baik tidak harus sempurna, cukup dijalani dengan hati yang tulus.

Kalau kamu menganggap resign adalah kegagalan, bagaimana dengan orang yang pindah kerja lalu hidupnya lebih baik? Kadang-kadang, meninggalkan sesuatu bukan berarti kalah; bisa jadi kamu akhirnya belajar memilih.
Kalau kamu sudah bekerja bertahun-tahun, jangan hanya menghitung berapa lama kamu bertahan. Hitung juga apa yang sudah kamu dapatkan: keterampilan, tabungan, pengalaman, kesehatan, dan kesempatan berkembang.
Kalau perusahaan bilang semua karyawan bisa diganti, kenapa kamu harus merasa bersalah ketika memilih mengganti perusahaan? 😂
Kalau kamu bekerja demi gaji, kenapa saat gaji tidak sebanding dengan pekerjaan kamu malah merasa tidak bersyukur? 🤯
Kalau perusahaan menghitung setiap menit keterlambatanmu, kenapa kamu tidak menghitung setiap menit lemburmu yang belum dibayar?
Kalau kamu takut resign karena perusahaan sudah nyaman, apakah kamu benar-benar nyaman atau cuma sudah terbiasa menderita? 🤣
Kalau kamu selalu memberikan yang terbaik untuk perusahaan, kapan giliran kamu memberikan yang terbaik untuk hidupmu sendiri?
Kalau kamu bekerja keras supaya bos bisa menikmati hasilnya, tetapi kamu sendiri tidak punya waktu menikmati hidup, siapa sebenarnya yang sedang naik kelas? 😂

Kalau setiap tahun tanggung jawabmu bertambah, tetapi gajimu tetap begitu-begitu saja, apakah kamu sedang naik jabatan atau sedang naik level kesulitan tanpa hadiah? 🤣
Kalau bos bilang, “Kita harus sama-sama berjuang demi perusahaan,” kenapa saat perusahaan untung besar kamu tetap harus berjuang membayar cicilan? 😂
Kalau kamu tidak masuk kerja sehari lalu merasa bersalah, tetapi perusahaan tidak pernah merasa bersalah ketika mengambil waktu istirahatmu, siapa yang sebenarnya terlalu banyak mengalah?
Kalau loyalitasmu tidak pernah ditulis dalam kontrak, kenapa kamu memperlakukannya seperti sumpah sehidup semati? 🤯
Kalau kamu bekerja sampai malam agar pekerjaan selesai, tetapi besok pekerjaan baru datang lagi, kapan kamu sadar bahwa pekerjaan itu tidak punya garis finis?
Kalau kamu selalu takut kehilangan pekerjaan, pernahkah kamu berpikir bahwa terlalu lama bertahan di tempat yang salah juga bisa membuatmu kehilangan kesempatan yang benar?
Kalau gaji naik 5 persen tetapi beban kerja naik 50 persen, apakah itu kenaikan gaji atau perusahaan sedang menguji kemampuanmu menghitung penderitaan? 🤣
Kalau perusahaan bilang kamu adalah aset, ingatlah bahwa aset biasanya dinilai dari manfaat dan nilainya. Jangan sampai kamu sendiri yang menurunkan nilai dirimu karena takut mencari tempat yang lebih menghargai kemampuanmu.
Kalau kamu rela mengorbankan waktu bersama anak demi lembur, siapa yang akan mengembalikan masa kecil anakmu ketika kamu akhirnya punya banyak uang?
Kalau kamu bertahan karena takut mulai dari nol, bukankah setiap hari kamu tetap memulai hari dengan masalah yang sama? Bedanya, kamu sudah hafal cara menderita di sana. 😂
Kalau kamu selalu mengerjakan tugas orang lain karena tidak enak menolak, jangan heran kalau mereka semakin santai. Kebaikan tanpa batas sering dianggap sebagai kewajiban oleh orang yang diuntungkan.
Kalau kamu menganggap cuti sebagai dosa, untuk apa hak cuti diberikan? Apakah perusahaan memberimu hak atau sekadar pajangan dalam peraturan karyawan?
Kalau kamu bekerja untuk membangun masa depan, tetapi tidak pernah punya waktu belajar hal baru, bukankah kamu sedang mempertaruhkan masa depan pada pekerjaan yang sekarang?
Kalau kamu selalu bilang, “Rezeki sudah ada yang mengatur,” apakah itu alasan untuk bertahan dalam keadaan buruk tanpa berusaha mencari peluang yang lebih baik? Berdoa itu penting, ikhtiar juga jangan pensiun. 😂
Kalau kamu sudah memberikan 100 persen tenaga setiap hari, lalu perusahaan terus meminta lebih, apakah kamu benar-benar kurang berusaha atau standar permintaannya yang tidak punya batas?
Kalau kamu merasa tidak enak resign karena takut merepotkan tim, apakah perusahaan juga merasa tidak enak ketika menambah beban kerja tanpa menambah jumlah karyawan?
Kalau kamu menghabiskan seluruh gaji untuk kebutuhan hidup akibat pekerjaan, lalu tidak punya tabungan untuk keluar dari pekerjaan itu, bukankah kamu perlu membangun strategi keuangan, bukan sekadar menambah jam kerja?
Kalau kamu terus menunggu perusahaan menghargaimu, sampai kapan kamu mau menunda langkah untuk meningkatkan kemampuan, mencari informasi gaji pasar, atau melamar ke tempat lain?
Kalau kamu bekerja keras demi membeli rumah, tetapi akibat pekerjaan kamu jarang pulang dengan pikiran tenang, rumah itu nanti menjadi tempat menikmati hidup atau tempat memulihkan diri dari pekerjaan? 🤯
Kalau kamu menganggap dirimu tidak punya pilihan selain bertahan, apakah benar tidak ada pilihan atau kamu belum mulai mencari pilihan lain?
Kalau kamu selalu mengorbankan diri demi perusahaan karena takut dianggap tidak loyal, ingatlah bahwa profesionalisme bukan berarti selalu berkata iya. Profesionalisme juga berarti tahu tanggung jawab, batas kemampuan, dan nilai diri sendiri.
Kalau hari ini kamu masih punya pekerjaan, jangan buru-buru resign hanya karena emosi. Tetapi jangan pula berhenti berkembang hanya karena takut kehilangan pekerjaan. Siapkan tabungan, tingkatkan keterampilan, bangun relasi, dan cari peluang sebelum keadaan memaksamu.
Kalau perusahaan adalah tempat kamu mencari nafkah, jangan sampai tempat mencari nafkah berubah menjadi tempat kamu kehilangan kesehatan, keluarga, harga diri, dan kesempatan hidup.
Bekerjalah seolah-olah kamu bertanggung jawab. Kembangkan dirimu seolah-olah masa depanmu bergantung padamu. Dan ingat, loyalitas kepada perusahaan tidak boleh membuatmu tidak loyal kepada kehidupanmu sendiri. 💯
Jangan terlalu berharap perusahaan memikirkan masa depanmu, karena direktur saja sedang memikirkan cara menghemat biaya, dan bisa jadi kamu termasuk biaya yang ingin dihilangkan. Hahaha.
Jangan merasa jadi aset perusahaan, karena aset yang dianggap terlalu mahal biasanya dijual, bukan dipertahankan.
Bekerjalah dengan baik, tapi jangan sampai mengira perusahaan akan menangis saat kamu resign. Bisa jadi surat pengunduran dirimu justru menjadi kabar baik di ruang direktur.
Jangan terlalu loyal pada perusahaan yang bahkan tidak tahu kapan ulang tahunmu, tetapi hafal tanggal keterlambatanmu.
Kamu rela mengorbankan waktu bersama keluarga demi perusahaan, sementara perusahaan tidak akan mengorbankan satu rupiah pun jika kamu dianggap tidak lagi menguntungkan.
Jangan bangga menjadi karyawan kesayangan. Bisa jadi kamu bukan kesayangan, cuma orang yang paling mudah disuruh.
Kamu pikir perusahaan membutuhkanmu? Tenang, mereka memang membutuhkan tenaga kerjamu, bukan seluruh hidupmu. Kalau kamu pergi, lowongan kerja tinggal dibuka lagi.
Jangan berharap perusahaan membalas pengorbananmu. Kamu menganggapnya perjuangan, perusahaan menganggapnya bagian dari deskripsi pekerjaan.
Lucu ya, saat perusahaan untung, itu keberhasilan manajemen. Saat perusahaan rugi, karyawan diminta memahami keadaan.
Jangan terlalu takut kehilangan pekerjaan sampai rela kehilangan harga diri. Perusahaan bisa mencari karyawan baru, tetapi waktu hidupmu tidak bisa dilamar kembali.
Kamu lembur sampai malam demi target perusahaan. Direktur tidur nyenyak karena target tercapai, sedangkan kamu pulang membawa kantuk dan uang lembur yang belum tentu sebanding.
Jangan mengira kerja keras otomatis membuatmu naik jabatan. Kadang kamu hanya menjadi terlalu berguna di posisi sekarang untuk dipindahkan ke posisi lain.
Perusahaan bilang, "Kita adalah keluarga." Tapi saat efisiensi dimulai, ternyata hubungan kekeluargaan bisa berakhir lewat email HRD.
Jangan berharap atasan memahami lelahmu jika yang dia lihat hanya angka di laporan. Bagi kamu itu perjuangan, bagi dia itu performa.
Kamu takut resign karena belum punya pekerjaan baru. Perusahaan juga tidak takut kamu resign, karena mereka sudah punya daftar pelamar baru.
Jangan merasa aman karena sudah bekerja bertahun-tahun. Masa kerja yang panjang bukan jaminan bahwa namamu tidak akan masuk daftar pengurangan karyawan.
Kamu mengira perusahaan sedang membangun masa depanmu. Padahal bisa jadi kamu sedang membangun masa depan perusahaan, sementara masa depanmu sendiri masih menunggu gajian.
Jangan sampai kamu mati-matian menyelamatkan perusahaan, tetapi perusahaan bahkan tidak mau menyelamatkanmu dari pekerjaan yang tidak manusiawi.
Perusahaan selalu bilang, "Karyawan adalah aset terpenting." Tapi anehnya, aset yang paling penting justru sering diminta bekerja lebih banyak dengan anggaran yang lebih sedikit.
Jangan terlalu bangga menjadi orang yang tidak tergantikan. Kadang perusahaan sengaja membuatmu merasa begitu agar kamu tidak berani meminta lebih.
Kamu mengorbankan kesehatan demi karier. Ketika sakit, perusahaan menyuruhmu istirahat, lalu mencari orang lain untuk mengerjakan pekerjaanmu.
Jangan berpikir perusahaan akan berhenti beroperasi jika kamu keluar. Bahkan kursi yang kamu duduki mungkin sudah menunggu pemilik baru sebelum kamu mengirim surat resign.
Kamu bekerja demi bonus tahunan, perusahaan menahan bonus demi efisiensi. Pada akhirnya, yang paling konsisten bekerja keras adalah harapanmu sendiri.
Jangan merasa bersalah mengambil cuti. Perusahaan tetap berjalan tanpa kehadiranmu, dan dunia tidak akan kiamat hanya karena emailmu baru dibalas besok.
Kamu takut mengecewakan atasan, tetapi pernahkah kamu berpikir bahwa atasanmu belum tentu takut mengecewakanmu?
Jangan terlalu sibuk membuktikan bahwa kamu pantas dipertahankan. Pastikan juga perusahaan pantas mendapatkan waktumu.
Saat kamu baru masuk, perusahaan menjanjikan kesempatan berkembang. Setelah kamu berkembang, perusahaan memberimu pekerjaan tambahan tanpa kenaikan gaji.
Kamu menganggap lembur sebagai bukti loyalitas. Direktur mungkin menganggapnya bukti bahwa pekerjaan sebanyak itu masih bisa diselesaikan tanpa menambah karyawan.
Jangan habiskan seluruh hidup untuk membuat perusahaan menjadi besar. Jangan sampai perusahaan punya gedung megah, sedangkan kamu tidak punya waktu untuk menikmati hasil kerjamu sendiri.
Jangan berharap semua pengorbananmu diingat. Dalam dunia kerja, hasil yang terlihat sering lebih diingat daripada perjuangan yang tidak pernah dilaporkan.
Kamu bertahan karena takut tidak mendapat pekerjaan lain. Perusahaan mempertahankanmu selama kamu masih dianggap menguntungkan. Bedanya, kamu membawa perasaan, perusahaan membawa perhitungan.
Jangan salah mengartikan pujian atasan sebagai jaminan masa depan. Kadang kalimat "Kamu memang bisa diandalkan" adalah kode bahwa pekerjaan tambahan akan segera datang.
Kamu merasa perusahaan adalah rumah kedua. Tapi kalau rumah pertama saja butuh biaya, jangan sampai rumah kedua justru menghabiskan seluruh hidupmu.
Jangan berharap perusahaan akan menaikkan gajimu hanya karena kamu sudah bekerja lebih keras. Kalau kamu tidak pernah berani membicarakan nilaimu, mereka mungkin menganggap harga sekarang sudah cukup.
Karyawan yang terlalu takut kehilangan pekerjaan sering lupa bahwa perusahaan juga seharusnya takut kehilangan karyawan yang berkualitas.
Jangan bekerja sampai lupa hidup. Saat kamu pensiun nanti, perusahaan mungkin mengadakan acara perpisahan satu jam, sementara kamu telah memberikan puluhan tahun hidupmu.
Kamu bisa menghabiskan bertahun-tahun membuat perusahaan maju, tetapi jangan lupa menyiapkan jalan agar hidupmu tetap maju meskipun suatu hari perusahaan tidak lagi membutuhkanmu.
Jangan terlalu berharap perusahaan memikirkanmu setiap malam. Direktur juga punya masalah sendiri, dan salah satu masalahnya mungkin bagaimana membuat biaya operasional lebih rendah besok pagi.
Kamu pikir perusahaan akan menyesal saat kamu pergi? Mungkin iya, mungkin tidak. Jadi, jangan jadikan penyesalan perusahaan sebagai ukuran keberhasilan hidupmu.
Jangan mengira kesetiaan tanpa batas akan membuatmu aman. Bahkan kontrak kerja saja punya tanggal berakhir, apalagi janji manis saat wawancara.
Perusahaan tidak wajib menjadi penyelamat hidupmu, tetapi kamu juga tidak wajib menjadikan perusahaan sebagai seluruh hidupmu.
Bekerjalah dengan profesional, bukan dengan harapan bahwa semua orang akan menghargai pengorbananmu. Sebab dunia kerja sering kali menghitung hasil, bukan air mata di perjalanan pulang.
Jangan takut perusahaan kehilanganmu. Takutlah jika bertahun-tahun kamu bekerja di sana, tetapi tidak punya tabungan, tidak punya keterampilan baru, dan tidak punya pilihan lain.
Paling lucu dalam dunia kerja: karyawan berharap perusahaan memikirkan kesejahteraannya, perusahaan berharap karyawan tidak meminta kenaikan gaji, dan keduanya berharap kondisi segera membaik.
Jangan terlalu percaya ketika perusahaan berkata, "Kami menghargai loyalitas." Buktikan lewat kebijakan, bukan hanya lewat kata-kata saat acara ulang tahun perusahaan.
Kamu bekerja keras agar perusahaan tidak kecewa. Tapi ingat, saat perusahaan mengambil keputusan yang merugikanmu, belum tentu mereka memikirkan kekecewaanmu dengan cara yang sama.
Jangan jadikan jabatan sebagai identitas hidupmu. Ketika jabatan itu hilang, kamu tetap manusia yang punya kemampuan, harga diri, dan kesempatan untuk memulai lagi.
Pada akhirnya, bekerjalah sebaik mungkin, tetapi jangan menyerahkan seluruh nasibmu kepada perusahaan. Karena perusahaan punya rencana bisnis, direktur punya target, HRD punya anggaran, dan kamu juga harus punya rencana hidup sendiri.
Jangan berharap perusahaan memikirkan masa depanmu, karena perusahaan sedang memikirkan masa depannya sendiri. Direktur berharap biaya turun, HRD berharap target terpenuhi, atasan berharap pekerjaan selesai, dan kamu berharap gaji naik.
Hahaha... ternyata kalian bekerja di tempat yang sama, tetapi punya harapan yang berbeda-beda!
Jangan terlalu bangga sudah mengabdi bertahun-tahun kepada perusahaan. Anjing saja setia bertahun-tahun, tapi setidaknya dia tidak pernah disuruh membuat laporan bulanan. Hahaha.
Jangan berharap perusahaan memikirkan masa depanmu. Kamu saja belum tentu masuk rencana jangka panjang mereka, tapi target bulan ini sudah pasti masuk.
Kamu pikir direktur tidak bisa tidur memikirkan kesejahteraanmu? Tenang, dia bisa tidur nyenyak. Yang tidak bisa tidur itu kamu, memikirkan cicilan dan gaji yang belum naik.
Karyawan bekerja untuk menghidupi keluarga, direktur bekerja untuk mengembangkan perusahaan. Masalahnya, ketika perusahaan untung, semua bicara prestasi. Ketika rugi, mendadak semua bicara pengorbanan karyawan.
Jangan merasa kamu orang penting hanya karena pekerjaan menumpuk di mejamu. Bisa jadi kamu bukan orang penting, cuma orang yang paling gampang diberi pekerjaan tambahan.
Perusahaan bilang, "Kita keluarga." Tapi anehnya, saat kamu butuh bantuan, kamu disuruh mengikuti prosedur. Saat perusahaan butuh bantuan, kamu disuruh punya rasa memiliki.
Kamu rela masuk kerja saat sakit demi perusahaan. Tapi kalau suatu hari perusahaan memutuskan hubungan kerja, jangan kaget kalau suratnya datang tanpa menanyakan apakah hatimu sedang sehat.
Jangan terlalu takut resign. Kamu bukan tahanan. Yang membuatmu bertahan seharusnya alasan yang masuk akal, bukan ketakutan yang dipelihara setiap hari.
Direktur berharap kamu bekerja maksimal, atasan berharap kamu tidak banyak mengeluh, HRD berharap semuanya sesuai anggaran. Lalu kamu berharap gaji cukup sampai akhir bulan. Ternyata yang paling besar harapannya justru yang gajinya paling kecil.
Kamu bekerja keras supaya perusahaan maju. Tapi kalau setiap tahun perusahaan semakin maju sementara hidupmu tetap di tempat, mungkin kamu perlu mengevaluasi siapa yang sebenarnya sedang kamu majukan.
Jangan bangga disebut karyawan andalan kalau andalan itu artinya semua pekerjaan dilempar kepadamu. Kamu bukan karyawan multitalenta, kamu sedang dijadikan solusi untuk kekurangan tenaga kerja.
Lucu dunia kerja. Saat perusahaan membutuhkanmu, kamu disebut aset berharga. Saat perusahaan ingin mengurangi biaya, kamu berubah menjadi angka di lembar anggaran.
Kamu takut kehilangan pekerjaan, sedangkan perusahaan tidak takut kehilangan waktu hidupmu. Bagimu satu hari lembur adalah pengorbanan, bagi mereka mungkin hanya satu baris dalam laporan operasional.
Jangan berharap atasan memahami bebanmu hanya karena dia pernah menjadi karyawan. Banyak orang yang dulu mengeluh saat berada di bawah, tetapi setelah duduk di atas, mendadak lupa rasanya menjadi bawahan.
Kamu sudah memberikan tenaga, pikiran, waktu, bahkan akhir pekanmu. Tetapi saat meminta kenaikan gaji, perusahaan bilang anggaran belum tersedia. Aneh, anggaran untuk pekerjaan tambahan selalu tersedia.
Kalau perusahaan benar-benar menganggapmu keluarga, seharusnya kesejahteraanmu tidak hanya dibahas ketika ada survei kepuasan karyawan.
Jangan terlalu bangga bekerja sampai larut malam. Mata panda bukan tanda kesuksesan, dan kurang tidur bukan prestasi yang pantas dipajang di CV.
Perusahaan bisa mengganti karyawan, tetapi kamu tidak bisa mengganti waktu yang hilang bersama anak, pasangan, dan orang tua. Jadi, jangan sampai kamu sukses di kantor tetapi terlambat hadir dalam kehidupan sendiri.
Kamu bekerja mati-matian demi promosi. Setelah naik jabatan, tanggung jawab bertambah, stres bertambah, tetapi kenaikan gaji seperti sedang menunggu mukjizat.
Jangan percaya bahwa semakin lama kamu bekerja, semakin aman posisimu. Kadang yang membuatmu bertahan bukan karena perusahaan takut kehilanganmu, tetapi karena biaya menggantimu belum masuk anggaran.
Kamu pikir loyalitas adalah jaminan masa depan. Padahal dalam dunia kerja, loyalitas tanpa kemampuan berkembang bisa membuatmu bertahun-tahun nyaman di tempat yang sama, sementara dunia sudah berlari jauh di depanmu.
Jangan selalu berkata, "Tidak apa-apa, saya kerjakan." Lama-lama perusahaan mengira kamu punya delapan tangan, dua kepala, dan tidak membutuhkan kehidupan pribadi.
Direktur punya target tahunan, manajer punya target bulanan, supervisor punya target harian, dan karyawan punya target bertahan hidup sampai gajian berikutnya.
Kalau perusahaan terus bilang kamu harus bersyukur punya pekerjaan, ingatlah bahwa perusahaan juga seharusnya bersyukur memiliki karyawan yang mau bekerja dengan baik.
Kamu takut bicara soal kenaikan gaji karena khawatir dianggap tidak loyal. Sementara perusahaan tidak takut menaikkan harga produknya karena ingin keuntungan lebih besar. Ternyata keberanian meminta lebih hanya dianggap salah ketika yang meminta adalah karyawan.
Jangan habiskan seluruh energimu untuk membuat atasan terlihat hebat. Jangan sampai presentasi dia yang mendapat pujian, pekerjaan kamu yang mendapat tambahan, dan namamu hanya muncul saat terjadi kesalahan.
Pekerjaanmu bisa menjadi bagian besar dari hidupmu, tetapi jangan biarkan pekerjaan membuatmu lupa bahwa kamu punya hidup di luar kantor.
Kalau setiap kali kamu cuti pekerjaan langsung berantakan, itu bukan bukti kamu tidak tergantikan. Bisa jadi perusahaan gagal membangun sistem yang sehat dan terlalu bergantung pada satu orang.
Kamu terus bekerja karena berharap suatu hari perusahaan menghargaimu. Pertanyaannya, kalau setelah bertahun-tahun kamu masih harus memohon untuk dihargai, apakah kamu sedang membangun karier atau sedang menunggu belas kasihan?
Jangan bangga ketika perusahaan berkata, "Kamu berbeda dari karyawan lain." Pastikan perbedaannya bukan karena kamu satu-satunya orang yang mau mengerjakan tiga pekerjaan dengan satu gaji.
Saat kamu melakukan kesalahan, perusahaan mengingatnya dalam evaluasi. Saat kamu menyelamatkan proyek, perusahaan menganggapnya bagian dari tanggung jawab. Begitulah hidup: kesalahan kadang perlu satu rapat, prestasi kadang cukup satu ucapan terima kasih.

Kita menghabiskan masa muda untuk mengejar uang, lalu menghabiskan uang untuk mengembalikan kesehatan. Setelah tua, kita menghabiskan waktu untuk mengenang masa muda yang dulu kita habiskan untuk mengejar uang.
Hahaha... ternyata hidup bukan tentang tidak punya waktu, tetapi tentang terlambat menyadari waktu yang kita punya.
Jangan terlalu serius membuktikan bahwa kamu lebih baik daripada orang lain. Sebab pada akhirnya, orang yang kamu kalahkan belum tentu peduli, orang yang kamu iri belum tentu bahagia, dan orang yang kamu kejar belum tentu menunggumu.
Jadi, jalani hidup sebaik mungkin. Jangan sibuk menjadi pemeran utama dalam cerita orang lain sampai lupa menulis ceritamu sendiri.
Sebab yang paling lucu dalam hidup adalah ketika kita sibuk mencari sesuatu yang membuat kita bahagia, tetapi lupa menikmati hal-hal sederhana yang sebenarnya sudah membuat kita bertahan.
Manusia rela mengorbankan kesehatan demi mencari uang, lalu menghabiskan uang demi mengembalikan kesehatan. Lucunya, ketika sehat punya waktu tetapi tidak punya uang, ketika punya uang justru tidak punya waktu. Sebenarnya kita sedang mencari kehidupan atau sedang sibuk membiayai kehidupan yang tidak sempat kita nikmati?
Kita takut kehilangan pekerjaan, tetapi tidak takut kehilangan waktu bersama keluarga. Padahal pekerjaan bisa mencari pengganti kita dalam hitungan minggu, sedangkan anak yang tumbuh besar tidak bisa diminta mengulang masa kecilnya hanya karena kita sedang sibuk.
Manusia sibuk membangun rumah yang besar agar keluarganya bahagia, tetapi terlalu sibuk bekerja sampai rumah itu jarang menjadi tempat berkumpul. Akhirnya rumahnya semakin megah, tetapi percakapannya semakin sedikit.
Kita ingin dihargai semua orang, sampai lupa bertanya apakah kita masih menghargai diri sendiri. Kita takut orang lain kecewa, tetapi setiap hari tidak masalah mengecewakan hati sendiri.
Lucunya manusia, ketika miskin ingin cepat kaya, ketika kaya takut kehilangan hartanya, ketika tua ingin kembali muda. Sepertinya masalah manusia bukan kekurangan sesuatu, melainkan terlalu sibuk menginginkan sesuatu yang belum dimiliki.
Kita menghabiskan masa muda untuk mengejar masa depan, lalu ketika masa depan tiba, kita merindukan masa muda yang sudah kita korbankan. Ternyata waktu tidak pernah mencuri apa pun. Kita sendirilah yang sering menukarkan waktu dengan hal-hal yang baru kita sesali kemudian.
Manusia rela berbohong demi terlihat hebat di mata orang lain, padahal orang lain juga sedang sibuk berpura-pura hebat. Akhirnya semua orang memakai topeng, lalu bertanya mengapa tidak ada yang benar-benar mengenal mereka.
Kita sering iri melihat kehidupan orang lain dari media sosial. Kita membandingkan kehidupan nyata kita yang penuh masalah dengan potongan terbaik kehidupan orang lain. Lalu kita menyebut diri sendiri gagal, hanya karena tidak hidup seperti seseorang yang bahkan tidak kita kenal.
Orang miskin sering dianggap gagal, orang kaya sering dianggap berhasil. Padahal uang bisa menjelaskan kemampuan membeli sesuatu, tetapi tidak selalu menjelaskan kualitas hati, ketenangan pikiran, atau kebahagiaan seseorang.
Kita sibuk mencari teman yang tulus, tetapi pernahkah kita memeriksa apakah kita sendiri tetap tulus ketika tidak mendapatkan keuntungan?
Manusia bisa mengingat hinaan seseorang selama bertahun-tahun, tetapi lupa mengingat sepuluh kebaikan yang pernah diterimanya. Satu luka dipelihara, seribu kebaikan dilewatkan. Lalu kita bertanya mengapa hati terasa penuh beban.
Kita ingin hidup panjang, tetapi sering menjalani hari tanpa benar-benar hadir. Makan sambil melihat layar, berkumpul sambil membalas pesan, berbicara sambil memikirkan pekerjaan. Kita ada di suatu tempat, tetapi pikiran kita selalu berada di tempat lain.
Jangan terlalu bangga karena berhasil mengalahkan orang lain. Kalau kemenanganmu membuatmu kehilangan keluarga, kesehatan, kejujuran, dan ketenangan, mungkin kamu menang dalam perlombaan yang salah.
Manusia sering berkata, "Nanti kalau sudah sukses, aku akan bahagia." Padahal tidak ada jaminan bahwa setelah mencapai satu tujuan, kita akan berhenti mengejar tujuan berikutnya. Kalau kebahagiaan selalu ditunda sampai semuanya sempurna, bisa jadi kita akan terus menundanya seumur hidup.
Kita sibuk mengumpulkan barang yang suatu hari akan ditinggalkan, tetapi pelit memberikan waktu kepada orang-orang yang juga suatu hari akan pergi. Barang bisa dibeli kembali. Waktu bersama orang yang sudah tiada tidak bisa dibeli dengan harga berapa pun.
Terkadang kita bukan benar-benar membutuhkan kehidupan baru. Kita hanya membutuhkan keberanian untuk berhenti menjalani kehidupan yang membuat kita terus-menerus kehilangan diri sendiri.
Manusia bisa menghabiskan bertahun-tahun membalas dendam kepada orang yang menyakitinya. Tanpa sadar, orang itu sudah melanjutkan hidup, sedangkan dirinya masih tinggal di kejadian yang sama. Bukankah menyedihkan jika seseorang yang pernah melukaimu juga berhasil mengambil bertahun-tahun kebahagiaanmu?
Kita sering berdoa agar masalah dihilangkan, tetapi jarang berdoa agar diberi kebijaksanaan untuk menghadapinya. Kita ingin jalan yang mudah, padahal terkadang yang perlu diubah bukan jalannya, melainkan cara kita berjalan.
Jangan menilai keberhasilan hidup hanya dari seberapa tinggi jabatanmu. Ketika sakit, jabatan tidak bisa menggantikan kesehatan. Ketika kesepian, uang tidak selalu bisa menggantikan ketulusan. Ketika kehilangan seseorang, pencapaian tidak bisa memutar waktu.
Kita sering terlalu sibuk memikirkan apa yang dikatakan orang yang tidak menyukai kita, sampai tidak punya waktu untuk menghargai orang yang benar-benar menyayangi kita.
Ada orang yang bekerja keras agar anaknya mendapatkan kehidupan lebih baik, tetapi tanpa sadar terlalu sibuk bekerja hingga anaknya hanya mengenal wajah orang tuanya dari foto. Niatnya membangun masa depan keluarga, tetapi jangan sampai masa depan itu dibangun dengan mengorbankan seluruh kebersamaan hari ini.
Jangan menunggu kehilangan baru belajar menghargai. Jangan menunggu sakit baru belajar menjaga tubuh. Jangan menunggu orang tua tiada baru menyesali waktu yang tidak pernah digunakan untuk mengobrol. Jangan menunggu hidup terasa kosong baru menyadari bahwa selama ini kita terlalu sibuk mengejar hal-hal yang tidak benar-benar kita butuhkan.
Kita ingin dunia berlaku adil kepada kita, tetapi terkadang kita sendiri tidak adil kepada orang lain. Kita meminta dimengerti, tetapi malas mendengarkan. Kita ingin dimaafkan, tetapi sulit memaafkan. Kita ingin dihormati, tetapi mudah merendahkan. Mungkin sebelum menuntut dunia berubah, ada beberapa hal dalam diri kita yang perlu diperbaiki.
Jangan mengira orang yang tertawa selalu bahagia. Jangan mengira orang yang diam selalu tidak punya masalah. Jangan mengira orang kaya selalu tenang. Jangan mengira orang miskin tidak punya kebahagiaan. Kita terlalu mudah menilai kehidupan orang lain dari bagian yang terlihat, padahal setiap manusia membawa cerita yang tidak seluruhnya kita ketahui.
Hidup ini aneh. Saat muda kita merasa waktu masih banyak, saat tua kita baru sadar waktu ternyata tidak pernah berjanji akan menunggu. Kita menunda meminta maaf, menunda berterima kasih, menunda memperbaiki diri, dan menunda menikmati kebersamaan. Kita bertindak seolah-olah besok adalah hak kita, padahal besok hanyalah kemungkinan.
Jangan terlalu sibuk membuktikan bahwa kamu orang baik. Jadilah orang baik bahkan ketika tidak ada yang melihat, tidak ada yang memuji, dan tidak ada keuntungan yang bisa kamu dapatkan. Sebab karakter bukan tentang bagaimana kamu terlihat di depan manusia, tetapi tentang bagaimana kamu bertindak ketika tidak ada yang akan memberimu penghargaan.
Kita sering takut memulai dari nol karena merasa sudah terlalu tua. Padahal usia yang bertambah tidak selalu berarti kesempatan sudah habis. Yang benar-benar menyedihkan bukan memulai terlambat, melainkan menghabiskan sisa waktu hanya untuk menyesali waktu yang sudah lewat.
Jangan habiskan hidup hanya untuk membuat orang lain kagum. Kekaguman mereka tidak akan selalu menemanimu ketika kamu jatuh. Bangunlah kehidupan yang tetap bermakna bahkan ketika tidak ada yang melihat, tidak ada yang bertepuk tangan, dan tidak ada yang tahu seberapa keras kamu berjuang.
Ada orang yang memiliki banyak harta tetapi tidak pernah merasa cukup. Ada orang yang memiliki sedikit tetapi masih mampu bersyukur. Ini bukan berarti kemiskinan harus dirayakan atau usaha untuk maju harus dihentikan. Ini berarti mengejar kehidupan yang lebih baik seharusnya tidak membuat kita buta terhadap kebaikan yang masih kita miliki hari ini.
Jangan menunggu semua masalah selesai untuk merasa tenang. Kehidupan manusia tidak pernah benar-benar bebas dari masalah. Saat satu masalah selesai, masalah lain mungkin datang. Jika ketenangan hanya boleh hadir ketika semuanya sempurna, kita mungkin tidak akan pernah benar-benar merasakannya.
Manusia sering menghabiskan hidup untuk mengejar pengakuan dari orang yang bahkan tidak akan mengingatnya beberapa tahun kemudian. Kita membeli sesuatu agar terlihat sukses, mengambil keputusan agar tidak diremehkan, dan menyembunyikan kesulitan agar tidak dianggap gagal. Sampai kapan kita mau menjadi tahanan dari penilaian orang lain?
Jangan mengira memaafkan berarti membenarkan kesalahan seseorang. Terkadang memaafkan adalah cara untuk berhenti membawa racun dari masa lalu ke dalam kehidupan hari ini. Kamu boleh menjaga jarak, menetapkan batas, dan melindungi diri tanpa harus menghabiskan seluruh hidup untuk membenci.
Kalau hari ini kamu masih punya kesempatan memperbaiki diri, jangan habiskan hari hanya untuk menyalahkan masa lalu. Masa lalu bisa menjelaskan mengapa kamu menjadi seperti sekarang, tetapi tidak harus menentukan siapa dirimu selamanya.
Kita lahir tanpa membawa apa-apa. Kita menghabiskan hidup mengejar banyak hal, bertengkar karena hal-hal itu, bahkan terkadang menyakiti orang lain demi mendapatkannya. Pada akhirnya, semua yang kita kumpulkan akan ditinggalkan, dan kehidupan akan terus berjalan tanpa menunggu kita.
Lalu pertanyaannya: apakah kita sedang benar-benar menjalani hidup, atau hanya sibuk mengumpulkan sesuatu untuk membuktikan bahwa kita pernah hidup?
Suatu hari, pekerjaanmu akan dilanjutkan orang lain. Jabatanmu akan diisi orang lain. Rumahmu mungkin akan ditempati orang lain. Nama yang hari ini begitu penting bagimu perlahan mungkin semakin jarang disebut.
Ini bukan alasan untuk menyerah. Justru ini alasan untuk berhenti menyia-nyiakan hidup demi hal-hal yang tidak sebanding dengan pengorbananmu.
Bekerjalah dengan sungguh-sungguh. Kejarlah impianmu. Bangun masa depanmu. Tetapi jangan lupa menjadi manusia di sepanjang perjalanan itu.
Bayangkan suatu hari kamu sudah tidak memiliki tenaga seperti sekarang. Kamu tidak bisa lagi mengulang masa muda, tidak bisa meminta orang yang sudah pergi untuk kembali, dan tidak bisa membeli satu hari tambahan dari waktu yang sudah berlalu.
Saat itu, kamu mungkin tidak akan menyesali setiap kesempatan yang gagal kamu ambil. Namun, kamu bisa saja menyesali begitu banyak kesempatan sederhana yang dulu kamu anggap tidak penting: makan bersama keluarga, mendengarkan cerita orang tua, meminta maaf lebih cepat, memeluk orang yang kamu sayangi, atau sekadar duduk menikmati hari tanpa merasa harus membuktikan sesuatu kepada siapa pun.
Jadi, jangan menunggu hidup mengajarkan semuanya melalui kehilangan.
Belajarlah ketika masih memiliki kesempatan.
Sayangi orang lain, tetapi jangan lupakan dirimu sendiri. Kejarlah kesuksesan, tetapi jangan kehilangan nurani. Berjuanglah untuk masa depan, tetapi jangan mengorbankan seluruh kebahagiaan hari ini.
Karena pada akhirnya, hidup bukan hanya tentang seberapa banyak yang berhasil kamu dapatkan, tetapi juga tentang seberapa banyak kebaikan yang kamu berikan, seberapa tulus kamu mencintai, seberapa bijaksana kamu memperlakukan sesama, dan seberapa sedikit penyesalan yang kamu tinggalkan.
Kita semua tahu bahwa hidup ini sementara, tetapi sering bertindak seolah-olah kita punya waktu tanpa batas.
Kita tahu uang tidak bisa membeli waktu, tetapi rela menjual hampir seluruh waktu demi uang.
Kita tahu kebencian melelahkan, tetapi terus memeliharanya.
Kita tahu orang yang kita cintai tidak akan selalu ada, tetapi sering menunda menunjukkan cinta.
Kita tahu hidup tidak harus sempurna untuk disyukuri, tetapi terus merasa kurang karena membandingkan diri dengan orang lain.
Mungkin masalah manusia bukan karena tidak tahu apa yang penting, melainkan karena terlalu sering melupakan hal-hal penting ketika mengejar sesuatu yang terlihat lebih mendesak.
Maka, sebelum hari ini berakhir, tanyakan kepada dirimu sendiri:
**Jika hidupmu terus berjalan seperti sekarang selama lima tahun ke depan, apakah kamu akan bersyukur karena sudah menjalaninya, atau justru menyesal karena terlalu lama mengabaikan hal-hal yang sebenarnya paling berarti?**

Aku nggak butuh motivasi pagi ini. Aku cuma butuh seseorang datang bawa nasi goreng dan bilang, “Tenang, semua tagihan sudah lunas.” 😭😂
Kalau tidur adalah pekerjaan, mungkin aku sudah jadi karyawan teladan. Datang tepat waktu, kerja tanpa mengeluh, bahkan lembur setiap malam. 🤣
Gabut bikin pikiran ke mana-mana. Awalnya mikirin makan siang, ujung-ujungnya mikirin kenapa dulu waktu kecil pengen cepat dewasa. 😂
Pengen punya pacar, tapi kalau ada yang chat malah bingung mau jawab apa. Ternyata masalahnya bukan nggak laku, tapi sistem komunikasi sedang gangguan. 🤣
Aku heran, kenapa waktu terasa cepat saat tidur dan terasa lama saat menunggu transferan. Apakah waktu juga punya masalah keuangan? 😂💸
Hari ini nggak ngapa-ngapain, tapi capeknya luar biasa. Mungkin otakku sedang kerja lembur memikirkan hal-hal yang nggak penting. 🤣
Kalau hidup ini film, punyaku kayaknya genre komedi absurd. Pemeran utamanya bingung, alurnya nggak jelas, dan ending-nya masih menunggu gajian. 😂
Lagi gabut sampai buka kalkulator cuma buat menghitung berapa hari lagi menuju tanggal gajian. Padahal gaji juga belum tentu cukup. 😭
Pengen jalan-jalan, tapi uang menolak. Pengen belanja, tapi saldo mengancam. Akhirnya jalan-jalan ke dapur, siapa tahu ada keajaiban. 🤣
Ada kalanya aku ingin menjadi ikan. Berenang santai, nggak mikirin tagihan, nggak mikirin masa depan. Tapi ingat, ikan juga bisa kena penggorengan. 😂
Kalau ada lomba rebahan sambil memikirkan masa depan, aku mungkin juara dunia. Sayangnya, hadiahnya cuma piagam dan rasa lapar. 🤣
Gabut itu berbahaya. Bisa-bisa kita mulai membaca chat lama, melihat foto lama, lalu bertanya, “Dulu kok aku sebodoh itu, ya?” 😂
Aku sudah mencoba mencari kesibukan. Hasilnya, aku menemukan remote TV yang hilang tiga hari, lalu lupa mau ngapain. Produktif sekali! 🤣
Kadang aku ingin hidup sederhana seperti kucing. Makan, tidur, menghilang, lalu muncul lagi saat lapar. Bedanya, kucing masih ada yang membiayai. 😂
Hari ini aku memutuskan untuk tidak memikirkan masalah. Tapi masalahnya malah penasaran, lalu datang berbondong-bondong. 🤣
Kalau gabut ada levelnya, aku sudah bukan pemula. Aku sudah level dewa, bisa menatap tembok selama 15 menit sambil membuat skenario hidup yang tidak akan pernah terjadi. 😂
Pengen produktif, akhirnya buka YouTube buat cari tutorial menjadi produktif. Tiga jam kemudian malah nonton cara memasak telur dadar. 🤣
Aku bukan nggak punya tujuan hidup. Aku cuma sedang menunggu petunjuk arah dari semesta. Kalau bisa sekalian petunjuk PIN ATM yang saldonya banyak. 😂
Gabut paling menyedihkan adalah saat mau curhat, tapi sadar masalahnya terlalu banyak sampai bingung harus mulai dari cicilan atau percintaan. 😭🤣
Kalau orang bilang waktu adalah uang, berarti aku sudah kaya banget karena punya banyak waktu luang. Tinggal cari cara menukarnya jadi uang beneran. 😂
Aku sering bertanya pada diri sendiri, sebenarnya aku ini sedang berjuang atau cuma sibuk bertahan hidup sambil menunggu hari libur? 🤣
Pengen berubah menjadi lebih baik, tapi setiap kali alarm berbunyi, niat baikku langsung minta perpanjangan waktu lima menit. 😂
Kadang aku tertawa sendiri melihat hidupku. Bukan karena bahagia, tapi karena kalau nggak ditertawakan, takutnya malah nangis sambil makan mi instan. 🤣
Gabut membuatku sadar bahwa ternyata aku punya banyak bakat terpendam. Salah satunya adalah tidur dalam berbagai posisi tanpa kehilangan kenyamanan. 😂
Kalau ada yang mencari aku, bilang saja sedang sibuk. Sibuk menatap layar HP, menunggu sesuatu yang bahkan aku sendiri nggak tahu apa. 🤣
Hidup itu misteri. Kita nggak tahu besok akan seperti apa. Tapi kalau melihat isi dompet sekarang, masa depan terasa seperti teka-teki yang jawabannya menyedihkan. 😂
Aku sudah berhenti berharap ada keajaiban hari ini. Sekarang aku cuma berharap tukang bakso lewat dan menerima pembayaran pakai senyuman. 🤣
Paling enak memang jadi orang santai. Masalah datang disambut, masalah pergi dilambaikan. Tapi kalau masalahnya utang, santainya langsung hilang. 😂
Kalau gabut sudah mencapai puncaknya, kita mulai membuka aplikasi yang sama berulang kali seolah-olah kehidupan baru akan muncul di halaman beranda. 🤣
Aku ingin melakukan sesuatu yang bermanfaat hari ini. Minimal membahagiakan penjual gorengan dengan membeli dagangannya. Ekonomi harus tetap berputar! 😂
Ternyata menjadi dewasa itu bukan tentang usia, melainkan tentang kemampuan tersenyum saat saldo tinggal sedikit dan tetap berkata, “Alhamdulillah, masih ada.” 😭🤣
Kesimpulan hari ini: jangan biarkan kegabutan menguasai hidupmu. Lawan dengan kegiatan positif, seperti makan, tidur, ngemil, lalu tidur lagi. Semangat para pejuang rebahan! 😂🤣

<script>
(function(){
  'use strict';
  var W=window.WA_DATA,G=W.groups;
  var D=[],gOf={},textG={};
  var mem={};
  var fav,mine,scr='cari',q='',catOpen=null,gf=-1,cur=[],ed=null,pendDel=null,baseH=window.innerHeight,toastTimer=null;
  var V=document.getElementById('v');

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function grad(g){var c=G[g]||G[0];return 'linear-gradient(135deg,'+c.a+','+c.b+')';}

  function ld(k,d){
    var v=null;
    try{v=window.localStorage.getItem(k);}catch(e){v=null;}
    if(v){try{return JSON.parse(v);}catch(e2){}}
    return mem[k]!==undefined?mem[k]:d;
  }
  function sv(k,v){mem[k]=v;try{window.localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  /* Membaca database teks sederhana: [Kategori] lalu satu baris = satu pesan */
  (function(){
    var lines=$('wa-data').textContent.split(/\r?\n/),rules=[],idx={},cat=null,k,j,t,n,m,gi;
    for(k=0;k<W.rules.length;k++){rules.push([W.rules[k][0],new RegExp(W.rules[k][1],'i')]);}
    for(k=0;k<lines.length;k++){
      t=lines[k].replace(/^\s+|\s+$/g,'');
      if(!t||t.charAt(0)==='#'){continue;}
      m=t.match(/^\[(.+)\]$/);
      if(m){
        n=m[1].replace(/^\s+|\s+$/g,'');
        if(idx[n]===undefined){
          gi=0;
          for(j=0;j<rules.length;j++){if(rules[j][1].test(n)){gi=rules[j][0];break;}}
          D.push({n:n,t:[],g:gi});idx[n]=D.length-1;gOf[n]=gi;
        }
        cat=D[idx[n]];
        continue;
      }
      if(!cat){continue;}
      t=t.replace(/^-\s+/,'').replace(/\\n/g,'\n');
      if(t){cat.t.push(t);textG[t]=cat.g;}
    }
  })();
  fav=ld('wa_fav',[]);mine=ld('wa_mine',[]);
  if(!(fav instanceof Array)){fav=[];}
  if(!(mine instanceof Array)){mine=[];}

  function toast(t){
    var e=$('toast');e.textContent=t;e.className='toast show';
    if(toastTimer){clearTimeout(toastTimer);}
    toastTimer=setTimeout(function(){e.className='toast';},1800);
  }

  function card(text,opt){
    opt=opt||{};
    var i=cur.length,on=fav.indexOf(text)>-1,g=(typeof opt.g==='number')?opt.g:(textG[text]!==undefined?textG[text]:0);
    cur.push({text:text,mine:opt.mine});
    return '<div class="card"><div class="cbar" style="background:'+grad(g)+'"></div>'+
      (opt.title?'<span class="ctag" style="background:'+grad(g)+'">'+esc(opt.title)+'</span>':'')+
      '<p>'+esc(text)+'</p>'+
      '<button class="wa" type="button" data-a="wa" data-i="'+i+'" style="background:'+grad(g)+'">💬 Kirim Chat</button>'+
      '<div class="mini"><button class="st'+(on?' on':'')+'" type="button" data-a="star" data-i="'+i+'">'+(on?'★':'☆')+'</button>'+
      '<button type="button" data-a="edit" data-i="'+i+'">✏️ Edit</button>'+
      '<button type="button" data-a="copy" data-i="'+i+'">📋 Salin</button>'+
      (opt.del?'<button class="del" type="button" data-a="del" data-i="'+i+'">🗑️</button>':'')+'</div></div>';
  }

  function render(top){
    cur=[];
    var h='',tabs=document.getElementsByClassName('tab'),i,c,cnt,gcount=[],chips='';
    for(i=0;i<tabs.length;i++){tabs[i].className='tab'+(tabs[i].getAttribute('data-s')===scr?' on':'');}
    if(scr==='cari'){
      h='<input class="search" id="q" type="text" placeholder="🔍 Cari kata kunci…" autocomplete="off" value="'+esc(q)+'"><div class="chips">';
      for(i=0;i<W.chips.length;i++){
        h+='<button class="chip q" type="button" data-a="cat" data-n="'+esc(W.chips[i][1])+'" style="background:'+grad(gOf[W.chips[i][1]]||0)+'">'+esc(W.chips[i][0])+'</button>';
      }
      h+='</div><div id="res"></div>';
      V.innerHTML=h;res();
    }else if(scr==='tpl'){
      if(catOpen!==null){
        c=null;for(i=0;i<D.length;i++){if(D[i].n===catOpen){c=D[i];break;}}
        if(!c){catOpen=null;render();return;}
        h='<button class="back" type="button" data-a="back">← Semua kategori</button><h2>'+esc(c.n)+'</h2>';
        for(i=0;i<c.t.length;i++){h+=card(c.t[i],{title:c.n,g:c.g});}
      }else{
        for(i=0;i<G.length;i++){gcount[i]=0;}
        for(i=0;i<D.length;i++){gcount[D[i].g]++;}
        chips='<div class="chips"><button class="chip'+(gf===-1?' on':'')+'" type="button" data-a="gf" data-g="-1"'+(gf===-1?' style="background:linear-gradient(135deg,#fb923c,#f472b6)"':'')+'>Semua '+D.length+'</button>';
        for(i=0;i<G.length;i++){
          chips+='<button class="chip'+(gf===i?' on':'')+'" type="button" data-a="gf" data-g="'+i+'"'+(gf===i?' style="background:'+grad(i)+'"':'')+'>'+G[i].e+' '+G[i].n+' '+gcount[i]+'</button>';
        }
        chips+='</div>';
        cnt=0;h='<div class="grid">';
        for(i=0;i<D.length;i++){
          if(gf!==-1&&D[i].g!==gf){continue;}
          cnt++;
          h+='<button class="tile" type="button" data-a="cat" data-n="'+esc(D[i].n)+'"><span class="tbar" style="background:'+grad(D[i].g)+'"></span><span class="tem" style="background:'+grad(D[i].g)+'">'+G[D[i].g].e+'</span><span class="tn">'+esc(D[i].n)+'</span><small>'+D[i].t.length+' pesan</small></button>';
        }
        h=chips+'<h2>'+cnt+' kategori</h2>'+h+'</div>';
      }
      V.innerHTML=h;
    }else if(scr==='fav'){
      h='<h2>⭐ Favorit</h2>';
      if(fav.length){for(i=0;i<fav.length;i++){h+=card(fav[i],{del:1});}}
      else{h+='<div class="empty"><i>⭐</i>Belum ada favorit.<br>Tekan ☆ pada pesan untuk menyimpannya di sini.</div>';}
      V.innerHTML=h;
    }else{
      h='<button class="btn-new" type="button" data-a="new">+ Tambah template</button>';
      if(mine.length){
        for(i=0;i<mine.length;i++){h+=card(mine[i].text,{title:mine[i].title+' · '+mine[i].cat,mine:mine[i].id,del:1,g:(gOf[mine[i].cat]!==undefined?gOf[mine[i].cat]:0)});}
      }else{h+='<div class="empty"><i>✍️</i>Belum ada template buatanmu.<br>Tekan tombol di atas untuk membuat yang pertama.</div>';}
      V.innerHTML=h;
    }
    if(top){$('v').scrollTop=0;}
  }

  function res(){
    var s=q.toLowerCase().replace(/^\s+|\s+$/g,''),r=$('res'),o='',n=0,i,j,c,m;
    cur=[];
    if(!r){return;}
    if(!s){r.innerHTML='<div class="empty"><i>🔍</i>Ketik kata kunci atau pilih pintasan di atas.</div>';return;}
    for(i=0;i<D.length;i++){
      c=D[i];
      for(j=0;j<c.t.length;j++){
        if(n<60&&(c.n+' '+c.t[j]).toLowerCase().indexOf(s)>-1){n++;o+=card(c.t[j],{title:c.n,g:c.g});}
      }
    }
    for(i=0;i<mine.length;i++){
      m=mine[i];
      if((m.title+m.text+m.cat).toLowerCase().indexOf(s)>-1){n++;o+=card(m.text,{title:m.title,mine:m.id,g:(gOf[m.cat]!==undefined?gOf[m.cat]:0)});}
    }
    r.innerHTML=o||'<div class="empty"><i>🤷</i>Tidak ditemukan.<br>Coba kata kunci lain.</div>';
  }

  function fb(t){
    var a=document.createElement('textarea'),ok=false;
    a.value=t;a.style.position='fixed';a.style.left='-1000px';
    document.body.appendChild(a);a.focus();a.select();
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    document.body.removeChild(a);
    toast(ok?'Tersalin':'Gagal menyalin');
  }
  function copy(t){
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(function(){toast('Tersalin');},function(){fb(t);});
        return;
      }
    }catch(e){}
    fb(t);
  }
  function wa(t){
    var url='https://wa.me/?text='+encodeURIComponent(t),b=window.AndroidBridge;
    try{if(b&&typeof b.openUrl==='function'){b.openUrl(url);return;}}catch(e){}
    window.location.href=url;
  }
  function star(t){
    var i=fav.indexOf(t);
    if(i>-1){fav.splice(i,1);}else{fav.push(t);}
    sv('wa_fav',fav);
  }
  function findMine(id){var i;for(i=0;i<mine.length;i++){if(String(mine[i].id)===String(id)){return mine[i];}}return null;}

  function openM(mode,item,src){
    var mc=$('mc'),isN=(mode==='new'||mode==='mine'),m=null,o='',i;
    ed={mode:mode,item:item,src:src};
    for(i=0;i<D.length;i++){o+='<option value="'+esc(D[i].n)+'">'+esc(D[i].n)+'</option>';}
    mc.innerHTML=o;
    $('mj').style.display=isN?'block':'none';
    mc.style.display=isN?'block':'none';
    $('mh').style.display=(mode==='tpl')?'block':'none';
    $('mt').textContent=mode==='new'?'Template baru':'Edit pesan';
    $('mx').value=item?item.text:'';
    $('mj').value='';
    if(mode==='mine'){m=findMine(item.mine);if(m){$('mj').value=m.title;mc.value=m.cat;}}
    $('m').className='backdrop show';
  }
  function closeM(){$('m').className='backdrop';try{$('mx').blur();$('mj').blur();}catch(e){}}
  function saveM(){
    var t=$('mx').value.replace(/^\s+|\s+$/g,''),j,c,m,old,k,old2,k2;
    if(!t){toast('Isi pesan masih kosong');return;}
    j=$('mj').value.replace(/^\s+|\s+$/g,'')||'Template saya';c=$('mc').value;
    if(ed.mode==='new'){mine.push({id:Date.now(),title:j,cat:c,text:t});sv('wa_mine',mine);}
    else if(ed.mode==='mine'){
      m=findMine(ed.item.mine);
      if(m){old=m.text;m.title=j;m.cat=c;m.text=t;k=fav.indexOf(old);if(k>-1){fav[k]=t;sv('wa_fav',fav);}sv('wa_mine',mine);}
    }else{
      old2=ed.item.text;k2=fav.indexOf(old2);
      if(ed.src==='fav'&&k2>-1){fav[k2]=t;}else if(fav.indexOf(t)<0){fav.push(t);}
      sv('wa_fav',fav);
    }
    closeM();toast('Tersimpan');render();
  }

  function openDel(it){pendDel={it:it,src:scr};$('dm').className='backdrop mid show';}
  function closeDel(){$('dm').className='backdrop mid';pendDel=null;}
  function doDel(){
    var it,src,k;
    if(!pendDel){return;}
    it=pendDel.it;src=pendDel.src;
    if(src==='fav'){k=fav.indexOf(it.text);if(k>-1){fav.splice(k,1);sv('wa_fav',fav);}}
    else{
      mine=mine.filter(function(x){return String(x.id)!==String(it.mine);});sv('wa_mine',mine);
      k=fav.indexOf(it.text);if(k>-1){fav.splice(k,1);sv('wa_fav',fav);}
    }
    closeDel();toast('Dihapus');render();
  }

  function upTo(el){
    var n=el,k=0;
    while(n&&k<4){
      if(n.getAttribute&&(n.getAttribute('data-s')||n.getAttribute('data-a'))){return n;}
      n=n.parentNode;k++;
    }
    return null;
  }

  function onClick(e){
    var b=upTo(e.target),a,it,s;
    if(!b){return;}
    s=b.getAttribute('data-s');
    if(s){scr=s;if(scr!=='tpl'){catOpen=null;}render(true);return;}
    a=b.getAttribute('data-a');
    it=cur[parseInt(b.getAttribute('data-i'),10)];
    if(a==='cat'){catOpen=b.getAttribute('data-n');scr='tpl';render(true);}
    else if(a==='back'){catOpen=null;render(true);}
    else if(a==='gf'){gf=parseInt(b.getAttribute('data-g'),10);render();}
    else if(a==='new'){openM('new',null,scr);}
    else if(!it){return;}
    else if(a==='star'){star(it.text);if(scr==='cari'){res();}else{render();}}
    else if(a==='copy'){copy(it.text);}
    else if(a==='wa'){wa(it.text);}
    else if(a==='edit'){openM(it.mine?'mine':'tpl',it,scr);}
    else if(a==='del'){openDel(it);}
  }

  function checkKeyboard(){
    var h=window.innerHeight;
    if(h>baseH){baseH=h;}
    $('app').className=(baseH-h>120)?'app kb':'app';
  }

  window.onPhotosPicked=function(){};
  window.androidBack=function(){
    if($('m').className.indexOf('show')>-1){closeM();return true;}
    if($('dm').className.indexOf('show')>-1){closeDel();return true;}
    if(scr==='tpl'&&catOpen!==null){catOpen=null;render(true);return true;}
    if(scr!=='cari'){scr='cari';catOpen=null;render(true);return true;}
    return false;
  };

  function init(){
    var total=0,i;
    for(i=0;i<D.length;i++){total+=D[i].t.length;}
    $('sub').textContent=D.length+' kategori, '+total+' pesan siap kirim';
    document.addEventListener('click',onClick);
    document.addEventListener('input',function(e){if(e.target&&e.target.id==='q'){q=e.target.value;res();}});
    document.addEventListener('contextmenu',function(e){
      var t=e.target;
      if(!t||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA')){e.preventDefault();}
    });
    $('mclose').addEventListener('click',closeM);
    $('mcopy').addEventListener('click',function(){copy($('mx').value);});
    $('mwa').addEventListener('click',function(){wa($('mx').value);});
    $('msave').addEventListener('click',saveM);
    $('dcancel').addEventListener('click',closeDel);
    $('dok').addEventListener('click',doDel);
    $('m').addEventListener('click',function(e){if(e.target===this){closeM();}});
    $('dm').addEventListener('click',function(e){if(e.target===this){closeDel();}});
    window.addEventListener('resize',checkKeyboard);
    render();
    var s=$('splash');
    if(s&&s.parentNode){s.parentNode.removeChild(s);}
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
  else{init();}
})();
</script>
</body>
</html>
